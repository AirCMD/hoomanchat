function drawNPCHead(n,species,coat,accent){

 if(ears){

   if(species==='rabbit'){ctx.ellipse(23,-54,11,35,-.18,0,Math.PI*2)}
   else {ctx.moveTo(13,-22);ctx.lineTo(22,species==='fox'?-65:-51);ctx.lineTo(39,-23);ctx.closePath()}
   ctx.fillStyle=face;ctx.fill();ctx.strokeStyle='#414459';ctx.lineWidth=2;ctx.stroke();
   ctx.beginPath();ctx.moveTo(20,-27);ctx.lineTo(24,species==='rabbit'?-75:-44);ctx.lineTo(32,-26);ctx.fillStyle=dark?'#555369':'#b993a8';ctx.fill();ctx.restore()}
 }
 if(species==='shark'){ctx.beginPath();ctx.moveTo(-12,-33);ctx.lineTo(0,-66);ctx.lineTo(18,-33);ctx.fillStyle=face;ctx.fill()}
 ellipse(0,0,species==='fox'?41:39,species==='human'?40:36,face);
 if(n.id==='alter_core'||n.id==='akira_bakeneko'||n.id==='la_cyber'){
  ctx.fillStyle=n.id==='akira_bakeneko'?'#6c493a':n.id==='la_cyber'?'#172832':'#171a28';
  ctx.beginPath();ctx.moveTo(-37,-7);ctx.quadraticCurveTo(-35,-47,1,-38);ctx.quadraticCurveTo(34,-40,38,-11);ctx.lineTo(22,-22);ctx.lineTo(7,-27);ctx.lineTo(-6,-12);ctx.lineTo(-19,-24);ctx.lineTo(-35,2);ctx.closePath();ctx.fill();
 }
 if(n.id==='yoyo_tchi'){
  drawRounded(-38,-39,76,12,5,'#40935c');drawRounded(-20,-53,49,17,8,'#40935c');
 }
 if(n.id==='dreaming_romance'){ctx.strokeStyle='#d9d5ac';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-23,8,.65,Math.PI*1.5);ctx.stroke()}
 const eye=n.id==='wolf_fang'?'#f4d84f':n.id==='yuki_foxy'?'#64cafa':n.id==='akira_bakeneko'?'#6bbcee':n.id==='la_cyber'?'#39e7e7':n.id==='water_blue'?'#102d48':'#27293a';
 for(const side of [-1,1]){ellipse(side*15,-2,5.4,7.4,eye);ellipse(side*14,-5,1.8,2.6,'#ffffff')}
 if(species==='fox'||species==='wolf'||species==='cat'||species==='weasel'){
  ellipse(0,15,23,12,dark?'#454450':'#f4e8e2');ctx.beginPath();ctx.moveTo(-5,10);ctx.lineTo(5,10);ctx.lineTo(0,15);ctx.closePath();ctx.fillStyle=n.id==='yuki_foxy'?'#57b7e3':'#554859';ctx.fill();
 }else if(species==='shark'){
  ellipse(0,15,23,10,'#dceaf0');ctx.beginPath();ctx.moveTo(-14,12);ctx.lineTo(14,12);ctx.strokeStyle='#315369';ctx.lineWidth=2;ctx.stroke();
 }else{ellipse(0,11,3,2,'#684c55')}
 ctx.beginPath();ctx.arc(0,16,5,0,Math.PI);ctx.strokeStyle=dark?'#d8d5e0':'#66505d';ctx.lineWidth=2;ctx.stroke();
 if(n.id==='la_cyber'){ctx.strokeStyle='#27eee8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-37,-3);ctx.lineTo(-25,13);ctx.moveTo(37,-3);ctx.lineTo(25,13);ctx.stroke()}
 if(n.id==='water_blue'){for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*33,4);ctx.lineTo(side*48,-6);ctx.lineTo(side*35,20);ctx.fillStyle=face;ctx.fill()}}

function drawNPCFigure(n,x,y,size=1){
 const [coat,accent,species]=NPC_COSTUMES[n.id]||['#44536a','#a3d7f5','human'];
 const img=NPC_IMAGES[n.id],bounce=Math.sin(clock*2.4+n.name.length)*2,walk=Math.sin(clock*3+n.name.length)*.23;
 const z=Math.max(.72,Math.min(1.24,size));
 ctx.save();ctx.translate(x,y+bounce);ctx.scale(z,z);
 ellipse(0,0,36,9,'#12203977');
 // Хвіст та вуха є частинами однієї 2D-фігури, не просто аватаркою у кімнаті.
 if(['cat','fox','wolf','weasel'].includes(species)){ctx.beginPath();ctx.moveTo(23,-45);ctx.bezierCurveTo(69,-61,71,-14,49,-20);ctx.strokeStyle=species==='fox'?'#d99d70':coat;ctx.lineWidth=13;ctx.lineCap='round';ctx.stroke()}
 if(species==='shark'){ctx.beginPath();ctx.moveTo(0,-96);ctx.lineTo(13,-116);ctx.lineTo(24,-91);ctx.closePath();ctx.fillStyle='#6cb7d9';ctx.fill()}
 // ноги, тулуб і руки анімуються незалежно
 for(const side of [-1,1]){ctx.save();ctx.translate(side*15,-22);ctx.rotate(side*walk);line(0,0,side*2,23,'#b5b2b9',12);ellipse(side*2,23,10,5,coat);ctx.restore()}
 drawRounded(-27,-75,54,55,20,coat);drawRounded(-15,-65,30,34,11,accent);
 for(const side of [-1,1]){ctx.save();ctx.translate(side*25,-68);ctx.rotate(side*(.12+walk));line(0,0,side*12,32,coat,13);ellipse(side*12,32,7,7,'#c9bfc5');ctx.restore()}
 // Голова NPC намальована окремо. Аватар НЕ використовується як текстура голови.
 drawNPCHead(n,species,coat,accent);
 // персонаж повинен бути добре помітним у кімнаті
 drawRounded(-54,9,108,21,7,'#0e203bdc');ctx.fillStyle='#e8ffff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(n.name,0,24,103);
 ctx.restore();
}

function maybeAction(){if(walkTarget||clock<nextAction||clock<actionUntil)return;const choices=['wave','jump','dance','spin'];action=choices[Math.floor(Math.random()*choices.length)];actionUntil=clock+(action==='dance'?2.3:action==='spin'?1.5:1.7);nextAction=actionUntil+5+Math.random()*9}
function render(t){let dt=Math.min((t-lastTime)/1000||0,.05);lastTime=t;clock+=dt;ctx.clearRect(0,0,W,H);if(state.location==='home'||state.location==='npc')drawHome();else drawScenery();updateVisitor();drawNPCVisit();maybeAction();if(clock>=actionUntil)action='idle';let p=getPetPos();if(walkTarget){let dx=walkTarget.x-p.x,dy=walkTarget.y-p.y,d=Math.hypot(dx,dy),q=world();if(d<3){walkTarget=null}else{let speed=120,travel=Math.min(d,speed*dt);if(state.location==='home'||state.location==='npc'){pet.x+=(dx/d)*travel/Math.min(W*.33,310);pet.y+=(dy/d)*travel/Math.min(H*.24,125)}else{pet.x+=(dx/d)*travel/q.rx;pet.y+=(dy/d)*travel/q.ry;}pet.dir=dx<0?-1:1;pet.step+=dt*11}}const scale=Math.max(.69,Math.min(1.1,W/650));puppet(ctx,p.x,p.y,scale);if(placing){ctx.save();ctx.globalAlpha=.7;drawFurniture(placing,p.x+85,p.y-22);ctx.restore()}requestAnimationFrame(render)}

function b64encode(s){const bytes=new TextEncoder().encode(s);let result='';for(let i=0;i<bytes.length;i++)result+=String.fromCharCode(bytes[i]);return btoa(result).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64decode(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
body.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id,v=b.dataset.val;
 if(act==='giveNPC'){if(!selectedNPC)return;let id=document.getElementById('npcGiftSelect')?.value;if(!ITEMS[id]||!state.owned[id]){toast('Немає предмета для подарунка');return}state.owned[id]--;if(!Array.isArray(state.npcGifts[selectedNPC.id]))state.npcGifts[selectedNPC.id]=[];state.npcGifts[selectedNPC.id].push({item:id,time:Date.now()});save();toast(selectedNPC.name+' отримав подарунок: '+ITEMS[id].name+' 🎁');showPanel();return}
 if(act==='copyFriendCode'){try{await navigator.clipboard.writeText(state.friendId);toast('Код друга скопійовано')}catch{toast('Скопіюй код вручну')}return}
 if(act==='addFriend'){let name=safeStr(document.getElementById('friendName')?.value.trim(),32),code=safeStr(document.getElementById('friendCode')?.value.trim().toUpperCase(),48);if(!name||!/^PROTO-[A-Z0-9]{8}$/.test(code)){toast('Вкажи ім’я та правильний код PROTO-XXXXXXXX');return}if(code===state.friendId||state.friends.some(f=>f.code===code)){toast('Такий контакт уже є або це твій код');return}if(state.friends.length>=80){toast('Список друзів заповнений');return}state.friends.push({name,code});save();showPanel();toast('Друга додано до книги!');return}
 if(act==='removeFriend'){let i=Number(b.dataset.index);if(Number.isInteger(i)&&i>=0&&i<state.friends.length){state.friends.splice(i,1);save();showPanel()}return}
 if(act==='shopTab'){shopCategory=v;showPanel();return}if(act==='invTab'){invCategory=v;showPanel();return}if(act==='wardTab'){wardrobeCategory=v;showPanel();return}if(act==='faceWardrobe'){wardrobeCategory='face';openPanel('wardrobe');return}
 if(act==='buy'){let it=ITEMS[id];if(!it||state.coins<it.price)return;state.coins-=it.price;state.owned[id]=(state.owned[id]||0)+1;save();toast(`Придбано: ${it.name}`);showPanel();return}
 if(act==='eat'){if(!state.owned[id])return;state.owned[id]--;state.happiness=Math.min(100,state.happiness+5);state.coins+=5;save();toast('Смачно! +5 монет за турботу 🥰');showPanel();return}

 if(act==='collectFurniture'){for(let p of [...state.placed,...state.homePlaced])if(ITEMS[p.id])state.owned[p.id]=(state.owned[p.id]||0)+1;state.placed=[];state.homePlaced=[];save();toast('Усі меблі повернуто');showPanel();return}
 if(act==='earnCoins'){state.coins+=30;save();toast('Отримано 30 монет за тестове завдання');showPanel();return}
 if(act==='reset'){if(confirm('Стерти прогрес і почати нову гру?')){state=defaults();pet.x=0;pet.y=0;walkTarget=null;save();updateLocationUI();closePanel();toast('Нову гру розпочато')}}
 if(act==='exportSave'){const t=document.getElementById('saveText');t.value=JSON.stringify(state);t.select();try{await navigator.clipboard.writeText(t.value);toast('Резервну копію скопійовано')}catch{toast('Скопіюй текст резервної копії вручну')}return}
 if(act==='importSave'){try{let obj=JSON.parse(document.getElementById('saveText').value);if(typeof obj!=='object'||!obj||!obj.owned||!obj.appearance)throw Error();if(!confirm('Замінити поточне збереження імпортованим?'))return;localStorage.setItem(STORAGE,JSON.stringify(obj));load();save();showPanel();toast('Збереження імпортовано')}catch{toast('Помилка: неправильний формат збереження')}return}
 if(act==='sendGift'){let sel=document.getElementById('giftItem'),sender=document.getElementById('sender');if(!sel||!ITEMS[sel.value]||!state.owned[sel.value]){toast('Немає доступного предмета');return}let id=sel.value;let unique=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let payload={v:1,id,from:safeStr(sender.value,24),nonce:unique.slice(0,40)};let code='PT1-'+b64encode(JSON.stringify(payload));state.owned[id]--;state.giftSent.push(payload.nonce);state.giftSent=state.giftSent.slice(-200);save();document.getElementById('giftOutput').innerHTML=`<p class="section-title">Код створено. Передай його другу:</p><textarea class="field" id="generatedCode" readonly></textarea><button class="secondary" data-act="copyGift">Копіювати код</button><p class="note">Предмет списаний локально. Це не захищає від дублювання кодів.</p>`;document.getElementById('generatedCode').value=code;return}
 if(act==='copyGift'){let el=document.getElementById('generatedCode');if(!el)return;try{await navigator.clipboard.writeText(el.value);toast('Код скопійовано')}catch{el.select();toast('Скопіюй виділений код вручну')}return}
 if(act==='receiveGift'){try{let code=document.getElementById('giftInput').value.trim();if(!code.startsWith('PT1-')||code.length>2500)throw Error();let gift=JSON.parse(b64decode(code.slice(4)));if(gift.v!==1||!ITEMS[gift.id]||typeof gift.nonce!=='string'||gift.nonce.length>80||!gift.nonce)throw Error();if(state.giftHistory.includes(gift.nonce)){toast('Цей код уже використано в цьому браузері');return}state.giftHistory.push(gift.nonce);state.giftHistory=state.giftHistory.slice(-200);state.owned[gift.id]=(state.owned[gift.id]||0)+1;save();toast(`Подарунок від ${safeStr(gift.from,24)||'друга'}: ${ITEMS[gift.id].name}!`);showPanel()}catch{toast('Невірний код подарунка')}return}

// --- Три автономні мініігри. Монети надходять у загальний баланс. ---
const mgOverlay=document.getElementById('minigameOverlay');
const mgContent=document.getElementById('mgContent');
const mgTitle=document.getElementById('mgTitle');
let mini=null,miniFrame=0,miniLast=0;
const MG_W=520, MG_H=345;
function stopMini(){if(miniFrame)cancelAnimationFrame(miniFrame);miniFrame=0;mini=null}
function closeMini(){stopMini();mgOverlay.classList.remove('visible');mgOverlay.setAttribute('aria-hidden','true')}
function revealMini(title){mgTitle.textContent=title;mgOverlay.classList.add('visible');mgOverlay.setAttribute('aria-hidden','false')}
function showGamesMenu(){stopMini();revealMini('🎮 АРКАДА / Прото-Тип');mgContent.innerHTML=`<p class="mgHelp">Заробляй монетки в трьох іграх. Нагороди автоматично потрапляють у загальний гаманець.</p><div class="mgTiles"><button class="mgTile" data-mini="flies"><span class="symbol">🪰</span><strong>Лови комах</strong><small>Мухи, мошки, комарі · 30 с</small></button><button class="mgTile" data-mini="heart"><span class="symbol">💗</span><strong>Сердечний клікер</strong><small>Натискай, збирай сердечка · 20 с</small></button><button class="mgTile" data-mini="dream"><span class="symbol">🌙</span><strong>Лови сни</strong><small>Лови добрі сни, оминай кошмари · 30 с</small></button></div>`}
function miniStats(){return `<div class="mgStats"><span id="mgScore">Бали: 0</span><span id="mgTimer">Час: 30</span><span id="mgPotential">Нагорода: 0 🪙</span></div>`}
function mgReward(g){if(g.type==='flies')return Math.min(300,Math.floor(g.score/2));if(g.type==='heart')return Math.min(300,Math.floor(g.score/20)*10);return Math.min(300,Math.floor(g.score/2))}
function mgUpdateHud(){if(!mini)return;document.getElementById('mgScore').textContent=(mini.type==='heart'?'Сердечка: ':'Бали: ')+mini.score;document.getElementById('mgTimer').textContent='Час: '+Math.ceil(mini.remaining)+' с';document.getElementById('mgPotential').textContent='Нагорода: '+mgReward(mini)+' 🪙'}
function miniStart(type){if(!['flies','heart','dream'].includes(type))return;stopMini();const dur=type==='heart'?20:30;mini={type,score:0,remaining:dur,objects:[],spawn:0,basket:260,ended:false};miniLast=performance.now();let name={flies:'🪰 ЛОВИ КОМАХ',heart:'💗 СЕРДЕЧНИЙ КЛІКЕР',dream:'🌙 ЛОВИ СНИ'}[type];revealMini(name);
if(type==='heart')mgContent.innerHTML=miniStats()+`<p class="mgHelp">Натискай сердечко якомога швидше. За кожні 20 сердечок отримуєш 10 монет.</p><button id="heartTap" aria-label="Зібрати сердечко">💗</button>`;
else mgContent.innerHTML=miniStats()+`<canvas id="mgCanvas" width="${MG_W}" height="${MG_H}" aria-label="Ігрове поле"></canvas><p class="mgHelp">${type==='flies'?'Натискай на комах: 🦟 комар +15, 🪰 муха +10, мошка +5. Промахи не штрафуються.':'Рухай кошик унизу пальцем або мишею. ⭐ зоря +10, 🌙 місяць +15, ✨ іскра +5. Фіолетовий кошмар −10.'}</p>`;
mgUpdateHud();miniFrame=requestAnimationFrame(miniTick)}
function miniFinish(){if(!mini||mini.ended)return;let g=mini;g.ended=true;const earned=mgReward(g);state.coins+=earned;save();mini=null;miniFrame=0;mgContent.innerHTML=`<div class="mgResult"><div class="big">${g.type==='flies'?'🪰':g.type==='heart'?'💖':'🌠'}</div><h2>Раунд завершено!</h2><p>${g.type==='heart'?'Зібрано сердечок':'Набрано балів'}: <b>${g.score}</b></p><h2 style="color:#9bf9de">+${earned} 🪙</h2><p class="mgHelp">Монети вже нараховані в загальний баланс.</p><div class="mgActionRow"><button class="mgButton" data-mini="${g.type}">↻ Ще раз</button><button class="mgButton" data-mini="menu">🎮 Усі ігри</button></div></div>`}
function addMiniObject(g){if(g.type==='flies'){const roll=Math.random();const kind=roll<.25?0:roll<.65?1:2;g.objects.push({x:30+Math.random()*460,y:36+Math.random()*250,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*70,life:2+Math.random()*1.4,kind,r:kind===0?18:kind===1?21:13,phase:Math.random()*6.28})}
else{const kind=Math.random()<.18?3:Math.floor(Math.random()*3);g.objects.push({x:22+Math.random()*476,y:-25,vy:75+Math.random()*80,kind,r:kind===3?21:17})}}
function miniTick(now){if(!mini||mini.ended)return;let g=mini;let dt=Math.max(0,Math.min(.05,(now-miniLast)/1000));miniLast=now;g.remaining=Math.max(0,g.remaining-dt);g.spawn+=dt;
if(g.type!=='heart'){const every=g.type==='flies'?.47:.42;while(g.spawn>every){g.spawn-=every;addMiniObject(g)}for(let i=g.objects.length-1;i>=0;i--){let o=g.objects[i];if(g.type==='flies'){o.x+=o.vx*dt+Math.sin(now*.006+o.phase)*.35;o.y+=o.vy*dt+Math.cos(now*.005+o.phase)*.27;o.life-=dt;if(o.x<o.r||o.x>MG_W-o.r)o.vx*=-1;if(o.y<o.r+10||o.y>MG_H-o.r-10)o.vy*=-1;if(o.life<=0)g.objects.splice(i,1)}else{o.y+=o.vy*dt;if(o.y>=MG_H-46&&Math.abs(o.x-g.basket)<43){g.score=Math.max(0,g.score+(o.kind===3?-10:o.kind===0?10:o.kind===1?15:5));g.objects.splice(i,1)}else if(o.y>MG_H+28)g.objects.splice(i,1)}}miniDraw(g,now)}mgUpdateHud();if(g.remaining<=0){miniFinish();return}miniFrame=requestAnimationFrame(miniTick)}
function miniDraw(g,now){const canvas=document.getElementById('mgCanvas');if(!canvas)return;const c=canvas.getContext('2d');if(!c)return;let bg=c.createLinearGradient(0,0,0,345);bg.addColorStop(0,g.type==='flies'?'#0e3851':'#171240');bg.addColorStop(1,g.type==='flies'?'#164c49':'#321c63');c.fillStyle=bg;c.fillRect(0,0,520,345);
for(let i=0;i<35;i++){let x=(i*107)%520,y=(i*73)%345;c.fillStyle=g.type==='flies'?'#8af9cb45':'#d8b5ff65';c.beginPath();c.arc(x,y,1.2+(i%3),0,Math.PI*2);c.fill()}
c.textAlign='center';c.textBaseline='middle';for(let o of g.objects){c.font=(o.kind===2&&g.type==='flies'?'25':'32')+'px system-ui';c.shadowColor=g.type==='flies'?'#b5ffee':'#b89bff';c.shadowBlur=12;c.fillText(g.type==='flies'?['🦟','🪰','•'][o.kind]:['⭐','🌙','✨','👾'][o.kind],o.x,o.y);if(g.type==='flies'&&o.kind===2){c.fillStyle='#a6fcff';c.beginPath();c.arc(o.x,o.y,5,0,7);c.fill()}c.shadowBlur=0}
if(g.type==='dream'){c.fillStyle='#61fff4';c.shadowColor='#61fff4';c.shadowBlur=18;c.beginPath();c.moveTo(g.basket-43,300);c.lineTo(g.basket-30,336);c.lineTo(g.basket+30,336);c.lineTo(g.basket+43,300);c.closePath();c.fill();c.shadowBlur=0;c.fillStyle='#0a3b50';c.fillRect(g.basket-31,302,62,8)}}
function canvasPos(e,can){const r=can.getBoundingClientRect();return{x:(e.clientX-r.left)*MG_W/r.width,y:(e.clientY-r.top)*MG_H/r.height}}
mgContent.addEventListener('pointerdown',e=>{if(e.target.id==='heartTap'){if(mini?.type==='heart'&&!mini.ended){mini.score++;mgUpdateHud()}return}const can=document.getElementById('mgCanvas');if(!can||e.target!==can||!mini||mini.ended)return;let pos=canvasPos(e,can),g=mini;if(g.type==='dream'){g.basket=Math.max(44,Math.min(476,pos.x));try{can.setPointerCapture(e.pointerId)}catch{};return}
for(let i=g.objects.length-1;i>=0;i--){const o=g.objects[i];if(Math.hypot(o.x-pos.x,o.y-pos.y)<o.r+12){g.score+=[15,10,5][o.kind];g.objects.splice(i,1);mgUpdateHud();break}}});
mgContent.addEventListener('pointermove',e=>{const can=document.getElementById('mgCanvas');if(can&&mini?.type==='dream'&&!mini.ended){mini.basket=Math.max(44,Math.min(476,canvasPos(e,can).x))}});
mgContent.addEventListener('click',e=>{const b=e.target.closest('[data-mini]');if(!b)return;if(b.dataset.mini==='menu')showGamesMenu();else miniStart(b.dataset.mini)});
document.getElementById('mgClose').addEventListener('click',closeMini);
mgOverlay.addEventListener('pointerdown',e=>{if(e.target===mgOverlay)closeMini()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mgOverlay.classList.contains('visible'))closeMini();if(mini?.type==='dream'&&e.key==='ArrowLeft')mini.basket=Math.max(44,mini.basket-30);if(mini?.type==='dream'&&e.key==='ArrowRight')mini.basket=Math.min(476,mini.basket+30)});

load();resize();updateHUD();updateLocationUI();requestAnimationFrame(render);
window.addEventListener('pagehide',save);
