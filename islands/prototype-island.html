<script>
'use strict';
/* Прото-Тип: самодостатня HTML5 Canvas-гра. Без бібліотек, серверів та зовнішніх файлів. */
const STORAGE='proto-typ-save-v1';
const ITEMS={
 apple:{name:'Яблуко',emoji:'🍎',category:'food',price:20},cake:{name:'Тістечко',emoji:'🧁',category:'food',price:45},tea:{name:'Чай',emoji:'🧋',category:'food',price:25},
 chair:{name:'Крісло',emoji:'🪑',category:'furniture',price:170},lamp:{name:'Лампа',emoji:'💡',category:'furniture',price:130},plant:{name:'Квітка',emoji:'🪴',category:'furniture',price:95},bed:{name:'Ліжко',emoji:'🛏️',category:'furniture',price:340},
 wig_pink:{name:'Рожева перука',emoji:'👩‍🎤',category:'wig',price:280},wig_blue:{name:'Синя перука',emoji:'🩵',category:'wig',price:300},dress:{name:'Сукня',emoji:'👗',category:'clothes',price:280},shirt:{name:'Світшот',emoji:'👕',category:'clothes',price:220},
 tail_fox:{name:'Лисячий хвіст',emoji:'🦊',category:'accessory',slot:'tail',price:240},tail_cat:{name:'Котячий хвіст',emoji:'🐈',category:'accessory',slot:'tail',price:180},bow:{name:'Бантик',emoji:'🎀',category:'accessory',slot:'bow',price:115},
 eyes_star:{name:'Зоряні очі',emoji:'✨',category:'face',slot:'eyes',price:185},eyes_sleepy:{name:'Мрійливі очі',emoji:'😌',category:'face',slot:'eyes',price:135},nose_heart:{name:'Носик-серце',emoji:'💗',category:'face',slot:'nose',price:110},mouth_cat:{name:'Котяча усмішка',emoji:'😺',category:'face',slot:'mouth',price:125},brows_bold:{name:'Виразні брови',emoji:'〰️',category:'face',slot:'brows',price:90},ears_bunny:{name:'Кролячі вуха',emoji:'🐰',category:'face',slot:'ears',price:240},blush:{name:'Рум’янець',emoji:'🌸',category:'face',slot:'cosmetic1',price:85},freckles:{name:'Веснянки',emoji:'🟤',category:'face',slot:'cosmetic1',price:85},stars:{name:'Зірочки на щоках',emoji:'🌟',category:'face',slot:'cosmetic2',price:125},shadow:{name:'Тіні для очей',emoji:'💜',category:'face',slot:'cosmetic2',price:140}
};
const faceSlots=['eyes','nose','mouth','brows','ears','cosmetic1','cosmetic2'];
const faceNames={eyes:'Очі',nose:'Ніс',mouth:'Рот',brows:'Брови',ears:'Вуха',cosmetic1:'Косметика 1',cosmetic2:'Косметика 2'};
const defaults=()=>({coins:1000,appearance:{head:'round',fur:'#f0eff1',body:'#f0eff1',eyeColor:'#4b406c',name:'Прото'},owned:{apple:3,cake:1,chair:1,plant:1},equipped:{},placed:[],giftHistory:[],giftSent:[],happiness:80});
let state=defaults();
const safeStr=(v,n=80)=>String(v??'').replace(/[<>]/g,'').slice(0,n);
function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!s||typeof s!=='object')return;state={...defaults(),...s,appearance:{...defaults().appearance,...s.appearance},owned:{...defaults().owned,...s.owned},equipped:s.equipped||{},placed:Array.isArray(s.placed)?s.placed.slice(0,150):[],giftHistory:Array.isArray(s.giftHistory)?s.giftHistory.slice(-200):[],giftSent:Array.isArray(s.giftSent)?s.giftSent.slice(-200):[]};}catch(e){console.warn('Немає збереження',e)}}
let persistTimer=0;function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast('Не вдалося зберегти. Перевір сховище браузера.')}updateHUD()}
function debounceSave(){clearTimeout(persistTimer);persistTimer=setTimeout(save,250)}function updateHUD(){document.getElementById('coins').textContent=Math.floor(state.coins)}
function toast(message){let el=document.createElement('div');el.className='toast';el.textContent=message;document.getElementById('toastContainer').replaceChildren(el);setTimeout(()=>el.remove(),2800)}
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let pen=ctx;let W=0,H=0,dpr=1,walkTarget=null,placing=null,lastTime=0,clock=0;
const pet={x:0,y:0,dir:1,step:0};let particles=[];const scenery=[];
function rand(seed){let n=Math.sin(seed*12.9898+78.233)*43758.5453123;return n-Math.floor(n)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);
function world(){return{cx:W*.5,cy:H*.49,rx:Math.min(W*.48,570),ry:Math.min(H*.34,260)}}
function onIsland(x,y){const q=world();return((x-q.cx)/q.rx)**2+((y-q.cy)/q.ry)**2<.83}
function posForWorld(u,v){const q=world();return{x:q.cx+u*q.rx,y:q.cy+v*q.ry}}
function getPetPos(){return posForWorld(pet.x,pet.y)}
function drawRounded(x,y,w,h,r,color){pen.fillStyle=color;pen.beginPath();pen.roundRect(x,y,w,h,r);pen.fill()}
function ellipse(x,y,rx,ry,color){pen.beginPath();pen.ellipse(x,y,rx,ry,0,0,Math.PI*2);pen.fillStyle=color;pen.fill()}
function line(x1,y1,x2,y2,color,width){pen.beginPath();pen.moveTo(x1,y1);pen.lineTo(x2,y2);pen.strokeStyle=color;pen.lineWidth=width;pen.lineCap='round';pen.stroke()}
function drawCloud(x,y,s=1){ctx.globalAlpha=.73;ellipse(x,y,42*s,15*s,'#fff');ellipse(x-24*s,y+3*s,27*s,12*s,'#fff');ellipse(x+27*s,y+4*s,30*s,12*s,'#fff');ctx.globalAlpha=1}
function drawScenery(){let q=world();let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#c6eef4');bg.addColorStop(1,'#a8d7ee');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(let i=0;i<15;i++){let x=(rand(i+9)*W+clock*(i%2?2:-2))%(W+160);if(x<0)x+=W+160;drawCloud(x-70,40+rand(i+29)*H*.43,rand(i+8)*.45+.5)}
 for(let i=0;i<26;i++){let x=rand(i+100)*W,y=rand(i+270)*H;ellipse(x+Math.sin(clock*.55+i)*5,y,16,3,'#ffffff35')}
 ellipse(q.cx,q.cy+20,q.rx*1.02,q.ry*1.05,'#609e8a');ellipse(q.cx,q.cy+9,q.rx,q.ry,'#efe4b3');ellipse(q.cx,q.cy-2,q.rx*.94,q.ry*.89,'#a4dba0');ellipse(q.cx,q.cy-14,q.rx*.87,q.ry*.76,'#bce8a7');
 for(let i=0;i<58;i++){let a=rand(i+60)*Math.PI*2,r=Math.sqrt(rand(i+530))*.78,x=q.cx+Math.cos(a)*q.rx*r,y=q.cy-15+Math.sin(a)*q.ry*r;ellipse(x,y,2.5,2, ['#f8f4b6','#fff','#d8aae8','#75bc80'][i%4])}
 // house (decorative)
 let house=posForWorld(-.48,-.27);const sc=Math.max(.63,Math.min(1,W/630));ctx.save();ctx.translate(house.x,house.y);ctx.scale(sc,sc);ellipse(0,44,54,12,'#71976d61');drawRounded(-41,-26,82,75,13,'#f7d6bd');ctx.beginPath();ctx.moveTo(-56,-20);ctx.lineTo(0,-77);ctx.lineTo(56,-20);ctx.closePath();ctx.fillStyle='#ba7bb3';ctx.fill();drawRounded(-12,9,24,40,8,'#916c8a');drawRounded(-33,-12,17,20,5,'#d9effc');drawRounded(17,-12,17,20,5,'#d9effc');ctx.restore();
 // trees
 for(const [ux,uy,sc] of [[-.72,.17,.8],[.68,-.29,.9],[.73,.16,.65],[-.22,-.60,.57]]){let p=posForWorld(ux,uy);ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);ellipse(0,15,33,9,'#729f6b61');drawRounded(-7,-44,14,57,5,'#a9876c');ellipse(-21,-52,27,25,'#79bc79');ellipse(15,-66,31,29,'#74b974');ellipse(0,-87,27,25,'#8fd18a');ctx.restore()}
 for(let i=0;i<state.placed.length;i++){let p=state.placed[i],pt=posForWorld(p.x,p.y);drawFurniture(p.id,pt.x,pt.y,.92)}
}
function drawFurniture(id,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,12,26,7,'#567c6970');if(id==='chair'){drawRounded(-24,-36,48,34,10,'#f4bba7');drawRounded(-29,-10,58,21,6,'#d39495');line(-18,8,-18,19,'#856f72',5);line(18,8,18,19,'#856f72',5)}else if(id==='plant'){drawRounded(-13,-7,26,27,5,'#c4887b');ellipse(0,-23,17,26,'#5aa675');ellipse(-13,-31,13,17,'#77c780');ellipse(14,-33,12,17,'#82c887')}else if(id==='lamp'){line(0,-50,0,10,'#938c9b',5);ctx.beginPath();ctx.moveTo(-21,-51);ctx.lineTo(21,-51);ctx.lineTo(12,-20);ctx.lineTo(-12,-20);ctx.fillStyle='#ffefb4';ctx.fill();ellipse(0,12,19,5,'#938c9b')}else if(id==='bed'){drawRounded(-39,-11,78,28,10,'#d5b6dc');drawRounded(-39,-28,78,23,12,'#f5d4e2');drawRounded(-32,-23,28,16,6,'#fff9f1')}ctx.restore()}
function shadeColor(hex,mul){let z=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(z))return '#ddd';let v=[0,2,4].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(z.slice(i,i+2),16)*mul))));return `rgb(${v.join(',')})`}
function puppet(g,x,y,scale=1,animated=true){let a=state.appearance,fur=a.fur||'#f0eff1',body=a.body||fur;let eq=state.equipped||{};let pulse=animated?Math.sin(clock*2)*1.2:0;let moving=animated&&!!walkTarget;let phase=pet.step;
 g.save();g.translate(x,y+pulse);g.scale(scale*(animated?pet.dir:1),scale);ellipse(0,3,30,8,'#40665f40');
 // tail behind body. Separately purchasable, never part of base puppet.
 if(eq.tail){g.save();g.translate(24,-66);g.rotate(Math.sin(clock*2)*.18);g.strokeStyle=shadeColor(fur,.78);g.lineWidth=eq.tail==='tail_fox'?18:10;g.lineCap='round';g.beginPath();g.moveTo(0,0);g.bezierCurveTo(44,-3,45,-55,32,-57);g.stroke();if(eq.tail==='tail_fox')ellipse(32,-57,12,15,'#fff7ec');g.restore()}
 // legs behind torso
 for(let side of [-1,1]){g.save();g.translate(side*13,-29);g.rotate(moving?Math.sin(phase+ (side===-1?0:Math.PI))*.48:0);drawRounded(-10,-2,20,32,9,shadeColor(fur,.86));ellipse(0,27,13,9,fur);g.restore()}
 // ears behind head
 if(eq.ears==='ears_bunny'){for(let side of [-1,1]){g.save();g.translate(side*27,-122);g.rotate(side*.13+Math.sin(clock*1.3+side)*.035);ellipse(0,-29,13,42,shadeColor(fur,.88));ellipse(0,-30,6,30,'#eebdcf');g.restore()}}
 else{for(let side of [-1,1]){g.save();g.translate(side*29,-114);g.rotate(side*.06+Math.sin(clock*1.3+side)*.045);g.beginPath();g.moveTo(-18,10);g.lineTo(side*3,-32);g.lineTo(18,10);g.closePath();g.fillStyle=shadeColor(fur,.91);g.fill();g.beginPath();g.moveTo(-9,6);g.lineTo(side*2,-19);g.lineTo(10,6);g.closePath();g.fillStyle='#dfb5bb';g.fill();g.restore()}}
 // rear arm, torso, front arm
 g.save();g.translate(25,-68);g.rotate(moving?-Math.sin(phase)*.35:Math.sin(clock*1.1)*.04);ellipse(0,19,12,25,shadeColor(body,.86));g.restore();
 ellipse(0,-57,33,45,shadeColor(body,.91));ellipse(0,-66,26,36,body);ellipse(0,-54,19,24,shadeColor(body,1.04));
 if(eq.outfit==='dress'){g.beginPath();g.moveTo(-21,-78);g.lineTo(21,-78);g.lineTo(37,-28);g.lineTo(-37,-28);g.closePath();g.fillStyle='#b890cc';g.fill();}if(eq.outfit==='shirt')drawRounded(-27,-83,54,39,13,'#8dbdd1');
 g.save();g.translate(-27,-68);g.rotate(moving?Math.sin(phase)*.35:Math.sin(clock*.9)*.05);ellipse(0,19,12,25,body);g.restore();
 // neck masked by head
 g.save();g.translate(0,-116);g.rotate(Math.sin(clock*1.3)*.028);let hx=a.head==='wide'?55:a.head==='pointy'?42:47,hy=a.head==='pointy'?47:43;
 ellipse(0,0,hx,hy,shadeColor(fur,.89));ellipse(0,-4,hx-3,hy-3,fur);if(a.head==='pointy'){g.beginPath();g.moveTo(-29,23);g.lineTo(0,46);g.lineTo(29,23);g.closePath();g.fillStyle=fur;g.fill()}
 if(eq.wig){g.fillStyle=eq.wig==='wig_blue'?'#9bd0e9':'#e8a9c7';g.beginPath();g.ellipse(0,-25,hx+3,hy*.54,0,Math.PI,Math.PI*2);g.fill();g.fillRect(-hx,-23,12,26);g.fillRect(hx-12,-23,12,26)}
 let eye=a.eyeColor||'#4b406c';if(eq.cosmetic2==='shadow'){ellipse(-19,-12,14,10,'#bd9dd9');ellipse(19,-12,14,10,'#bd9dd9')}
 if(eq.brows==='brows_bold'){line(-29,-19,-11,-22,'#695969',3.4);line(11,-22,29,-19,'#695969',3.4)}
 if(eq.cosmetic1==='blush'){ellipse(-31,11,13,7,'#e8a0b0a9');ellipse(31,11,13,7,'#e8a0b0a9')}
 if(eq.cosmetic1==='freckles'){for(let side of [-1,1])for(let j=0;j<3;j++)ellipse(side*(26+j*3),8+j%2*4,1.5,1.5,'#aa817c')}
 if(eq.cosmetic2==='stars'){g.fillStyle='#ebbc48';for(let side of [-1,1]){g.fillText('✦',side*35-4,1);g.fillText('✦',side*29-2,23)}}
 const blink=animated&&Math.sin(clock*.68)>0.996;if(eq.eyes==='eyes_sleepy'||blink){line(-28,-4,-11,-4,eye,3.4);line(11,-4,28,-4,eye,3.4)}else{ellipse(-19,-4,eq.eyes==='eyes_star'?10:7,eq.eyes==='eyes_star'?12:10,eye);ellipse(19,-4,eq.eyes==='eyes_star'?10:7,eq.eyes==='eyes_star'?12:10,eye);ellipse(-17,-8,2.6,3,'white');ellipse(21,-8,2.6,3,'white');if(eq.eyes==='eyes_star'){g.fillStyle='#fff';g.font='10px sans-serif';g.fillText('✦',-23,2);g.fillText('✦',15,2)}}
 if(eq.nose==='nose_heart'){g.fillStyle='#ca809a';g.font='14px system-ui';g.textAlign='center';g.fillText('♥',0,15)}else{g.beginPath();g.moveTo(-5,10);g.lineTo(5,10);g.lineTo(0,15);g.closePath();g.fillStyle='#a7838d';g.fill()}
 g.strokeStyle='#73616d';g.lineWidth=2.2;g.lineCap='round';g.beginPath();if(eq.mouth==='mouth_cat'){g.moveTo(0,16);g.lineTo(0,23);g.moveTo(-14,21);g.quadraticCurveTo(-7,32,0,23);g.quadraticCurveTo(7,32,14,21)}else{g.moveTo(-12,22);g.quadraticCurveTo(0,34,12,22)}g.stroke();
 if(eq.bow){g.fillStyle='#e58eb5';ellipse(-35,-25,12,8,'#e58eb5');ellipse(-19,-25,12,8,'#e58eb5');ellipse(-27,-25,5,5,'#a96f9c')}
 g.restore();g.restore();}
function render(t){let dt=Math.min((t-lastTime)/1000||0,.05);lastTime=t;clock+=dt;ctx.clearRect(0,0,W,H);drawScenery();let p=getPetPos();if(walkTarget){let dx=walkTarget.x-p.x,dy=walkTarget.y-p.y,d=Math.hypot(dx,dy),q=world();if(d<3){walkTarget=null}else{let speed=120,travel=Math.min(d,speed*dt);pet.x+=(dx/d)*travel/q.rx;pet.y+=(dy/d)*travel/q.ry;pet.dir=dx<0?-1:1;pet.step+=dt*11}}const scale=Math.max(.69,Math.min(1.1,W/650));puppet(ctx,p.x,p.y,scale);if(placing){ctx.save();ctx.globalAlpha=.7;drawFurniture(placing,p.x+85,p.y-22);ctx.restore()}requestAnimationFrame(render)}
canvas.addEventListener('pointerdown',e=>{if(document.getElementById('overlay').classList.contains('open'))return;let q=world(),x=e.clientX,y=e.clientY;if(!onIsland(x,y)){toast('Обери місце на острові 🌿');return}if(placing){let pt={id:placing,x:(x-q.cx)/q.rx,y:(y-q.cy)/q.ry};state.placed.push(pt);state.owned[placing]=Math.max(0,(state.owned[placing]||0)-1);placing=null;save();toast('Меблі розміщено!');return}walkTarget={x,y}});
const overlay=document.getElementById('overlay'),body=document.getElementById('panelBody'),title=document.getElementById('panelTitle');let activePanel='',shopCategory='all',invCategory='all',wardrobeCategory='all';
function openPanel(id){activePanel=id;overlay.classList.add('open');document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('active',b.dataset.open===id));showPanel()}
function closePanel(){overlay.classList.remove('open');document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));activePanel=''}
document.querySelectorAll('#toolbar button').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.open)));document.getElementById('closePanel').onclick=closePanel;overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
const esc=s=>safeStr(s,150).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function tabs(options,selected,action){return `<div class="tabs">${options.map(o=>`<button class="tab ${selected===o[0]?'active':''}" data-act="${action}" data-val="${o[0]}">${o[1]}</button>`).join('')}</div>`}
function itemCard(id,mode){const it=ITEMS[id],n=state.owned[id]||0,isOn=Object.values(state.equipped).includes(id);let action='',label='';if(mode==='shop'){action='buy';label=`🪙 ${it.price}`}else if(it.category==='food'){action='eat';label='З’їсти'}else if(it.category==='furniture'){action='place';label='Розмістити'}else{action='equip';label=isOn?'Зняти':'Одягнути'}return `<div class="item"><span class="emoji">${it.emoji}</span><b>${esc(it.name)}</b><small>${mode==='shop'?`В наявності: ${n}`:`Кількість: ${n}`}</small><button data-act="${action}" data-id="${id}" ${mode==='shop'?(state.coins<it.price?'disabled':''):(n<1?'disabled':'')}>${label}</button></div>`}
function showPanel(){let labels={editor:'🎨 Редактор персонажа',shop:'🏪 Магазин',inventory:'🎒 Інвентар предметів',wardrobe:'👗 Гардероб',post:'💌 Пошта острова',settings:'⚙️ Меню гри'};title.textContent=labels[activePanel]||'Меню';let html='';
 if(activePanel==='editor'){let a=state.appearance;html=`<div class="edit-layout"><canvas class="preview" id="preview" width="200" height="230"></canvas><div><div class="control"><label>Ім’я персонажа</label><input class="field" id="petName" maxlength="24" value="${esc(a.name)}"></div><div class="control"><label>Форма голови</label><select id="headShape"><option value="round" ${a.head==='round'?'selected':''}>Кругла</option><option value="wide" ${a.head==='wide'?'selected':''}>Широка</option><option value="pointy" ${a.head==='pointy'?'selected':''}>Загострена</option></select></div><div class="control"><label>Колір голови та шерсті</label><input type="color" id="furColor" value="${esc(a.fur)}"></div><div class="control"><label>Колір тулуба</label><input type="color" id="bodyColor" value="${esc(a.body)}"></div><div class="control"><label>Колір очей</label><input type="color" id="eyeColor" value="${esc(a.eyeColor)}"></div></div></div><p class="section-title">Сім слотів обличчя</p><div class="grid">${faceSlots.map(s=>`<div class="item"><b>${faceNames[s]}</b><small>${state.equipped[s]?esc(ITEMS[state.equipped[s]]?.name||'Базові'):'Базовий вигляд'}</small><button data-act="faceWardrobe" data-val="${s}">Змінити</button></div>`).join('')}</div><p class="note">Кожен придбаний елемент обличчя встановлюється у свій слот. Косметика 1 і 2 працюють одночасно. Це демо: форми й кольори малюються програмно; пізніше їх можна замінити PNG у assets/.</p>`}
 else if(activePanel==='shop'){html=tabs([['all','Усе'],['food','Їжа'],['furniture','Меблі'],['clothes','Одяг'],['face','Обличчя'],['accessory','Аксесуари'],['wig','Перуки']],shopCategory,'shopTab')+`<div class="grid">${Object.keys(ITEMS).filter(id=>shopCategory==='all'||ITEMS[id].category===shopCategory).map(id=>itemCard(id,'shop')).join('')}</div><p class="note">Тільки внутрішньоігрова валюта. Жодного донату.</p>`}
 else if(activePanel==='inventory'){html=tabs([['all','Усе'],['food','Їжа'],['furniture','Меблі']],invCategory,'invTab')+`<div class="grid">${Object.keys(ITEMS).filter(id=>['food','furniture'].includes(ITEMS[id].category)&&(state.owned[id]||0)>0&&(invCategory==='all'||ITEMS[id].category===invCategory)).map(id=>itemCard(id,'owned')).join('')||'<p>Тут поки порожньо.</p>'}</div><p class="note">Їжа витрачається. Меблі можна поставити на острів натисканням на вільне місце. Розміщені меблі повертаються через меню гри.</p>`}
 else if(activePanel==='wardrobe'){html=tabs([['all','Усе'],['clothes','Одяг'],['wig','Перуки'],['accessory','Аксесуари'],['face','Обличчя']],wardrobeCategory,'wardTab')+`<div class="grid">${Object.keys(ITEMS).filter(id=>!['food','furniture'].includes(ITEMS[id].category)&&(state.owned[id]||0)>0&&(wardrobeCategory==='all'||ITEMS[id].category===wardrobeCategory)).map(id=>itemCard(id,'owned')).join('')||'<p>Купи перші речі в магазині.</p>'}</div><p class="note">Очі, ніс, рот, брови, вуха та два косметичні слоти належать гардеробу, але одягаються також через редактор обличчя.</p>`}
 else if(activePanel==='post'){html=`<div class="gift"><p>Надсилай подарунки друзям кодом. Код можна передати будь-яким месенджером. Сервер не потрібен.</p><div class="control"><label>Ім’я відправника</label><input class="field" id="sender" maxlength="24" value="${esc(state.appearance.name)}"></div><div class="control"><label>Предмет для подарунка</label><select id="giftItem" class="field">${Object.keys(ITEMS).filter(id=>(state.owned[id]||0)>0&&!Object.values(state.equipped).includes(id)).map(id=>`<option value="${id}">${esc(ITEMS[id].name)} ×${state.owned[id]}</option>`).join('')}</select></div><div class="footer-actions"><button class="primary" data-act="sendGift">Створити код подарунка</button></div><div id="giftOutput"></div><hr><div class="control"><label>Вставити подарунковий код</label><textarea id="giftInput" class="field" placeholder="PT1-..."></textarea></div><button class="primary" data-act="receiveGift">Отримати подарунок</button><p class="note">⚠️ Без сервера неможливо захистити коди від підроблення, дублювання між пристроями чи повторного завантаження збереження. Це дружній, а не захищений обмін.</p></div>`}
 else if(activePanel==='settings'){html=`<p><b>Прото-Тип α 0.1</b> — локальний браузерний прототип.</p><div class="control"><label>Ім’я острова</label><input class="field" id="islandLabel" value="Мій маленький острів" disabled></div><div class="footer-actions"><button class="secondary" data-act="collectFurniture">Прибрати всі меблі в інвентар (${state.placed.length})</button><button class="secondary" data-act="exportSave">Експорт збереження</button><button class="secondary" data-act="importSave">Імпорт збереження</button><button class="secondary" data-act="earnCoins">Міні-завдання: +30 🪙</button><button class="secondary" data-act="reset">Нова гра</button></div><p class="note">Прогрес автоматично зберігається в цьому браузері (localStorage). Між браузерами та пристроями синхронізації немає. Для резервної копії використовуй експорт. Міні-завдання призначене для тестування економіки, без лімітів.</p><textarea id="saveText" class="field" placeholder="Тут з’явиться резервна копія, або встав її для імпорту" rows="4"></textarea>`}
 body.innerHTML=html;if(activePanel==='editor')drawPreview()}
function drawPreview(){let c=document.getElementById('preview');if(!c)return;let g=c.getContext('2d');g.clearRect(0,0,200,230);pen=g;g.save();g.translate(100,210);g.scale(1.1,1.1);puppet(g,0,0,1,false);g.restore();pen=ctx}
body.addEventListener('input',e=>{let a=state.appearance;if(e.target.id==='furColor')a.fur=e.target.value;if(e.target.id==='bodyColor')a.body=e.target.value;if(e.target.id==='eyeColor')a.eyeColor=e.target.value;if(e.target.id==='petName')a.name=safeStr(e.target.value,24);if(e.target.id==='headShape')a.head=e.target.value;debounceSave();drawPreview()});
body.addEventListener('change',e=>{if(e.target.id==='headShape'){state.appearance.head=e.target.value;save();drawPreview()}});
const slotFor=id=>ITEMS[id]?.slot||({wig_pink:'wig',wig_blue:'wig',dress:'outfit',shirt:'outfit'}[id]);
function b64encode(s){const bytes=new TextEncoder().encode(s);let result='';for(let i=0;i<bytes.length;i++)result+=String.fromCharCode(bytes[i]);return btoa(result).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64decode(s){let raw=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
body.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id,v=b.dataset.val;
 if(act==='shopTab'){shopCategory=v;showPanel();return}if(act==='invTab'){invCategory=v;showPanel();return}if(act==='wardTab'){wardrobeCategory=v;showPanel();return}if(act==='faceWardrobe'){wardrobeCategory='face';openPanel('wardrobe');return}
 if(act==='buy'){let it=ITEMS[id];if(!it||state.coins<it.price)return;state.coins-=it.price;state.owned[id]=(state.owned[id]||0)+1;save();toast(`Придбано: ${it.name}`);showPanel();return}
 if(act==='eat'){if(!state.owned[id])return;state.owned[id]--;state.happiness=Math.min(100,state.happiness+5);state.coins+=5;save();toast('Смачно! +5 монет за турботу 🥰');showPanel();return}
 if(act==='place'){if(!state.owned[id])return;placing=id;closePanel();toast('Торкнись острова, щоб поставити меблі');return}
 if(act==='equip'){let slot=slotFor(id);if(!slot||!state.owned[id])return;if(state.equipped[slot]===id)delete state.equipped[slot];else state.equipped[slot]=id;save();showPanel();return}
 if(act==='collectFurniture'){for(let p of state.placed)if(ITEMS[p.id])state.owned[p.id]=(state.owned[p.id]||0)+1;state.placed=[];save();toast('Усі меблі повернуто');showPanel();return}
 if(act==='earnCoins'){state.coins+=30;save();toast('Отримано 30 монет за тестове завдання');showPanel();return}
 if(act==='reset'){if(confirm('Стерти прогрес і почати нову гру?')){state=defaults();save();closePanel();toast('Нову гру розпочато')}}
 if(act==='exportSave'){const t=document.getElementById('saveText');t.value=JSON.stringify(state);t.select();try{await navigator.clipboard.writeText(t.value);toast('Резервну копію скопійовано')}catch{toast('Скопіюй текст резервної копії вручну')}return}
 if(act==='importSave'){try{let obj=JSON.parse(document.getElementById('saveText').value);if(typeof obj!=='object'||!obj||!obj.owned||!obj.appearance)throw Error();if(!confirm('Замінити поточне збереження імпортованим?'))return;localStorage.setItem(STORAGE,JSON.stringify(obj));load();save();showPanel();toast('Збереження імпортовано')}catch{toast('Помилка: неправильний формат збереження')}return}
 if(act==='sendGift'){let sel=document.getElementById('giftItem'),sender=document.getElementById('sender');if(!sel||!ITEMS[sel.value]||!state.owned[sel.value]){toast('Немає доступного предмета');return}let id=sel.value;let unique=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let payload={v:1,id,from:safeStr(sender.value,24),nonce:unique.slice(0,40)};let code='PT1-'+b64encode(JSON.stringify(payload));state.owned[id]--;state.giftSent.push(payload.nonce);state.giftSent=state.giftSent.slice(-200);save();document.getElementById('giftOutput').innerHTML=`<p class="section-title">Код створено. Передай його другу:</p><textarea class="field" id="generatedCode" readonly></textarea><button class="secondary" data-act="copyGift">Копіювати код</button><p class="note">Предмет списаний локально. Це не захищає від дублювання кодів.</p>`;document.getElementById('generatedCode').value=code;return}
 if(act==='copyGift'){let el=document.getElementById('generatedCode');if(!el)return;try{await navigator.clipboard.writeText(el.value);toast('Код скопійовано')}catch{el.select();toast('Скопіюй виділений код вручну')}return}
 if(act==='receiveGift'){try{let code=document.getElementById('giftInput').value.trim();if(!code.startsWith('PT1-')||code.length>2500)throw Error();let gift=JSON.parse(b64decode(code.slice(4)));if(gift.v!==1||!ITEMS[gift.id]||typeof gift.nonce!=='string'||gift.nonce.length>80||!gift.nonce)throw Error();if(state.giftHistory.includes(gift.nonce)){toast('Цей код уже використано в цьому браузері');return}state.giftHistory.push(gift.nonce);state.giftHistory=state.giftHistory.slice(-200);state.owned[gift.id]=(state.owned[gift.id]||0)+1;save();toast(`Подарунок від ${safeStr(gift.from,24)||'друга'}: ${ITEMS[gift.id].name}!`);showPanel()}catch{toast('Невірний код подарунка')}return}
});
load();resize();updateHUD();requestAnimationFrame(render);
window.addEventListener('pagehide',save);
