/* Дані гостя тільки під час візиту в його дім. */

.yardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.yardPlot{border:1px solid #6fd6db;border-radius:12px;background:#152844;color:#e6ffff;padding:10px;text-align:left;cursor:pointer}.yardPlot.active{border-color:#ff9fe5;background:#3b2758}.needbar{height:9px;background:#dce6ed;border-radius:9px;overflow:hidden}.needbar>i{display:block;height:100%;background:linear-gradient(90deg,#20cfba,#79e1ff)}.needrow{margin:11px 0;display:grid;grid-template-columns:95px 1fr 40px;gap:8px;align-items:center;font-size:12px}.needrow.danger .needbar>i{background:linear-gradient(90deg,#f45d83,#ffb15b)}

/* Прото-Тип: оновлений редактор зовнішності */
.editor-shell{display:grid;gap:15px}
.editor-hero{display:grid;grid-template-columns:minmax(155px,220px) minmax(0,1fr);gap:15px;align-items:stretch}
.editor-preview{min-height:250px;padding:12px;border:1px solid #54d5e9;border-radius:18px;background:radial-gradient(circle at 50% 35%,#e8faff,#c7d9f5 70%,#e7d5fd);box-shadow:inset 0 0 24px #35d1ed2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.editor-preview .preview{height:230px;width:200px;max-width:100%;border:0;background:transparent}
.editor-preview small{font-size:11px;color:#536a88;text-align:center}
.editor-section{border:1px solid #d6e4f1;border-radius:15px;padding:13px;background:#fffdfd;box-shadow:0 5px 16px #2864a50b}
.editor-section h3{margin:0 0 11px;font-size:15px;color:#27365d}
.editor-options{display:grid;gap:10px;align-content:start}
.editor-options label{font-size:12px;font-weight:750;display:block;margin-bottom:5px}

.editor-color{display:flex;gap:9px;align-items:center;border:1px solid #a5d7ed;padding:10px;border-radius:12px;background:#e9f8ff}

.editor-color p{margin:0;font-size:11px;color:#5c7190}
.editor-commit{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.editor-commit button{min-height:41px;font-weight:800;border-radius:11px;border:1px solid #8adbe8;cursor:pointer}
.editor-commit .primary{color:white}.editor-commit .secondary{color:#2b4364;background:#eaf2f8}

.shop-subbar{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding:5px 12px;background:#fff2e8e8}

.shop-subbar button.selected{background:#f6c8d7;border-color:#b97b94}
.shop-wig-subbar{background:#f5e5f9;min-height:43px}
.shop-wig-subbar button.selected{background:#d9b6ee;border-color:#a580c4}
.shop-room-stage{flex:1;position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:0;height:auto;margin:0;max-width:none;border:0;border-radius:0;box-shadow:none;background:#78697b;touch-action:pan-y}
.shop-room-world{position:absolute;left:0;top:0;bottom:0;will-change:transform;background:linear-gradient(180deg,#655774 0%,#7c698c 60%,#b98fa2 60%,#b98fa2 100%);pointer-events:none}
.shop-room-world .shop-room-wall{inset:0 0 37%;background:repeating-linear-gradient(90deg,#ffffff13 0 78px,#00000015 80px 84px),linear-gradient(155deg,color-mix(in srgb,var(--shop-accent) 24%,#716384),#575075);border-bottom:14px solid #f0c9c7}
.shop-room-world .shop-room-floor{inset:63% 0 0;background:repeating-linear-gradient(98deg,transparent 0 100px,#fff4e333 102px 105px),linear-gradient(#bb92a1,#876d85)}
.shop-room-world .shop-wall-items{position:absolute;left:0;top:11%;height:47%;width:100%;display:block;pointer-events:none}
.shop-room-world .shop-wall-product{position:absolute;top:0;bottom:0;display:flex;pointer-events:auto;overflow:hidden;padding:clamp(5px,1vh,13px);border-radius:15px;box-shadow:0 9px 0 #584456,inset 0 0 0 2px #fce3d3}
.shop-room-world .shop-wall-product strong{font-size:clamp(10px,1.7vh,18px)}
.shop-room-world .shop-wall-product .shop-product-pic{font-size:clamp(27px,7vh,66px)}
.shop-room-world .shop-wall-product button{font-size:clamp(10px,1.55vh,15px);min-height:29px}
.shop-wallpaper-product{justify-content:flex-start;gap:6px}
.shop-wallpaper-nav{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:2px}
.shop-wallpaper-arrow{flex:0 0 32px;height:84px;border:2px solid #b28ea3;background:#fff6fb;color:#664d62;border-radius:11px;font-size:22px;font-weight:900;cursor:pointer}
.shop-wallpaper-arrow:disabled{opacity:.45;cursor:default}
.shop-wallpaper-preview{flex:1;height:84px;border-radius:12px;border:2px solid #b891a6;box-shadow:inset 0 0 0 2px #ffffff55;background:linear-gradient(180deg,var(--wall-fill) 0 100%);position:relative;overflow:hidden}
.shop-wallpaper-preview:not([style*="background-image"]):before,.shop-wallpaper-preview:not([style*="background-image"]):after{content:'';position:absolute;left:0;right:0;height:7px;background:linear-gradient(180deg,var(--wall-line) 0 2px,var(--wall-line2) 2px 4px,transparent 4px)}
.shop-wallpaper-preview:before{top:0}
.shop-wallpaper-preview:after{bottom:0;transform:scaleY(-1)}
.shop-wallpaper-product small.variant{min-height:28px;display:flex;align-items:center;justify-content:center;text-align:center}
@media(max-width:600px){.shop-wallpaper-arrow{height:66px;flex-basis:28px;font-size:18px}.shop-wallpaper-preview{height:66px}}
.shop-room-world .shop-wall-empty{position:absolute;left:12%;top:14%;width:260px}
.shop-room-world .shop-room-heading{position:absolute;left:150px;top:2%;transform:none;white-space:nowrap;max-width:none}
.shop-room-world .shop-shop-window{position:absolute;top:13%;width:155px;height:38%;border:10px solid #e9d8d4;border-radius:70px 70px 8px 8px;background:linear-gradient(130deg,#b5d8e5,#e0faf1 53%,#9dbdcd);box-shadow:0 7px #947c89}
.shop-room-world .shop-shop-window:after{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:7px solid #f8e6de}
#shopCast{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.shop-counter-world{position:absolute;z-index:6;bottom:9%;width:220px;height:17%;border:5px solid #805e77;border-top:13px solid #fbe2cc;border-radius:14px 14px 4px 4px;background:linear-gradient(90deg,#aa7891,#ddb7a5,#ad7890);display:grid;place-items:center;color:#fffef5;font-size:15px;font-weight:900;box-shadow:0 8px 10px #493b5044;pointer-events:none}
.shop-counter-world{z-index:4}
.shop-nav{position:absolute;top:48%;z-index:9;height:80px;width:56px;transform:translateY(-50%);border-radius:14px;background:#493754d9;border:3px solid #f4e1d2;color:white;touch-action:none;user-select:none}
.shop-nav-left{left:8px}.shop-nav-right{right:8px}
.shop-room-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;max-width:60%;text-align:center;border-radius:12px;padding:7px 12px;background:#fff9e9e8;color:#624558;font-size:12px;font-weight:800;pointer-events:none}
.shop-home-btn{position:absolute;right:17px;bottom:19px;z-index:11;border:3px solid #fff8e9;border-bottom:6px solid #c69ca2;border-radius:17px;background:#f8d7cc;color:#5f415b;font-size:17px;font-weight:900;padding:13px 18px;box-shadow:0 5px 16px #3d2b3a55}
@media(max-width:650px){.shop-topbar{padding:5px;gap:5px;min-height:53px}.shop-topbar .shop-all{padding:8px;font-size:11px}.shop-switcher button{padding:7px;font-size:11px}.shop-topbar .wallet{padding:7px;font-size:12px}.shop-home-btn{bottom:11px;right:9px;padding:11px;font-size:14px}.shop-nav{height:64px;width:38px;font-size:23px}.shop-room-hint{bottom:7px;left:43%;max-width:48%;font-size:9px}.shop-room-world .shop-wall-product{border-width:3px}.shop-room-world .shop-wall-product small{display:none}}

/* v1.1.4: єдина сітка вирівнювання верхніх кнопок магазину.
   Такий самий базовий зовнішній відступ 9px, як у панелі кімнат. */
.shop-topbar{
  box-sizing:border-box;
  display:flex;
  align-items:center;
  min-height:60px;
  height:60px;
  padding:9px;
  gap:7px;
  flex-shrink:0;
}
.shop-topbar .shop-all,
.shop-topbar .shop-switcher button,
.shop-topbar .wallet{
  box-sizing:border-box;
  height:39px;
  min-height:39px;
  max-height:39px;
  padding:0 11px;
  margin:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.2;
  vertical-align:middle;
  white-space:nowrap;
}
.shop-switcher{height:42px;min-height:42px;align-items:center;gap:7px;overflow-y:hidden;}
.shop-subbar{align-items:center;min-height:49px;padding:5px 9px;gap:7px;}
.shop-subbar button{box-sizing:border-box;height:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;margin:0;padding:0 11px;}
@media(max-width:650px){
  .shop-topbar{min-height:54px;height:54px;padding:7px 9px;gap:5px;}
  .shop-topbar .shop-all,.shop-topbar .shop-switcher button,.shop-topbar .wallet{height:36px;min-height:36px;max-height:36px;padding:0 7px;}
  .shop-switcher{height:39px;min-height:39px;gap:5px;}
  .shop-subbar{padding:5px 9px;}
}

/* Один вибір кольору пета з кнопками прямо під ним. */
.editor-coat-card{grid-column:1/-1}
.editor-coat-card .editor-commit{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.editor-coat-card .editor-commit button{flex:1;min-width:125px}

/* α1.1.2: GPU compositing for the long shop world, without per-card repaint outside viewport */
.shop-room-world{will-change:transform;backface-visibility:hidden;contain:layout style paint;transform-style:flat;}
.shop-room-world .shop-wall-product{contain:layout paint style;}
#shopCast{contain:strict;}
.shop-wall-product{content-visibility:auto;contain-intrinsic-size:240px 220px;}
#shopCast{pointer-events:none;}


/* α1.1.9: viewport-sized shop rendering: no giant composited world */
.shop-room-world{width:100%;will-change:auto;transform:none!important;contain:layout style paint;}
.shop-room-world .shop-room-wall{background-position-x:calc(-1 * var(--shop-camera,0px));}
.shop-room-world .shop-room-floor,.shop-room-world .shop-room-floor::after{background-position-x:calc(-1 * var(--shop-camera,0px));}
.shop-room-world .shop-wall-product{will-change:auto;content-visibility:visible;contain:layout style paint;backface-visibility:hidden;}
.shop-room-world .shop-room-heading{transform:none;}
#shopCast{will-change:contents;}

/* α1.2.5: performance mode for SHOP ROOMS ONLY. Camera motion moves small
   compositor textures, not a full-screen rasterized gradient per frame. */
#overlay.shop-full{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.shop-room-world .shop-room-wall{overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--shop-accent) 24%,#716384),#575075)!important;background-position:0 0!important;}
.shop-room-world .shop-room-floor{overflow:hidden;background:linear-gradient(#bb92a1,#876d85)!important;background-position:0 0!important;}
.shop-room-world .shop-room-wall::before{content:"";position:absolute;inset:0 -110px;background:repeating-linear-gradient(90deg,#ffffff13 0 78px,#00000015 80px 84px);transform:translate3d(var(--shop-wall-shift,0px),0,0);will-change:transform;pointer-events:none;}
.shop-room-world .shop-room-floor::before{content:"";position:absolute;inset:0 -120px;background:repeating-linear-gradient(90deg,transparent 0 100px,#fff4e333 102px 105px);transform:translate3d(var(--shop-floor-shift,0px),0,0);will-change:transform;pointer-events:none;}
.shop-room-world .shop-room-floor::after{background-position:0 0!important;}
.shop-room-world .shop-wall-product{box-shadow:0 3px 0 #584456!important;will-change:transform;contain:layout style paint;}
.shop-room-world .shop-wall-product[data-offscreen="1"]{visibility:hidden!important;pointer-events:none!important;}
.shop-room-stage .shop-nav,.shop-room-stage .shop-home-btn{box-shadow:none!important;}
#shopCast{will-change:auto!important;}
/* Окремий шар пилу над Canvas: не стирається при перемальовуванні кімнати. */
#dustLayer{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;contain:layout style paint}
#dustLayer .dust-sprite{position:absolute;display:block;width:90px;height:78px;object-fit:fill;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 2px #0003)}
.currency-icon{display:inline-block;width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.22em;flex:none}.money{display:flex;align-items:center;gap:5px}.money .currency-icon{width:20px;height:20px}.wallet{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.wallet .currency-icon{width:18px;height:18px}.premium-price{color:#f2d4ff;font-weight:800}
#overlay.editor-full .editor-face-adjust{margin-top:14px;padding:13px;border:1px solid #91bccb;border-radius:14px;background:#e8f5fb;color:#253b55;display:grid;gap:8px}#overlay.editor-full .editor-face-adjust strong{font-size:14px}#overlay.editor-full .face-adjust-row{display:flex;gap:10px;justify-content:center;align-items:center}#overlay.editor-full .face-adjust-row output{min-width:65px;text-align:center;font-weight:800}#overlay.editor-full .editor-face-adjust button{min-width:40px;min-height:36px;border-radius:10px;border:1px solid #7faac4;background:white;color:#253b55;cursor:pointer;font-size:20px;font-weight:bold}#overlay.editor-full .face-adjust-move{display:flex;align-items:center;flex-direction:column;gap:5px}#overlay.editor-full .face-adjust-move>div{display:flex;gap:5px}#overlay.editor-full .editor-face-adjust small{font-size:12px;line-height:1.4}#overlay.editor-full #preview.face-drag-enabled{touch-action:none;cursor:move}
.page-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto;padding:7px;flex-wrap:wrap;color:inherit}.page-nav button{padding:7px 15px;border-radius:9px;border:1px solid #a6b2c6;background:#f0f4fa;color:#273e59;font-weight:700;cursor:pointer}.page-nav button:disabled{opacity:.35;cursor:default}.page-nav span{font-size:13px;font-weight:700}
</style>

function normalizeWallDecor(value){
 if(Number.isInteger(value)&&value>=0&&value<BASE_WALL_OPTIONS.length)return value;
 if(typeof value==='string'){
  const v=value.trim();
  if(/^\d+$/.test(v)){const n=+v;if(n>=0&&n<BASE_WALL_OPTIONS.length)return n;}
  if(PASTEL_WALLPAPERS.some(w=>w.id===v))return v;
 }
 return 0;
}
function wallChoiceValue(value){const normalized=normalizeWallDecor(value);return typeof normalized==='number'?String(normalized):normalized}
function getWallOptionByValue(value){
 const normalized=normalizeWallDecor(value);
 if(typeof normalized==='number')return BASE_WALL_OPTIONS[normalized]||BASE_WALL_OPTIONS[0];
 return PASTEL_WALLPAPERS.find(w=>w.id===normalized)||BASE_WALL_OPTIONS[0];
}
function roomWallpaperOptions(){
 const options=BASE_WALL_OPTIONS.map(opt=>({id:String(opt.id),name:opt.name}));
 for(const wall of PASTEL_WALLPAPERS)if((state.owned?.[wall.id]||0)>0)options.push({id:wall.id,name:wall.name});
 return options;
}
const wallpaperImageCache=new Map();
function getWallpaperImage(wall){
 if(!wall?.file)return null;
 if(wallpaperImageCache.has(wall.id))return wallpaperImageCache.get(wall.id);
 // Only the currently visible wallpaper stays decoded: prevent 11 full-size bitmaps staying in RAM.
 for(const [key,previous] of wallpaperImageCache){if(key!==wall.id){previous.onload=null;previous.onerror=null;previous.removeAttribute('src');wallpaperImageCache.delete(key)}}
 const img=new Image();
 wallpaperImageCache.set(wall.id,img);
 img.onload=()=>{if(typeof scheduleRender==='function')scheduleRender();};
 img.src=PASTEL_WALLPAPER_IMAGES[wall.file];
 return img;
}

  image.onload=()=>{record.ready=true};image.onerror=()=>{record.ready=false;console.warn("Прото-Тип: не завантажено лампу:",ITEMS[id].image)};

function roomLightEnabled(room){return state.roomLights?.[room]!==false}
function furnitureScale(p){return Math.max(.45,Math.min(2.5,Number(p?.scale)||1))}
function furnitureMirror(p){return p?.mirror===true?-1:1}
function lampVertical(p){return Math.max(.02,Math.min(.38,Number(p?.y)||.20))}
function drawCeilingLamp(id,x,room,selected=false,y=.20,scale=1,mirror=false){
 const pic=lampPicture(id),on=roomLightEnabled(room),s=Math.max(.65,Math.min(1.25,W/700));
 // Всі сім ламп мають квадратні PNG: зберігаємо співвідношення 1:1.
 const size=105*s*scale,top=H*.035-5+(lampVertical({y})-.20)*H,bottom=top+size;
 ctx.save();
 // Зображення ціле, включно з дротом. Не підміняємо авторський PNG геометрією.
 if(on){
  const glow=ctx.createRadialGradient(x,bottom,4,x,bottom,H*.34);
  glow.addColorStop(0,'#ffe9a662');glow.addColorStop(.36,'#ffe4a32c');glow.addColorStop(1,'#ffe1a000');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,bottom,H*.34,0,Math.PI*2);ctx.fill();
 }
 if(pic?.ready){
  ctx.save();ctx.translate(x,0);ctx.scale(mirror?-1:1,1);ctx.drawImage(pic.image,-size/2,top,size,size);ctx.restore();
 }
 if(selected){ctx.strokeStyle='#83ffff';ctx.setLineDash([5,4]);ctx.strokeRect(x-size/2,top,size,size);ctx.setLineDash([])}
 ctx.restore();
}
function drawFurniture(id,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,12,26,7,'#567c6970');if(id==='vacuum'){line(-9,-10,10,-43,'#c6ecff',5);line(-19,-8,14,-8,'#172942',10);ellipse(-3,-7,17,9,'#4dd6df');}else if(id==='robot_vacuum'){ellipse(0,-8,31,17,'#1b293b');ellipse(0,-11,27,14,'#67dce2');ellipse(0,-12,7,5,'#142e4b');}else if(id==='bath'||id==='shower'){drawRounded(-33,-33,66,47,12,id==='bath'?'#bcecff':'#8ddbe2');drawRounded(-26,-25,52,30,8,'#f0fbfe');line(18,-37,18,-51,'#e5f8ff',5)}else if(id==='tv'){drawRounded(-35,-48,70,45,7,'#11182b');drawRounded(-29,-42,58,33,4,'#3c9fd3');line(0,-3,0,13,'#a5a8bf',5)}else if(id==='fridge'||id==='auto_fridge'){drawRounded(-25,-58,50,77,8,id==='auto_fridge'?'#85d7da':'#c4cbd6');line(-10,-22,18,-22,'#74869a',2);drawRounded(11,-14,3,19,2,'#edfaff')}else if(id==='toy'){ellipse(0,-15,20,22,'#eac3ac');ellipse(-14,-37,9,10,'#eac3ac');ellipse(14,-37,9,10,'#eac3ac')}else if(id==='chair'){drawRounded(-24,-36,48,34,10,'#f4bba7');drawRounded(-29,-10,58,21,6,'#d39495');line(-18,8,-18,19,'#856f72',5);line(18,8,18,19,'#856f72',5)}else if(id==='plant'){drawRounded(-13,-7,26,27,5,'#c4887b');ellipse(0,-23,17,26,'#5aa675');ellipse(-13,-31,13,17,'#77c780');ellipse(14,-33,12,17,'#82c887')}else if(id==='lamp'){line(0,-50,0,10,'#938c9b',5);ctx.beginPath();ctx.moveTo(-21,-51);ctx.lineTo(21,-51);ctx.lineTo(12,-20);ctx.lineTo(-12,-20);ctx.fillStyle='#ffefb4';ctx.fill();ellipse(0,12,19,5,'#938c9b')}else if(id==='bed'){drawRounded(-39,-11,78,28,10,'#d5b6dc');drawRounded(-39,-28,78,23,12,'#f5d4e2');drawRounded(-32,-23,28,16,6,'#fff9f1')}ctx.restore()}
function shadeColor(hex,mul){let z=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(z))return '#ddd';let v=[0,2,4].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(z.slice(i,i+2),16)*mul))));return `rgb(${v.join(',')})`}

const customArmParts={upperLeft:new Image(),lowerLeft:new Image(),lowerRight:new Image(),upperRight:new Image()};
const armPartReady={upperLeft:false,lowerLeft:false,lowerRight:false,upperRight:false};
function loadArmPart(key,path){
 const img=customArmParts[key];
 let fallback=false;
 img.onload=()=>{armPartReady[key]=img.naturalWidth>0;clearTintCache(handTintCache[key]);drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=armPartEmbedded[key]}else armPartReady[key]=false};
 img.src=assetCandidates(path)[0];
}
function drawPreviewIfOpen(){if(document.getElementById('preview'))drawPreview()}
loadArmPart('upperLeft','assets/armupperl.png');
loadArmPart('lowerLeft','assets/armlowerl.png');
loadArmPart('lowerRight','assets/armlowerr.png');
loadArmPart('upperRight','assets/armupperr.png');
// Cache tinted arm parts. Preserve the source PNG alpha, its shadows and highlights.
// Один обмежений LRU для Canvas-копій PNG. Canvas зберігається у RAM/GPU,
// а не в HTTP-кеші браузера; обмеження захищає слабкі пристрої.
function tintCacheGet(cache,key){
 if(!cache.has(key))return null;
 const hit=cache.get(key);cache.delete(key);cache.set(key,hit);
 return hit;
}
function clearTintCache(cache){
 for(const c of cache.values()){if(c){c.width=0;c.height=0}}
 cache.clear();
}
function tintCachePut(cache,key,value,limit){
 if(cache.has(key))cache.delete(key);
 cache.set(key,value);
 while(cache.size>limit){const oldest=cache.keys().next().value;const old=cache.get(oldest);cache.delete(oldest);if(old&&old!==value){old.width=0;old.height=0}}
}
const TINT_CACHE_LIMIT={hand:8,leg:8,body:8,head:8,ear:8};
const handTintCache={upperLeft:new Map(),lowerLeft:new Map(),lowerRight:new Map(),upperRight:new Map()};
function tintArmPart(key,color){
 const img=customArmParts[key];
 if(!armPartReady[key])return null;
 const cache=handTintCache[key];
 const cacheKey=String(color).trim().toLowerCase();
 {const hit=tintCacheGet(cache,cacheKey);if(hit)return hit;}
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=cacheKey.match(/^#([0-9a-f]{6})$/i)||cacheKey.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6){rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));}
 else if(match){rgb=[+match[1],+match[2],+match[3]];}
 else{rgb=[240,239,241];}
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 tintCachePut(cache,cacheKey,canvas,TINT_CACHE_LIMIT.hand);
 return canvas;
}
function renderArmPart(g,key,color,height,pivotX=.5,pivotY=.06){
 const tinted=tintArmPart(key,color);
 const img=customArmParts[key];
 if(tinted&&img?.naturalWidth&&img?.naturalHeight){
  const width=height*img.naturalWidth/img.naturalHeight;
  g.drawImage(tinted,-width*pivotX,-height*pivotY,width,height);
  return {width,height};
 }
 ellipse(0,height*.45,Math.max(5,height*.16),height*.42,color);
 return {width:height*.32,height};
}
const BUILDER_POSE={
 legL:{x:-21,y:-52,rot:0,scale:100},legR:{x:21,y:-52,rot:0,scale:100},
 torso:{x:0,y:-36,rot:0,scale:100},
 upperL:{x:23,y:-116,rot:-1,scale:100},lowerL:{x:34,y:47,rot:-5,scale:100},
 upperR:{x:-23,y:-116,rot:1,scale:100},lowerR:{x:-34,y:47,rot:5,scale:100},
 head:{x:0,y:-153,rot:0,scale:49}
};
const segmentedArmMetrics={
 // Ліва/права сторона екрана: авторські PNG поєднуються за напрямком вигину.
 // Масштаб збільшений; лікоть з'єднано з нижнім краєм верхнього сегмента.
 left:{upperKey:'upperLeft',lowerKey:'lowerRight',upperHeight:53,lowerHeight:65,upperPivotX:.24,upperPivotY:.025,lowerPivotX:.80,lowerPivotY:.025,elbowX:BUILDER_POSE.lowerL.x,elbowY:BUILDER_POSE.lowerL.y},
 right:{upperKey:'upperRight',lowerKey:'lowerLeft',upperHeight:53,lowerHeight:65,upperPivotX:.76,upperPivotY:.025,lowerPivotX:.18,lowerPivotY:.025,elbowX:BUILDER_POSE.lowerR.x,elbowY:BUILDER_POSE.lowerR.y}
};
function renderSegmentedArm(g,side,color,upperAngle=0,lowerAngle=0){
 const m=segmentedArmMetrics[side];
 g.save();
 g.rotate(upperAngle+(side==='left'?BUILDER_POSE.upperL.rot:BUILDER_POSE.upperR.rot)*Math.PI/180);
 renderArmPart(g,m.upperKey,color,m.upperHeight,m.upperPivotX,m.upperPivotY);
 g.translate(m.elbowX,m.elbowY);
 g.rotate(lowerAngle+(side==='left'?BUILDER_POSE.lowerL.rot:BUILDER_POSE.lowerR.rot)*Math.PI/180);
 renderArmPart(g,m.lowerKey,color,m.lowerHeight,m.lowerPivotX,m.lowerPivotY);
 g.restore();
}
function renderHand(g,side,color){
 renderSegmentedArm(g,side,color,0,0);
}

const customLegs={left:new Image(),right:new Image()};
const legReady={left:false,right:false};
function loadCustomLeg(side,path){
 const img=customLegs[side];
 let fallback=false;
 img.onload=()=>{legReady[side]=img.naturalWidth>0;clearTintCache(legTintCache[side]);drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=legEmbedded[side]}else legReady[side]=false};
 img.src=path;
}
loadCustomLeg('left',legEmbedded.left);
loadCustomLeg('right',legEmbedded.right);
const legTintCache={left:new Map(),right:new Map()};
function tintLeg(side,color){
 const img=customLegs[side];
 if(!legReady[side])return null;
 const cache=legTintCache[side];
 const key=String(color).trim().toLowerCase();
 {const hit=tintCacheGet(cache,key);if(hit)return hit;}
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=key.match(/^#([0-9a-f]{6})$/i)||key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6){rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));}
 else if(match){rgb=[+match[1],+match[2],+match[3]];}
 else{rgb=[240,239,241];}
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 tintCachePut(cache,key,canvas,TINT_CACHE_LIMIT.leg);
 return canvas;
}
function renderLeg(g,side,color){
 const tinted=tintLeg(side,color);
 if(tinted){
  const height=144,width=height*186/754;
  g.drawImage(tinted,-width/2,-1,width,height);
 }else{
  line(0,0,0,23,shadeColor(color,.84),12);ellipse(0,23,10,5,color);
 }
}
// Спільна анімація ходьби: чергування ніг, підйом носка й перекриття тазом.
// PNG ніг ніколи не змінюються: зсувається лише їхня локальна позиція.
function drawWalkingLegs(g,color,phase,moving){
 // Ноги завжди малюються ПОЗАДУ тулуба та костюма.
 // Ноги зберігають масштаб 144 px, посадку опущено ще на 7 px.
 // Вони залишаються позаду тулуба та костюма.
 for(const side of [-1,1]){
  const stride=moving?Math.sin(phase+(side===-1?0:Math.PI)):0;
  const lift=moving?Math.max(0,stride)*5:0;
  g.save();
  const d=side===-1?BUILDER_POSE.legL:BUILDER_POSE.legR;
  g.translate(d.x+stride*4,d.y-lift);
  g.scale(d.scale/100,d.scale/100);
  g.rotate(d.rot*Math.PI/180+stride*.17);
  renderLeg(g,side===-1?'left':'right',color);
  g.restore();
 }
}

const customBody=new Image();
let bodyReady=false,bodyCrop=null;
const bodyTintCache=new Map();
function loadCustomBody(path){
 let fallback=false;
 customBody.onload=()=>{
  bodyReady=customBody.naturalWidth>0;
  bodyCrop=null;
  if(bodyReady){
   try{
    const c=document.createElement('canvas');c.width=customBody.naturalWidth;c.height=customBody.naturalHeight;
    const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(customBody,0,0);
    const pixels=g.getImageData(0,0,c.width,c.height).data;
    let l=c.width,t=c.height,r=-1,b=-1;
    for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(pixels[(y*c.width+x)*4+3]>12){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y)}
    if(r>=l)bodyCrop={x:l,y:t,w:r-l+1,h:b-t+1};
   }catch(err){console.warn('Тіло PNG: неможливо визначити прозорі поля',err)}
  }
  clearTintCache(bodyTintCache);
  if(typeof shopSceneCache!=='undefined')shopSceneCache=null;
  if(typeof drawPreviewIfOpen==='function')drawPreviewIfOpen();
 };
 customBody.onerror=()=>{if(!fallback){fallback=true;customBody.src=bodyEmbedded}else bodyReady=false};
 customBody.src=path;
}
loadCustomBody('assets/body.png');
function tintBody(color){
 if(!bodyReady)return null;
 const key=String(color).trim().toLowerCase();
 {const hit=tintCacheGet(bodyTintCache,key);if(hit)return hit;}
 const canvas=document.createElement('canvas');
 canvas.width=customBody.naturalWidth;canvas.height=customBody.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(customBody,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=key.match(/^#([0-9a-f]{6})$/i)||key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6)rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));
 else if(match)rgb=[+match[1],+match[2],+match[3]];
 else rgb=[240,239,241];
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 tintCachePut(bodyTintCache,key,canvas,TINT_CACHE_LIMIT.body);
 return canvas;
}
function renderBody(g,color,variant='player'){
 const tinted=tintBody(color);
 if(!tinted)return false;
 const crop=bodyCrop||{x:0,y:0,w:customBody.naturalWidth||512,h:customBody.naturalHeight||512};
 const targetH=variant==='npc'?111:109;
 const targetW=crop.w*(targetH/crop.h);
 const top=variant==='npc'?-103:-101;
 g.drawImage(tinted,crop.x,crop.y,crop.w,crop.h,-targetW/2,top,targetW,targetH);
 return true;
}

const customHeads={round:new Image(),wide:new Image(),pointy:new Image()};
const headReady={round:false,wide:false,pointy:false};
const headTintCache={round:new Map(),wide:new Map(),pointy:new Map()};
function loadCustomHead(kind,path){
 const img=customHeads[kind];
 let fallback=false;
 img.onload=()=>{headReady[kind]=img.naturalWidth>0;clearTintCache(headTintCache[kind]);if(typeof shopSceneCache!=='undefined')shopSceneCache=null;drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=headEmbedded[kind]}else headReady[kind]=false};
 img.src=path;
}
loadCustomHead('round','assets/head_round.png');
loadCustomHead('wide','assets/head_wide.png');
loadCustomHead('pointy','assets/head_pointy.png');
function tintHead(kind,color){
 const img=customHeads[kind];
 if(!headReady[kind])return null;
 const cache=headTintCache[kind];
 const key=String(color).trim().toLowerCase();
 {const hit=tintCacheGet(cache,key);if(hit)return hit;}
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=key.match(/^#([0-9a-f]{6})$/i)||key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6){rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));}
 else if(match){rgb=[+match[1],+match[2],+match[3]];}
 else{rgb=[240,239,241];}
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 tintCachePut(cache,key,canvas,TINT_CACHE_LIMIT.head);
 return canvas;
}
function renderHeadBase(g,kind,color){
 if(!Object.prototype.hasOwnProperty.call(customHeads,kind))return false;
 const tinted=tintHead(kind,color);
 if(!tinted)return false;
 const size=kind==='wide'?100:kind==='pointy'?102:98;
 g.drawImage(tinted,-size/2,-size/2,size,size);
 return true;
}

function loadCustomEarPair(kind,path){

 let fallback=false;
 img.onload=()=>{earPairReady[kind]=img.naturalWidth>0;clearTintCache(earPairTintCache[kind]);drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=earEmbedded[kind]}else earPairReady[kind]=false};

function tintEarPair(kind,color){
 const img=customEarPairs[kind];
 if(!earPairReady[kind])return null;
 const cache=earPairTintCache[kind];
 const key=String(color).trim().toLowerCase();
 {const hit=tintCacheGet(cache,key);if(hit)return hit;}
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const hex=key.match(/^#([0-9a-f]{6})$/i);
 const rgbm=key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb=hex?[0,2,4].map(i=>parseInt(hex[1].slice(i,i+2),16)):rgbm?[+rgbm[1],+rgbm[2],+rgbm[3]]:[240,239,241];
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 tintCachePut(cache,key,canvas,TINT_CACHE_LIMIT.ear);
 return canvas;
}

function drawFurnitureGrid(){

 const step=FURNITURE_GRID_STEP;
 ctx.save();ctx.lineWidth=1;ctx.strokeStyle='#ffffff75';ctx.beginPath();
 for(let x=step;x<W;x+=step){const px=Math.round(x)+.5;ctx.moveTo(px,0);ctx.lineTo(px,H)}
 for(let y=step;y<H;y+=step){const py=Math.round(y)+.5;ctx.moveTo(0,py);ctx.lineTo(W,py)}
 ctx.stroke();ctx.strokeStyle='#18243c55';ctx.beginPath();
 for(let x=step*4;x<W;x+=step*4){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}

// Очищення лише похідних графічних копій. Джерельні PNG та збереження не зачіпаємо.
function clearRedundantGraphicsCache(){
 const groups=[...Object.values(handTintCache),...Object.values(legTintCache),...Object.values(headTintCache),...Object.values(earPairTintCache)];
 let count=0,bytes=0;
 for(const cache of groups){
  for(const canvas of cache.values()){
   if(canvas&&canvas.width&&canvas.height){count++;bytes+=canvas.width*canvas.height*4}
  }
  clearTintCache(cache);
 }
 for(const im of wallpaperImageCache.values()){im.onload=null;im.onerror=null;im.removeAttribute('src')}wallpaperImageCache.clear();
 if(shopSceneCache){
  for(const key of ['sellerLayer','counterLayer']){
   const canvas=shopSceneCache[key];
   if(canvas){count++;bytes+=canvas.width*canvas.height*4;canvas.width=0;canvas.height=0}
  }
  shopSceneCache=null;
  shopRenderAccum=1;
 }
 return {count,megabytes:bytes/1048576};
}

function drawPreview(){let c=document.getElementById('preview');if(!c)return;let g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);pen=g;g.save();g.translate(c.width/2,c.height*.66);g.scale(1.35,1.35);puppet(g,0,0,1,false);g.restore();pen=ctx}

function paintOneFacePreview(c){

 try{
  const slot=c.dataset.facePreview,id=c.dataset.item,g=c.getContext('2d');if(!g)return;
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle='#f8fbff';

  if(id)state.equipped[slot]=id;else delete state.equipped[slot];

let selectedPlot=0,needAccumulator=0;
function updateRoomCleanUI(){const b=document.getElementById('roomCleanButton');if(!b||!state)return;const show=state.location==='home'&&state.room<3;b.style.display=show?'block':'none';if(show){const n=Math.round(state.roomCleanliness);b.textContent='🧹 Чистота будинку: '+n+'%';b.classList.toggle('dirty',n<=30);}}
function updateRoomUI(){let el=document.getElementById('roomSwitcher');if(!el)return;el.classList.toggle('show',state.location==='home'||state.location==='npc'||state.location==='shared');el.querySelectorAll('[data-room]').forEach(b=>{let i=Number(b.dataset.room);if(state.location==='shared'){const open=!!sharedHouse?.rooms.some(r=>r.id===i);b.style.display=i===3?'none':'';b.classList.toggle('active',i===sharedRoom);b.classList.toggle('locked',!open);b.textContent=open?String(i+1):'🔒';b.title=open?'Кімната друга '+(i+1):'Зачинено';return;}if(state.location==='npc'){const open=i<npcRoomCount(visitingNPC);b.style.display=i===3?'none':'';b.classList.toggle('active',i===npcRoom);b.classList.toggle('locked',!open);b.title=open?'Кімната друга '+(i+1):'Зачинено';b.textContent=open?String(i+1):'🔒';return;}b.style.display='';b.classList.toggle('active',i===state.room);b.classList.toggle('locked',state.level<ROOM_LEVELS[i]);b.title=state.level<ROOM_LEVELS[i]?'Відкриється на рівні '+ROOM_LEVELS[i]:['Кімната','Спальня','Вітальня','Космічний двір'][i];b.textContent=state.level<ROOM_LEVELS[i]?'🔒':i===3?'✦':String(i+1)});}
function updateNeedsUI(){const el=document.getElementById('needsOpen');if(!el||!state.needs)return;let worst=Math.min(state.needs.dirt,state.needs.hunger,state.needs.sleep,state.needs.boredom,state.needs.health);el.classList.toggle('low',worst<=25);el.textContent=worst<=25?'⚠️ Потреби':'💗 Потреби'}
function roomSwitch(i){if(state.location==='shared'){if(!sharedHouse.rooms.some(r=>r.id===i)){toast('🔒 Ця кімната закрита');return}sharedRoom=i;walkTarget=null;pet.x=pet.y=0;updateRoomUI();return}if(state.location==='npc'){if(i<0||i>=npcRoomCount(visitingNPC)){toast('🔒 У друга ця кімната зачинена');return;}npcRoom=i;pet.x=pet.y=0;walkTarget=null;updateRoomUI();toast('Кімната друга '+(i+1));return;}if(state.level<ROOM_LEVELS[i]){toast('🔒 Кімната відкриється на рівні '+ROOM_LEVELS[i]);return}if(state.location!=='home'){toast('Кімнати доступні у твоєму домі');return}if(i<0||i>3)return;state.room=i;selectedPlaced=null;dragPlaced=null;if(itemDockType==='inventory')renderItemDock();updateRoomCleanUI();pet.x=0;pet.y=0;walkTarget=null;placing=null;save();updateLocationUI();toast(i===3?'Космічний двір 🪐':'Кімната '+(i+1))}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>roomSwitch(Number(b.dataset.room)));
document.getElementById('needsOpen').onclick=()=>openPanel('needs');document.getElementById('roomCleanButton').onclick=()=>openPanel('roomClean');
document.getElementById('yardOpen').onclick=()=>{if(state.level<ROOM_LEVELS[3]){toast('🔒 Двір відкриється на рівні '+ROOM_LEVELS[3]);return}if(state.location!=='home')setLocation('home');roomSwitch(3)};
function hasPlaced(id){return state.homePlaced.some(p=>p.id===id)}
function placedInRoom(id,room){return state.homePlaced.some(p=>p.id===id&&(p.room===room||(p.room===undefined&&room===0)))}
function tickRoomDirt(){const changed=syncHomeCleanliness();if(changed){dustLastLayout='';updateDustLayer();debounceSave()}updateRoomCleanUI();}
function cleanRoom(){if(state.location!=='home'||state.room===3){toast('Прибирати можна лише у власній кімнаті');return;}const i=state.room;if(!placedInRoom('vacuum',i)){toast('Постав звичайний пилосос у цій кімнаті');return;}cleanDustRoom('home',i);syncHomeCleanliness();save();updateRoomCleanUI();toast('Будинок прибрано! 🧹');earnXP(6);}
function roomCleanHTML(){if(state.location!=='home'||state.room===3)return '<p>Повернися у свою кімнату.</p>';let d=Math.round(state.roomCleanliness);return `<p class="note">Чистота спільна для всіх кімнат будинку. Пил з’являється поступово за реальним локальним часом: 15 пилинок на добу (по одній кожні 96 хвилин). Чистота падає тільки тоді, коли з’являється новий пил.</p><div class="needrow ${d<=30?'danger':''}"><b>🧹 Чистота будинку</b><div class="needbar"><i style="width:${d}%"></i></div><strong>${d}%</strong></div><div class="footer-actions"><button class="primary" data-act="cleanRoom" ${placedInRoom('vacuum',state.room)?'':'disabled'}>🧹 Прибрати вручну</button></div><p class="note">Звичайний пилосос прибирає весь наявний пил у поточній кімнаті. Кожна пилинка знижує спільну чистоту на 6 пунктів; прибирання відновлює їх. Робот-пилосос прибирає пилинки у своїй кімнаті. Максимум 15 пилинок на день у всьому будинку.</p>`;}
function tickNeeds(dt){if(!state.needs)return;needAccumulator+=dt;if(needAccumulator<1)return;tickRoomDirt();let elapsed=needAccumulator;needAccumulator=0;const n=state.needs;const now=Date.now();const offline=Math.max(0,Math.min(8*3600,(now-(state.needsAt||now))/1000-elapsed));elapsed+=offline;state.needsAt=now;
 n.dirt=clamp(n.dirt-elapsed*.007);n.hunger=clamp(n.hunger-elapsed*.012);n.sleep=clamp(n.sleep-elapsed*.009);n.boredom=clamp(n.boredom-elapsed*.013);
 if(hasPlaced('auto_fridge')&&n.hunger<=30){n.hunger=clamp(n.hunger+50);if(offline<2)toast('Розумний холодильник нагодував пета 🥗')}
 if(hasPlaced('tv'))n.boredom=clamp(n.boredom+elapsed*.009);
 if(hasPlaced('toy'))n.boredom=clamp(n.boredom+elapsed*.006);
 if(n.hunger<5||n.dirt<5||n.sleep<5)n.health=clamp(n.health-elapsed*.003);
 if(Math.random()<Math.min(.000004*elapsed,.005))n.health=clamp(n.health-12);
 updateNeedsUI();if(Math.floor(clock)%12===0)debounceSave();
}
function carePet(kind){const n=state.needs;if(!n)return;let msg='';if(kind==='wash'){if(!hasPlaced('bath')&&!hasPlaced('shower')){toast('Спочатку постав ванну або душ вдома');return}n.dirt=clamp(n.dirt+70);msg='Пет помився 🛁';earnXP(8)}else if(kind==='sleep'){if(!hasPlaced('bed')){toast('Спочатку постав ліжко вдома');return}n.sleep=clamp(n.sleep+78);msg='Пет виспався 💤';earnXP(8)}else if(kind==='play'){if(!hasPlaced('toy')&&!hasPlaced('tv')){toast('Потрібна іграшка пета або телевізор');return}n.boredom=clamp(n.boredom+55);msg='Пет погрався! 🎲';earnXP(8)}else if(kind==='heal'){if(!state.owned.medicine){toast('Купи ліки в магазині');return}state.owned.medicine--;n.health=clamp(n.health+48);msg='Пет одужує 💊';earnXP(8)}else if(kind==='feed'){if(!hasPlaced('auto_fridge')){toast('Годує лише спеціальний розумний холодильник');return}n.hunger=clamp(n.hunger+50);msg='Холодильник видав їжу 🥗';earnXP(8)}save();if(msg)toast(msg)}
function needsPanelHTML(){return `<p class="note">Потреби поступово змінюються. 100% означає добрий стан: чистота, ситість, відпочинок, настрій і здоров’я. 0% означає, що потребу необхідно задовольнити.</p>${Object.entries(needsNames).map(([k,n])=>{let v=Math.round(state.needs[k]);let bad=v<25;return `<div class="needrow ${bad?'danger':''}"><b>${n}</b><div class="needbar"><i style="width:${v}%"></i></div><strong>${v}%</strong></div>`}).join('')}<div class="footer-actions"><button class="primary" data-act="care" data-val="wash">🛁 Помитися</button><button class="primary" data-act="care" data-val="sleep">💤 Поспати</button><button class="primary" data-act="care" data-val="play">🧸 Погратися</button><button class="primary" data-act="care" data-val="feed">🥗 Холодильник</button><button class="primary" data-act="care" data-val="heal">💊 Лікувати</button></div><p class="note">Предмети повинні бути розміщені у твоєму домі. Звичайний холодильник не годує. Ліки купуються окремо. Здоров’я погіршується рідко, а занедбані потреби прискорюють це.</p>`}
function plotCoords(i){const columns=3,rows=2,c=i%columns,r=Math.floor(i/columns);const w=Math.min(W*.72,580),h=Math.min(H*.37,255);return{x:W*.5-w/2+(c+.5)*w/3,y:H*.42+(r+.5)*h/2}}
function yardPlotAt(x,y){for(let i=0;i<6;i++){let p=plotCoords(i);if(Math.abs(x-p.x)<Math.min(W*.72,580)/6&&Math.abs(y-p.y)<Math.min(H*.37,255)/4)return i}return -1}
function plotReady(p){return !!p&&Date.now()>=p.readyAt}
function drawYard(){let grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#080b29');grad.addColorStop(.52,'#281448');grad.addColorStop(1,'#07475a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<100;i++){let x=rand(i+271)*W,y=rand(i+982)*H;ellipse(x,y,1+(i%4)*.35,1+(i%3)*.35,'#c7eaff')}ellipse(W*.79,H*.23,Math.min(W*.13,80),Math.min(W*.13,80),'#795bd2');ellipse(W*.75,H*.20,Math.min(W*.09,54),Math.min(W*.09,54),'#a3a0ef');ctx.textAlign='center';ctx.fillStyle='#c9f9ff';ctx.font='bold 17px system-ui';ctx.fillText('КОСМІЧНА ФЕРМА КОМАХ',W*.5,H*.25);for(let i=0;i<6;i++){const p=plotCoords(i),plot=state.bugPlots[i],ready=plotReady(plot);drawRounded(p.x-46,p.y-32,92,65,12,ready?'#357e73':'#1e3b66');ctx.strokeStyle=ready?'#8df7bd':'#64cde2';ctx.lineWidth=2;ctx.strokeRect(p.x-43,p.y-29,86,60);ctx.fillStyle='#e7fdff';ctx.font='25px system-ui';ctx.fillText(plot?(BUGS[plot.type]?.emoji||'🐛'):'＋',p.x,p.y+7);ctx.font='11px system-ui';ctx.fillText(plot?(ready?'Зібрати':'Росте...'):'Порожньо',p.x,p.y+24)}}
function plantBug(type){let bug=BUGS[type],old=state.bugPlots[selectedPlot];if(!bug||old)return;if(state.coins<bug.seed){toast('Недостатньо монет для інкубації');return}state.coins-=bug.seed;state.bugPlots[selectedPlot]={type,readyAt:Date.now()+bug.grow*1000};save();toast('Комаху запущено в інкубатор!')}
function harvestBug(){const plot=state.bugPlots[selectedPlot];if(!plot){toast('Капсула порожня');return}if(!plotReady(plot)){toast('Комаха ще росте');return}state.bugs[plot.type]=(state.bugs[plot.type]||0)+1;state.bugPlots[selectedPlot]=null;save();earnXP(12);toast('Комаху зібрано в колекцію! 🐛')}
function sellBug(type){const bug=BUGS[type];if(!bug||!state.bugs[type])return;state.bugs[type]--;state.coins+=bug.price;save();toast('Продано '+bug.name+' за '+bug.price+' <img class="currency-icon" src="/hoomanchat/assets/coin.png" alt="монети">')}
function yardPanelHTML(){const plot=state.bugPlots[selectedPlot],ready=plotReady(plot);return `<p class="note">Космічний двір: вирощуй комах у шести капсулах. Час росту йде за годинником пристрою, навіть коли гру закрито.</p><div class="yardGrid">${state.bugPlots.map((p,i)=>`<button class="yardPlot ${selectedPlot===i?'active':''}" data-act="plotSelect" data-val="${i}">Капсула ${i+1}<br>${p?(BUGS[p.type]?.emoji||'🐛')+' '+(plotReady(p)?'Готово':Math.max(1,Math.ceil((p.readyAt-Date.now())/1000))+' с'):'✦ Порожня'}</button>`).join('')}</div><h3>Капсула ${selectedPlot+1}</h3>${plot?`<p>${BUGS[plot.type]?.name||'Комаха'} · ${ready?'Можна забирати':'Ще росте'}</p><button class="primary" data-act="harvestBug" ${ready?'':'disabled'}>📦 Зібрати комаху</button>`:`<div class="grid">${Object.entries(BUGS).map(([id,b])=>`<div class="item"><span class="emoji">${b.emoji}</span><b>${b.name}</b><small>Ріст: ${b.grow} с</small><button data-act="plantBug" data-val="${id}" ${state.coins<b.seed?'disabled':''}>Виростити · ${b.seed} <img class="currency-icon" src="/hoomanchat/assets/coin.png" alt="монети"></button></div>`).join('')}</div>`}<h3>Зібрані комахи · продаж</h3><div class="grid">${Object.entries(BUGS).map(([id,b])=>`<div class="item"><span class="emoji">${b.emoji}</span><b>${b.name}</b><small>×${state.bugs[id]||0}</small><button data-act="sellBug" data-val="${id}" ${(state.bugs[id]||0)<1?'disabled':''}>Продати +${b.price} <img class="currency-icon" src="/hoomanchat/assets/coin.png" alt="монети"></button></div>`).join('')}</div>`}
body.addEventListener('click',e=>{const b=e.target.closest('[data-act="plotSelect"]');if(!b)return;selectedPlot=Number(b.dataset.val);showPanel()});

load();if(!state.windowsInitialized){state.homePlaced=Array.isArray(state.homePlaced)?state.homePlaced:[];state.homePlaced.push({id:'window_day',x:.31,y:.29,room:0},{id:'window_day',x:.64,y:.29,room:0});state.windowsInitialized=true;}dustStore();ensureHomeDust();syncHomeCleanliness();save();state.location='home';state.room=state.level>=ROOM_LEVELS[state.startRoom]?state.startRoom:0;document.getElementById('profileButton').onclick=()=>openPanel('profile');resize();updateHUD();updateLocationUI();scheduleRender();
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(mainFrameId)cancelAnimationFrame(mainFrameId);mainFrameId=0;if(miniFrame)cancelAnimationFrame(miniFrame);miniFrame=0}
 else{lastTime=performance.now();renderLastPaint=0;miniLast=performance.now();if(mini&&!mini.ended&&!miniFrame)miniFrame=requestAnimationFrame(miniTick);scheduleRender();updateDustLayer()}
});
window.addEventListener('pagehide',()=>{if(mainFrameId)cancelAnimationFrame(mainFrameId);mainFrameId=0;save()});

// Посилання з #room= відкриває знімок кімнати після запуску гри.
window.addEventListener('load',()=>{if(location.hash.startsWith('#room=')&&location.hash.length<24010){try{openSharedHouse(location.hash.slice(6))}catch(error){console.warn('Код будинку не відкрито',error);toast('Не вдалося відкрити код будинку')}}});
</script>
</body>
</html>
