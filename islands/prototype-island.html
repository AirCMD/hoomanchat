/* Дані гостя тільки під час візиту в його дім. */

.yardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.yardPlot{border:1px solid #6fd6db;border-radius:12px;background:#152844;color:#e6ffff;padding:10px;text-align:left;cursor:pointer}.yardPlot.active{border-color:#ff9fe5;background:#3b2758}.needbar{height:9px;background:#dce6ed;border-radius:9px;overflow:hidden}.needbar>i{display:block;height:100%;background:linear-gradient(90deg,#20cfba,#79e1ff)}.needrow{margin:11px 0;display:grid;grid-template-columns:95px 1fr 40px;gap:8px;align-items:center;font-size:12px}.needrow.danger .needbar>i{background:linear-gradient(90deg,#f45d83,#ffb15b)}

/* Прото-Тип: оновлений редактор зовнішності */
.editor-shell{display:grid;gap:15px}
.editor-hero{display:grid;grid-template-columns:minmax(155px,220px) minmax(0,1fr);gap:15px;align-items:stretch}
.editor-preview{min-height:250px;padding:12px;border:1px solid #54d5e9;border-radius:18px;background:radial-gradient(circle at 50% 35%,#e8faff,#c7d9f5 70%,#e7d5fd);box-shadow:inset 0 0 24px #35d1ed2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.editor-preview .preview{height:230px;width:200px;max-width:100%;border:0;background:transparent}
.editor-preview small{font-size:11px;color:#536a88;text-align:center}
.editor-section{border:1px solid #d6e4f1;border-radius:15px;padding:13px;background:#fffdfd;box-shadow:0 5px 16px #2864a50b}
.editor-section h3{margin:0 0 11px;font-size:15px;color:#27365d}
.editor-options{display:grid;gap:10px;align-content:start}
.editor-options label{font-size:12px;font-weight:750;display:block;margin-bottom:5px}

.editor-color{display:flex;gap:9px;align-items:center;border:1px solid #a5d7ed;padding:10px;border-radius:12px;background:#e9f8ff}

.editor-color p{margin:0;font-size:11px;color:#5c7190}
.editor-commit{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.editor-commit button{min-height:41px;font-weight:800;border-radius:11px;border:1px solid #8adbe8;cursor:pointer}
.editor-commit .primary{color:white}.editor-commit .secondary{color:#2b4364;background:#eaf2f8}

function npcWalkTick(dt){if(state.location!=='npc'&&!visitor)return;if(clock>npcMotion.at){npcMotion.target=(Math.random()-.5)*Math.min(W*.32,230);npcMotion.at=clock+2+Math.random()*4}let diff=npcMotion.target-npcMotion.x,n=Math.sign(diff)*Math.min(Math.abs(diff),dt*48);npcMotion.x+=n;if(Math.abs(n)>.001)npcMotion.step+=Math.abs(n)*.22;if(Math.abs(diff)>2)npcMotion.dir=Math.sign(diff)}
function drawNPCVisit(){
 if(state.location==='npc'&&visitingNPC){drawNPCFigure(visitingNPC,W*.63+npcMotion.x,H*.81+Math.sin(clock*5)*((Math.abs(npcMotion.target-npcMotion.x)>3)?2:0),Math.max(.85,Math.min(1.25,W/570)));return}
 if(state.location==='home'&&visitor){drawNPCFigure(visitor,W*.67+npcMotion.x,H*.82,Math.max(.72,Math.min(1,W/620)))}
}
function updateVisitor(){if(state.location!=='home'||visitingNPC)return;if(visitor&&clock>visitor.until){toast(visitor.name+' пішов/пішла додому');visitor=null;nextVisitorAt=clock+35+Math.random()*45}if(!visitor&&clock>nextVisitorAt){const n=NPCS[Math.floor(Math.random()*NPCS.length)];visitor={...n,until:clock+18};toast('До тебе завітав '+n.name+'! 👋')}}
function drawFurniture(id,x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,12,26,7,'#567c6970');if(id==='vacuum'){line(-9,-10,10,-43,'#c6ecff',5);line(-19,-8,14,-8,'#172942',10);ellipse(-3,-7,17,9,'#4dd6df');}else if(id==='robot_vacuum'){ellipse(0,-8,31,17,'#1b293b');ellipse(0,-11,27,14,'#67dce2');ellipse(0,-12,7,5,'#142e4b');}else if(id==='bath'||id==='shower'){drawRounded(-33,-33,66,47,12,id==='bath'?'#bcecff':'#8ddbe2');drawRounded(-26,-25,52,30,8,'#f0fbfe');line(18,-37,18,-51,'#e5f8ff',5)}else if(id==='tv'){drawRounded(-35,-48,70,45,7,'#11182b');drawRounded(-29,-42,58,33,4,'#3c9fd3');line(0,-3,0,13,'#a5a8bf',5)}else if(id==='fridge'||id==='auto_fridge'){drawRounded(-25,-58,50,77,8,id==='auto_fridge'?'#85d7da':'#c4cbd6');line(-10,-22,18,-22,'#74869a',2);drawRounded(11,-14,3,19,2,'#edfaff')}else if(id==='toy'){ellipse(0,-15,20,22,'#eac3ac');ellipse(-14,-37,9,10,'#eac3ac');ellipse(14,-37,9,10,'#eac3ac')}else if(id==='chair'){drawRounded(-24,-36,48,34,10,'#f4bba7');drawRounded(-29,-10,58,21,6,'#d39495');line(-18,8,-18,19,'#856f72',5);line(18,8,18,19,'#856f72',5)}else if(id==='plant'){drawRounded(-13,-7,26,27,5,'#c4887b');ellipse(0,-23,17,26,'#5aa675');ellipse(-13,-31,13,17,'#77c780');ellipse(14,-33,12,17,'#82c887')}else if(id==='lamp'){line(0,-50,0,10,'#938c9b',5);ctx.beginPath();ctx.moveTo(-21,-51);ctx.lineTo(21,-51);ctx.lineTo(12,-20);ctx.lineTo(-12,-20);ctx.fillStyle='#ffefb4';ctx.fill();ellipse(0,12,19,5,'#938c9b')}else if(id==='bed'){drawRounded(-39,-11,78,28,10,'#d5b6dc');drawRounded(-39,-28,78,23,12,'#f5d4e2');drawRounded(-32,-23,28,16,6,'#fff9f1')}ctx.restore()}
function shadeColor(hex,mul){let z=hex.replace('#','');if(!/^[0-9a-f]{6}$/i.test(z))return '#ddd';let v=[0,2,4].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(z.slice(i,i+2),16)*mul))));return `rgb(${v.join(',')})`}

const customHands={left:new Image(),right:new Image()};
const handReady={left:false,right:false};
function loadCustomHand(side,path){
 const img=customHands[side];
 let fallback=false;
 img.onload=()=>{handReady[side]=img.naturalWidth>0;handTintCache[side].clear();drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=handEmbedded[side]}else handReady[side]=false};
 img.src=path;
}
function drawPreviewIfOpen(){if(document.getElementById('preview'))drawPreview()}
loadCustomHand('left','assets/handl.png');
loadCustomHand('right','assets/handr.png');
// Cache tinted hands. Preserve the source PNG alpha, its shadows and highlights.
// Each NPC passes its own coat shade; the player passes the torso color.
const handTintCache={left:new Map(),right:new Map()};
function tintHand(side,color){
 const img=customHands[side];
 if(!handReady[side])return null;
 const cache=handTintCache[side];
 const key=String(color).trim().toLowerCase();
 if(cache.has(key))return cache.get(key);
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=key.match(/^#([0-9a-f]{6})$/i)||key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6){rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));}
 else if(match){rgb=[+match[1],+match[2],+match[3]];}
 else{rgb=[240,239,241];}
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  // Original grayscale value is the light/shadow multiplier.
  // White becomes chosen color; dark contours retain their depth.
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 // Keep a bounded cache even if the color picker produces hundreds of colors.
 if(cache.size>=48)cache.delete(cache.keys().next().value);
 cache.set(key,canvas);
 return canvas;
}
function renderHand(g,side,color){
 const tinted=tintHand(side,color);
 if(tinted){
  const height=59,width=height*210/466;
  g.drawImage(tinted,-width/2,-3,width,height);
 }else{
  ellipse(0,23,12,29,color);
 }
}

const customLegs={left:new Image(),right:new Image()};
const legReady={left:false,right:false};
function loadCustomLeg(side,path){
 const img=customLegs[side];
 let fallback=false;
 img.onload=()=>{legReady[side]=img.naturalWidth>0;legTintCache[side].clear();drawPreviewIfOpen()};
 img.onerror=()=>{if(!fallback){fallback=true;img.src=legEmbedded[side]}else legReady[side]=false};
 img.src=path;
}
loadCustomLeg('left','assets/legl.png');
loadCustomLeg('right','assets/legr.png');
const legTintCache={left:new Map(),right:new Map()};
function tintLeg(side,color){
 const img=customLegs[side];
 if(!legReady[side])return null;
 const cache=legTintCache[side];
 const key=String(color).trim().toLowerCase();
 if(cache.has(key))return cache.get(key);
 const canvas=document.createElement('canvas');
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const c=canvas.getContext('2d',{willReadFrequently:true});
 c.drawImage(img,0,0);
 const pixels=c.getImageData(0,0,canvas.width,canvas.height);
 const match=key.match(/^#([0-9a-f]{6})$/i)||key.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
 let rgb;
 if(match&&match[1].length===6){rgb=[0,2,4].map(i=>parseInt(match[1].slice(i,i+2),16));}
 else if(match){rgb=[+match[1],+match[2],+match[3]];}
 else{rgb=[240,239,241];}
 const d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]===0)continue;
  const intensity=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
  d[i]=Math.round(rgb[0]*intensity);
  d[i+1]=Math.round(rgb[1]*intensity);
  d[i+2]=Math.round(rgb[2]*intensity);
 }
 c.putImageData(pixels,0,0);
 if(cache.size>=48)cache.delete(cache.keys().next().value);
 cache.set(key,canvas);
 return canvas;
}
function renderLeg(g,side,color){
 const tinted=tintLeg(side,color);
 if(tinted){
  const height=63,width=height*210/466;
  g.drawImage(tinted,-width/2,-2,width,height);
 }else{
  line(0,0,0,23,shadeColor(color,.84),12);ellipse(0,23,10,5,color);
 }
}
// Спільна анімація ходьби: чергування ніг, підйом носка й перекриття тазом.
// PNG ніг ніколи не змінюються: зсувається лише їхня локальна позиція.
function drawWalkingLegs(g,color,phase,moving){
 for(const side of [-1,1]){
  const stride=moving?Math.sin(phase+(side===-1?0:Math.PI)):0;
  const lift=moving?Math.max(0,stride)*6:0;
  g.save();
  // Верх PNG приховується тулубом, а стопа залишається на рівні підлоги.
  g.translate(side*12+stride*4,-48-lift);
  g.rotate(stride*.23);
  renderLeg(g,side===-1?'right':'left',color);
  g.restore();
 }
}
function puppet(g,x,y,scale=1,animated=true){
 let a=state.appearance,fur=a.fur||'#f0eff1',body=a.body||fur;let eq=state.equipped||{};
 let moving=animated&&!!walkTarget;let phase=pet.step;let pulse=animated?(moving?-Math.abs(Math.sin(phase))*1.5:Math.sin(clock*2)*1.2):0;
 let performing=animated&&action!=='idle'&&clock<actionUntil;
 const walk=moving?Math.sin(phase)*.23:Math.sin(clock*1.1)*.03;
 g.save();
 g.translate(x,y+pulse+(performing&&action==='jump'?-Math.abs(Math.sin(clock*12))*27:performing&&action==='dance'?Math.sin(clock*10)*8:0));
 if(performing&&action==='spin')g.scale(Math.cos(clock*9)*scale,scale);else g.scale(scale*(animated?pet.dir:1),scale);
 if(performing&&action==='dance')g.rotate(Math.sin(clock*8)*.11);
 ellipse(0,0,36,9,'#40665f40');

 // tail behind body
 if(eq.tail){
  g.save();g.translate(23,-46);g.rotate(Math.sin(clock*2)*.18);
  g.strokeStyle=shadeColor(fur,.78);g.lineWidth=eq.tail==='tail_fox'?18:10;g.lineCap='round';
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(46,-15,49,-62,28,-58);g.stroke();

 }

 // rear arm

 g.translate(31,-69);
 g.rotate(performing?(action==='wave'?-0.48:Math.sin(clock*12)*.55):(moving?-Math.sin(phase)*.22:Math.sin(clock*1.1)*.04));
 renderHand(g,'left',shadeColor(body,.86));

 }
 if(eq.outfit==='shirt')drawRounded(-27,-80,54,37,13,'#8dbdd1');

 // front arm
 g.save();
 g.translate(-31,-69);

 renderHand(g,'right',body);
 g.restore();

 // head and face, aligned like NPC
 g.save();
 g.translate(0,-96);
 g.rotate(Math.sin(clock*1.3)*.02);
 let hx=a.head==='wide'?42:a.head==='pointy'?36:39;

 // ears behind head
 if(eq.ears==='ears_bunny'){

 }else{
  for(let side of [-1,1]){g.save();g.translate(side*23,-10);g.rotate(side*.07+Math.sin(clock*1.3+side)*.04);g.beginPath();g.moveTo(-11,7);g.lineTo(side*2,-27);g.lineTo(12,7);g.closePath();g.fillStyle=shadeColor(body,.91);g.fill();g.beginPath();g.moveTo(-6,4);g.lineTo(side*1,-15);g.lineTo(7,4);g.closePath();g.fillStyle='#dfb5bb';g.fill();g.restore()}
 }

 // head base
 ellipse(0,0,hx,hy,shadeColor(fur,.89));
 ellipse(0,-3,hx-2,hy-2,fur);
 if(a.head==='pointy'){g.beginPath();g.moveTo(-24,18);g.lineTo(0,38);g.lineTo(24,18);g.closePath();g.fillStyle=fur;g.fill()}

 if(eq.wig){
  g.fillStyle=eq.wig==='wig_blue'?'#9bd0e9':'#e8a9c7';
  g.beginPath();g.ellipse(0,-21,hx+2,hy*.5,0,Math.PI,Math.PI*2);g.fill();
  g.fillRect(-hx+1,-18,10,23);g.fillRect(hx-11,-18,10,23);
 }

 let eye=a.eyeColor||'#4b406c';
 if(eq.cosmetic2==='shadow'){ellipse(-16,-11,12,9,'#bd9dd9');ellipse(16,-11,12,9,'#bd9dd9')}
 if(eq.brows==='brows_bold'){line(-24,-17,-10,-19,'#695969',3.2);line(10,-19,24,-17,'#695969',3.2)}

 if(eq.cosmetic1==='freckles'){for(let side of [-1,1])for(let j=0;j<3;j++)ellipse(side*(20+j*2.8),7+j%2*3.5,1.4,1.4,'#aa817c')}
 if(eq.cosmetic2==='stars'){g.fillStyle='#ebbc48';g.font='12px sans-serif';g.fillText('✦',-32,0);g.fillText('✦',25,0)}

mgUpdateHud();miniFrame=requestAnimationFrame(miniTick)}
function miniFinish(){if(!mini||mini.ended)return;let g=mini;g.ended=true;const earned=mgReward(g);state.coins+=earned;earnXP(Math.min(30,Math.floor(g.score/12)));save();mini=null;miniFrame=0;mgContent.innerHTML=`<div class="mgResult"><div class="big">${g.type==='flies'?'🪰':g.type==='heart'?'💖':'🌠'}</div><h2>Раунд завершено!</h2><p>${g.type==='heart'?'Зібрано сердечок':'Набрано балів'}: <b>${g.score}</b></p><h2 style="color:#9bf9de">+${earned} 🪙</h2><p class="mgHelp">Монети вже нараховані в загальний баланс.</p><div class="mgActionRow"><button class="mgButton" data-mini="${g.type}">↻ Ще раз</button><button class="mgButton" data-mini="menu">🎮 Усі ігри</button></div></div>`}
function addMiniObject(g){if(g.type==='flies'){const roll=Math.random();const kind=roll<.25?0:roll<.65?1:2;g.objects.push({x:30+Math.random()*460,y:36+Math.random()*250,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*70,life:2+Math.random()*1.4,kind,r:kind===0?18:kind===1?21:13,phase:Math.random()*6.28})}
else{const kind=Math.random()<.18?3:Math.floor(Math.random()*3);g.objects.push({x:22+Math.random()*476,y:-25,vy:75+Math.random()*80,kind,r:kind===3?21:17})}}
function miniTick(now){if(!mini||mini.ended)return;let g=mini;let dt=Math.max(0,Math.min(.05,(now-miniLast)/1000));miniLast=now;g.remaining=Math.max(0,g.remaining-dt);g.spawn+=dt;
if(g.type!=='heart'){const every=g.type==='flies'?.47:.42;while(g.spawn>every){g.spawn-=every;addMiniObject(g)}for(let i=g.objects.length-1;i>=0;i--){let o=g.objects[i];if(g.type==='flies'){o.x+=o.vx*dt+Math.sin(now*.006+o.phase)*.35;o.y+=o.vy*dt+Math.cos(now*.005+o.phase)*.27;o.life-=dt;if(o.x<o.r||o.x>MG_W-o.r)o.vx*=-1;if(o.y<o.r+10||o.y>MG_H-o.r-10)o.vy*=-1;if(o.life<=0)g.objects.splice(i,1)}else{o.y+=o.vy*dt;if(o.y>=MG_H-46&&Math.abs(o.x-g.basket)<43){g.score=Math.max(0,g.score+(o.kind===3?-10:o.kind===0?10:o.kind===1?15:5));g.objects.splice(i,1)}else if(o.y>MG_H+28)g.objects.splice(i,1)}}miniDraw(g,now)}mgUpdateHud();if(g.remaining<=0){miniFinish();return}miniFrame=requestAnimationFrame(miniTick)}
function miniDraw(g,now){const canvas=document.getElementById('mgCanvas');if(!canvas)return;const c=canvas.getContext('2d');if(!c)return;let bg=c.createLinearGradient(0,0,0,345);bg.addColorStop(0,g.type==='flies'?'#0e3851':'#171240');bg.addColorStop(1,g.type==='flies'?'#164c49':'#321c63');c.fillStyle=bg;c.fillRect(0,0,520,345);
for(let i=0;i<35;i++){let x=(i*107)%520,y=(i*73)%345;c.fillStyle=g.type==='flies'?'#8af9cb45':'#d8b5ff65';c.beginPath();c.arc(x,y,1.2+(i%3),0,Math.PI*2);c.fill()}
c.textAlign='center';c.textBaseline='middle';for(let o of g.objects){c.font=(o.kind===2&&g.type==='flies'?'25':'32')+'px system-ui';c.shadowColor=g.type==='flies'?'#b5ffee':'#b89bff';c.shadowBlur=12;c.fillText(g.type==='flies'?['🦟','🪰','•'][o.kind]:['⭐','🌙','✨','👾'][o.kind],o.x,o.y);if(g.type==='flies'&&o.kind===2){c.fillStyle='#a6fcff';c.beginPath();c.arc(o.x,o.y,5,0,7);c.fill()}c.shadowBlur=0}
if(g.type==='dream'){c.fillStyle='#61fff4';c.shadowColor='#61fff4';c.shadowBlur=18;c.beginPath();c.moveTo(g.basket-43,300);c.lineTo(g.basket-30,336);c.lineTo(g.basket+30,336);c.lineTo(g.basket+43,300);c.closePath();c.fill();c.shadowBlur=0;c.fillStyle='#0a3b50';c.fillRect(g.basket-31,302,62,8)}}
function canvasPos(e,can){const r=can.getBoundingClientRect();return{x:(e.clientX-r.left)*MG_W/r.width,y:(e.clientY-r.top)*MG_H/r.height}}
mgContent.addEventListener('pointerdown',e=>{if(e.target.id==='heartTap'){if(mini?.type==='heart'&&!mini.ended){mini.score++;mgUpdateHud()}return}const can=document.getElementById('mgCanvas');if(!can||e.target!==can||!mini||mini.ended)return;let pos=canvasPos(e,can),g=mini;if(g.type==='dream'){g.basket=Math.max(44,Math.min(476,pos.x));try{can.setPointerCapture(e.pointerId)}catch{};return}
for(let i=g.objects.length-1;i>=0;i--){const o=g.objects[i];if(Math.hypot(o.x-pos.x,o.y-pos.y)<o.r+12){g.score+=[15,10,5][o.kind];g.objects.splice(i,1);mgUpdateHud();break}}});
mgContent.addEventListener('pointermove',e=>{const can=document.getElementById('mgCanvas');if(can&&mini?.type==='dream'&&!mini.ended){mini.basket=Math.max(44,Math.min(476,canvasPos(e,can).x))}});
mgContent.addEventListener('click',e=>{const b=e.target.closest('[data-mini]');if(!b)return;if(b.dataset.mini==='menu')showGamesMenu();else miniStart(b.dataset.mini)});
document.getElementById('mgClose').addEventListener('click',closeMini);
mgOverlay.addEventListener('pointerdown',e=>{if(e.target===mgOverlay)closeMini()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mgOverlay.classList.contains('visible'))closeMini();if(mini?.type==='dream'&&e.key==='ArrowLeft')mini.basket=Math.max(44,mini.basket-30);if(mini?.type==='dream'&&e.key==='ArrowRight')mini.basket=Math.min(476,mini.basket+30)});


// ===== Версія 0.6: кімнати, потреби, космічна ферма, продаж =====
const needsNames={dirt:'🫧 Чистота',hunger:'🍽️ Ситість',sleep:'💤 Відпочинок',boredom:'🎲 Настрій',health:'❤️ Здоров’я'};
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
let selectedPlot=0,needAccumulator=0;
function updateRoomCleanUI(){const b=document.getElementById('roomCleanButton');if(!b||!state?.roomDirt)return;const show=state.location==='home'&&state.room<3;b.style.display=show?'block':'none';if(show){const n=Math.round(state.roomDirt[state.room]||0);b.textContent='🧹 Чистота кімнати: '+n+'%';b.classList.toggle('dirty',n<=30);}}
function updateRoomUI(){let el=document.getElementById('roomSwitcher');if(!el)return;el.classList.toggle('show',state.location==='home');el.querySelectorAll('[data-room]').forEach(b=>{let i=Number(b.dataset.room);b.classList.toggle('active',i===state.room);b.classList.toggle('locked',state.level<ROOM_LEVELS[i]);b.title=state.level<ROOM_LEVELS[i]?'Відкриється на рівні '+ROOM_LEVELS[i]:['Кімната','Спальня','Вітальня','Космічний двір'][i];b.textContent=state.level<ROOM_LEVELS[i]?'🔒':i===3?'✦':String(i+1)});}
function updateNeedsUI(){const el=document.getElementById('needsOpen');if(!el||!state.needs)return;let worst=Math.min(state.needs.dirt,state.needs.hunger,state.needs.sleep,state.needs.boredom,state.needs.health);el.classList.toggle('low',worst<=25);el.textContent=worst<=25?'⚠️ Потреби':'💗 Потреби'}
function roomSwitch(i){if(state.level<ROOM_LEVELS[i]){toast('🔒 Кімната відкриється на рівні '+ROOM_LEVELS[i]);return}if(state.location!=='home'){toast('Кімнати доступні у твоєму домі');return}if(i<0||i>3)return;state.room=i;selectedPlaced=null;dragPlaced=null;if(itemDockType==='inventory')renderItemDock();updateRoomCleanUI();pet.x=0;pet.y=0;walkTarget=null;placing=null;save();updateLocationUI();toast(i===3?'Космічний двір 🪐':'Кімната '+(i+1))}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>roomSwitch(Number(b.dataset.room)));
document.getElementById('needsOpen').onclick=()=>openPanel('needs');document.getElementById('roomCleanButton').onclick=()=>openPanel('roomClean');
document.getElementById('yardOpen').onclick=()=>{if(state.level<ROOM_LEVELS[3]){toast('🔒 Двір відкриється на рівні '+ROOM_LEVELS[3]);return}if(state.location!=='home')setLocation('home');roomSwitch(3)};
function hasPlaced(id){return state.homePlaced.some(p=>p.id===id)}
function placedInRoom(id,room){return state.homePlaced.some(p=>p.id===id&&(p.room===room||(p.room===undefined&&room===0)))}
function tickRoomDirt(){if(!state.roomDirt)return;let now=Date.now();let seconds=Math.max(0,Math.min(8*3600,(now-(state.roomDirtAt||now))/1000));if(seconds<1)return;state.roomDirtAt=now;for(let i=0;i<3;i++){let rate=placedInRoom('robot_vacuum',i) ? 0.028 : -0.007;state.roomDirt[i]=Math.max(0,Math.min(100,state.roomDirt[i]+seconds*rate));}updateRoomCleanUI();}
function cleanRoom(){if(state.location!=='home'||state.room===3){toast('Прибирати можна лише у власній кімнаті');return;}const i=state.room;if(!placedInRoom('vacuum',i)){toast('Постав звичайний пилосос у цій кімнаті');return;}state.roomDirt[i]=Math.min(100,state.roomDirt[i]+65);save();updateRoomCleanUI();toast('Кімнату прибрано! 🧹');earnXP(6);}
function roomCleanHTML(){if(state.location!=='home'||state.room===3)return '<p>Повернися у свою кімнату.</p>';let d=Math.round(state.roomDirt[state.room]);return `<p class="note">Чистота кожної кімнати враховується окремо. Пил накопичується з часом, навіть поки гра закрита (до 8 годин).</p><div class="needrow ${d<=30?'danger':''}"><b>🧹 Чистота кімнати</b><div class="needbar"><i style="width:${d}%"></i></div><strong>${d}%</strong></div><div class="footer-actions"><button class="primary" data-act="cleanRoom" ${placedInRoom('vacuum',state.room)?'':'disabled'}>🧹 Прибрати вручну</button></div><p class="note">Звичайний пилосос підвищує чистоту на 65 відсоткових пунктів за натисканням. Робот-пилосос автоматично прибирає лише кімнату, у якій стоїть. Обидва продаються у магазині → Меблі; спершу їх потрібно розмістити вдома.</p>`;}
function tickNeeds(dt){if(!state.needs)return;needAccumulator+=dt;if(needAccumulator<1)return;tickRoomDirt();let elapsed=needAccumulator;needAccumulator=0;const n=state.needs;const now=Date.now();const offline=Math.max(0,Math.min(8*3600,(now-(state.needsAt||now))/1000-elapsed));elapsed+=offline;state.needsAt=now;
 n.dirt=clamp(n.dirt-elapsed*.007);n.hunger=clamp(n.hunger-elapsed*.012);n.sleep=clamp(n.sleep-elapsed*.009);n.boredom=clamp(n.boredom-elapsed*.013);
 if(hasPlaced('auto_fridge')&&n.hunger<=30){n.hunger=clamp(n.hunger+50);if(offline<2)toast('Розумний холодильник нагодував пета 🥗')}
 if(hasPlaced('tv'))n.boredom=clamp(n.boredom+elapsed*.009);
 if(hasPlaced('toy'))n.boredom=clamp(n.boredom+elapsed*.006);
 if(n.hunger<5||n.dirt<5||n.sleep<5)n.health=clamp(n.health-elapsed*.003);
 if(Math.random()<Math.min(.000004*elapsed,.005))n.health=clamp(n.health-12);
 updateNeedsUI();if(Math.floor(clock)%12===0)debounceSave();
}
function carePet(kind){const n=state.needs;if(!n)return;let msg='';if(kind==='wash'){if(!hasPlaced('bath')&&!hasPlaced('shower')){toast('Спочатку постав ванну або душ вдома');return}n.dirt=clamp(n.dirt+70);msg='Пет помився 🛁';earnXP(8)}else if(kind==='sleep'){if(!hasPlaced('bed')){toast('Спочатку постав ліжко вдома');return}n.sleep=clamp(n.sleep+78);msg='Пет виспався 💤';earnXP(8)}else if(kind==='play'){if(!hasPlaced('toy')&&!hasPlaced('tv')){toast('Потрібна іграшка пета або телевізор');return}n.boredom=clamp(n.boredom+55);msg='Пет погрався! 🎲';earnXP(8)}else if(kind==='heal'){if(!state.owned.medicine){toast('Купи ліки в магазині');return}state.owned.medicine--;n.health=clamp(n.health+48);msg='Пет одужує 💊';earnXP(8)}else if(kind==='feed'){if(!hasPlaced('auto_fridge')){toast('Годує лише спеціальний розумний холодильник');return}n.hunger=clamp(n.hunger+50);msg='Холодильник видав їжу 🥗';earnXP(8)}save();if(msg)toast(msg)}
function needsPanelHTML(){return `<p class="note">Потреби поступово змінюються. 100% означає добрий стан: чистота, ситість, відпочинок, настрій і здоров’я. 0% означає, що потребу необхідно задовольнити.</p>${Object.entries(needsNames).map(([k,n])=>{let v=Math.round(state.needs[k]);let bad=v<25;return `<div class="needrow ${bad?'danger':''}"><b>${n}</b><div class="needbar"><i style="width:${v}%"></i></div><strong>${v}%</strong></div>`}).join('')}<div class="footer-actions"><button class="primary" data-act="care" data-val="wash">🛁 Помитися</button><button class="primary" data-act="care" data-val="sleep">💤 Поспати</button><button class="primary" data-act="care" data-val="play">🧸 Погратися</button><button class="primary" data-act="care" data-val="feed">🥗 Холодильник</button><button class="primary" data-act="care" data-val="heal">💊 Лікувати</button></div><p class="note">Предмети повинні бути розміщені у твоєму домі. Звичайний холодильник не годує. Ліки купуються окремо. Здоров’я погіршується рідко, а занедбані потреби прискорюють це.</p>`}
function plotCoords(i){const columns=3,rows=2,c=i%columns,r=Math.floor(i/columns);const w=Math.min(W*.72,580),h=Math.min(H*.37,255);return{x:W*.5-w/2+(c+.5)*w/3,y:H*.42+(r+.5)*h/2}}
function yardPlotAt(x,y){for(let i=0;i<6;i++){let p=plotCoords(i);if(Math.abs(x-p.x)<Math.min(W*.72,580)/6&&Math.abs(y-p.y)<Math.min(H*.37,255)/4)return i}return -1}
function plotReady(p){return !!p&&Date.now()>=p.readyAt}
function drawYard(){let grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#080b29');grad.addColorStop(.52,'#281448');grad.addColorStop(1,'#07475a');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<100;i++){let x=rand(i+271)*W,y=rand(i+982)*H;ellipse(x,y,1+(i%4)*.35,1+(i%3)*.35,'#c7eaff')}ellipse(W*.79,H*.23,Math.min(W*.13,80),Math.min(W*.13,80),'#795bd2');ellipse(W*.75,H*.20,Math.min(W*.09,54),Math.min(W*.09,54),'#a3a0ef');ctx.textAlign='center';ctx.fillStyle='#c9f9ff';ctx.font='bold 17px system-ui';ctx.fillText('КОСМІЧНА ФЕРМА КОМАХ',W*.5,H*.25);for(let i=0;i<6;i++){const p=plotCoords(i),plot=state.bugPlots[i],ready=plotReady(plot);drawRounded(p.x-46,p.y-32,92,65,12,ready?'#357e73':'#1e3b66');ctx.strokeStyle=ready?'#8df7bd':'#64cde2';ctx.lineWidth=2;ctx.strokeRect(p.x-43,p.y-29,86,60);ctx.fillStyle='#e7fdff';ctx.font='25px system-ui';ctx.fillText(plot?(BUGS[plot.type]?.emoji||'🐛'):'＋',p.x,p.y+7);ctx.font='11px system-ui';ctx.fillText(plot?(ready?'Зібрати':'Росте...'):'Порожньо',p.x,p.y+24)}}
function plantBug(type){let bug=BUGS[type],old=state.bugPlots[selectedPlot];if(!bug||old)return;if(state.coins<bug.seed){toast('Недостатньо монет для інкубації');return}state.coins-=bug.seed;state.bugPlots[selectedPlot]={type,readyAt:Date.now()+bug.grow*1000};save();toast('Комаху запущено в інкубатор!')}
function harvestBug(){const plot=state.bugPlots[selectedPlot];if(!plot){toast('Капсула порожня');return}if(!plotReady(plot)){toast('Комаха ще росте');return}state.bugs[plot.type]=(state.bugs[plot.type]||0)+1;state.bugPlots[selectedPlot]=null;save();earnXP(12);toast('Комаху зібрано в колекцію! 🐛')}
function sellBug(type){const bug=BUGS[type];if(!bug||!state.bugs[type])return;state.bugs[type]--;state.coins+=bug.price;save();toast('Продано '+bug.name+' за '+bug.price+' 🪙')}
function yardPanelHTML(){const plot=state.bugPlots[selectedPlot],ready=plotReady(plot);return `<p class="note">Космічний двір: вирощуй комах у шести капсулах. Час росту йде за годинником пристрою, навіть коли гру закрито.</p><div class="yardGrid">${state.bugPlots.map((p,i)=>`<button class="yardPlot ${selectedPlot===i?'active':''}" data-act="plotSelect" data-val="${i}">Капсула ${i+1}<br>${p?(BUGS[p.type]?.emoji||'🐛')+' '+(plotReady(p)?'Готово':Math.max(1,Math.ceil((p.readyAt-Date.now())/1000))+' с'):'✦ Порожня'}</button>`).join('')}</div><h3>Капсула ${selectedPlot+1}</h3>${plot?`<p>${BUGS[plot.type]?.name||'Комаха'} · ${ready?'Можна забирати':'Ще росте'}</p><button class="primary" data-act="harvestBug" ${ready?'':'disabled'}>📦 Зібрати комаху</button>`:`<div class="grid">${Object.entries(BUGS).map(([id,b])=>`<div class="item"><span class="emoji">${b.emoji}</span><b>${b.name}</b><small>Ріст: ${b.grow} с</small><button data-act="plantBug" data-val="${id}" ${state.coins<b.seed?'disabled':''}>Виростити · ${b.seed} 🪙</button></div>`).join('')}</div>`}<h3>Зібрані комахи · продаж</h3><div class="grid">${Object.entries(BUGS).map(([id,b])=>`<div class="item"><span class="emoji">${b.emoji}</span><b>${b.name}</b><small>×${state.bugs[id]||0}</small><button data-act="sellBug" data-val="${id}" ${(state.bugs[id]||0)<1?'disabled':''}>Продати +${b.price} 🪙</button></div>`).join('')}</div>`}
body.addEventListener('click',e=>{const b=e.target.closest('[data-act="plotSelect"]');if(!b)return;selectedPlot=Number(b.dataset.val);showPanel()});

load();tickRoomDirt();state.location='home';state.room=state.level>=ROOM_LEVELS[state.startRoom]?state.startRoom:0;document.getElementById('profileButton').onclick=()=>openPanel('profile');resize();updateHUD();updateLocationUI();requestAnimationFrame(render);
window.addEventListener('pagehide',save);
</script>
