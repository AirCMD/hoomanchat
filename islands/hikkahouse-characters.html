<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101326"><title>Про персонажів · Hikka House</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--pink:#ff739e;--mint:#6ae4c3;--line:#424c71;--muted:#b3b9d4}*{box-sizing:border-box}body{margin:0;min-height:100dvh;color:#f8f4fc;font-family:Inter,system-ui,Segoe UI,sans-serif;background:radial-gradient(ellipse at 30% 0%,#272044 0%,#101326 52%,#080c1a 100%)}button,a{font:inherit}button{cursor:pointer;color:inherit}.top{min-height:65px;padding:10px clamp(14px,3vw,42px);display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #ffffff26;background:#101526e8}.brand{font-family:'Russo One',sans-serif;letter-spacing:2px;font-size:21px}.brand b{color:var(--pink)}.return{color:#fce7f1;text-decoration:none;background:#272c47;border:1px solid var(--line);border-radius:11px;padding:11px 15px;font-weight:750}.return:hover,.control:hover{border-color:var(--pink);background:#38324e}main{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px)}.heading{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end;margin-bottom:21px}.heading p{margin:7px 0 0;color:var(--muted)}h1{font-size:clamp(26px,4vw,45px);line-height:1.05;margin:0;font-family:'Russo One',sans-serif;letter-spacing:1px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:10px;background:#282c45;padding:11px 15px;font-weight:750}.tab[aria-selected="true"]{background:#624462;border-color:var(--pink);color:white}.folio{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);min-height:550px;overflow:hidden;border:1px solid #ffffff33;border-radius:22px;background:linear-gradient(120deg,#202342,#151b32);box-shadow:0 23px 70px #0006}.art{position:relative;isolation:isolate;overflow:hidden;min-height:550px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,#38405d 0 35px,#303954 35px 38px)}.window,.background{position:absolute;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity 1.15s ease}.window{inset:-7%;z-index:0;transform:translate3d(var(--px,0px),var(--py,0px),0)}.background{inset:0;z-index:1;transition-duration:.75s}.hikka-tilt-button{position:absolute;z-index:9;right:12px;bottom:12px;background:#161b34de;border:1px solid #ffffff77;color:white;padding:8px 10px;border-radius:10px;font:600 12px system-ui;cursor:pointer;touch-action:manipulation}
.active{opacity:1}.flare{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 4s ease;mix-blend-mode:screen;background:radial-gradient(ellipse at 16% 5%,#fff2b969,transparent 46%),radial-gradient(ellipse at 35% 20%,#ffc77735,transparent 55%)}.art[data-scene="morning"] .flare,.art[data-scene="dawn"] .flare,.art[data-scene="noon"] .flare{opacity:1}.art[data-scene="day"] .flare{opacity:.55}.sprite{position:relative;z-index:3;width:min(76%,350px);height:min(70%,390px);min-height:280px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 13px 10px #000a);transition:opacity .2s ease, transform .2s ease}.sprite.changing{opacity:0;transform:translateY(10px) scale(.98)}.art-label{position:absolute;z-index:4;bottom:18px;left:20px;right:20px;text-align:center;padding:10px;background:#131a34c9;border:1px solid #ffffff23;border-radius:11px;letter-spacing:2px;font-size:12px;font-weight:850}.content{padding:clamp(25px,4vw,60px);display:flex;flex-direction:column;justify-content:center;gap:16px}.eyebrow{letter-spacing:2px;text-transform:uppercase;color:var(--mint);font-weight:850;font-size:12px}.title{font-family:'Russo One',sans-serif;font-size:clamp(32px,4.2vw,60px);line-height:1.07;margin:0;color:#fff1f8}.desc{font-size:clamp(16px,1.65vw,20px);line-height:1.78;color:#d6d8e9;margin:0;max-width:540px;min-height:145px}.pager{margin-top:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.control{border-radius:11px;padding:12px 17px;background:#262b47;border:1px solid var(--line);font-weight:800}.number{font-variant-numeric:tabular-nums;min-width:90px;text-align:center;color:#f4dce9;font-weight:800}.dots{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.dot{border:1px solid #72617e;background:#423752;border-radius:50%;height:10px;width:10px;padding:0}.dot.current{background:var(--pink);transform:scale(1.25)}.tip{font-size:12px;color:var(--muted);margin-top:4px}@media(max-width:760px){.folio{grid-template-columns:1fr}.art{min-height:310px;height:45dvh;max-height:460px}.sprite{height:75%;min-height:0}.content{padding:25px}.desc{min-height:0}.pager{margin-top:5px}.heading{align-items:start}.top{min-height:57px}.brand{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}.window{transform:none!important}}

/* Імена повністю поміщаються у праву колонку на всіх екранах. */
.folio > .content{min-width:0;max-width:100%;overflow-wrap:break-word}
.content .title{max-width:100%;min-width:0;font-size:clamp(27px,3.4vw,49px);line-height:1.16;overflow-wrap:anywhere;word-break:normal;hyphens:auto;text-wrap:balance}
@media (min-width:761px) and (max-width:1100px){.content{padding:clamp(22px,3vw,38px)}.content .title{font-size:clamp(25px,3.3vw,39px)}}
@media (max-width:760px){.content .title{font-size:clamp(27px,7vw,43px)}}
@media (max-width:360px){.content{padding:18px}.content .title{font-size:clamp(24px,7.2vw,31px)}}
</style></head><body>
<header class="top"><div class="brand">HIKKA <b>HOUSE</b> · БЕСТІАРІЙ</div><a href="hikkahouse-island.html" class="return" id="returnLink">← До гри</a></header>
<main><div class="heading"><div><h1>ПРО ПЕРСОНАЖІВ</h1><p>Мешканці, непрохані гості та ті, хто втручається в їхні справи.</p></div><nav class="tabs" aria-label="Категорії персонажів"><button class="tab" data-group="hiki" aria-selected="true">Хікі</button><button class="tab" data-group="boss" aria-selected="false">Боси</button><button class="tab" data-group="helper" aria-selected="false">Помічники</button></nav></div>
<section class="folio"><div class="art" id="art"><div class="window" id="w0"></div><div class="window" id="w1"></div><div class="background" id="b0"></div><div class="background" id="b1"></div><div class="flare"></div><img class="sprite" id="sprite" alt=""><div class="art-label" id="typeLabel">МЕШКАНЦІ БУДИНКУ</div></div><article class="content" aria-live="polite"><div class="eyebrow" id="kind">Герої</div><h2 class="title" id="name"></h2><p class="desc" id="desc"></p><div class="pager"><button class="control" id="prev" aria-label="Попередній персонаж">← Назад</button><div class="number" id="counter">01 / 10</div><button class="control" id="next" aria-label="Наступний персонаж">Далі →</button></div><div class="dots" id="dots" aria-label="Пагінація"></div><div class="tip">Перегортайте стрілками клавіатури або кнопками. Фон змінюється кожні три хвилини.</div></article></section></main>
<script>
const characters=[{"group": "hiki", "name": "Yani Kuroneko", "sprite": "yaniidle.gif", "alt": "yani.png", "desc": "Ігрова героїня. Обирайте Яні, займайте кімнату та захищайте її від непроханих гостей."}, {"group": "hiki", "name": "Akira Bakeneko", "sprite": "akiraidle.gif", "alt": "akira.png", "desc": "Ігровий герой. Акіра захищає особистий простір і намагається пережити ніч за своїм ПК."}, {"group": "hiki", "name": "Kate Chan", "sprite": "kateidle.gif", "alt": "kate.png", "desc": "Один із доступних ігрових персонажів Hikka House. Сидить за ПК і розвиває оборону своєї кімнати."}, {"group": "hiki", "name": "Kent White", "sprite": "kentidle.gif", "alt": "kent.png", "desc": "Один із мешканців Hikka House. Заробляє монети за ПК та зміцнює кімнату перед нападом."}, {"group": "hiki", "name": "Hiki Komori", "sprite": "hikiidle.gif", "alt": "hiki.png", "desc": "Ігровий персонаж із команди хікі. Його завдання — встояти перед нав’язливими відвідувачами."}, {"group": "hiki", "name": "Jura Kun", "sprite": "juraidle.gif", "alt": "jura.png", "desc": "Ігровий персонаж, якого можна обрати перед матчем. Будує оборону й захищає двері."}, {"group": "hiki", "name": "Sayuri Kit", "sprite": "sayuriidle.gif", "alt": "sayuri.png", "desc": "Ігрова героїня Hikka House. Оберіть її, щоб витримати навалу непроханих гостей."}, {"group": "hiki", "name": "Derek Q", "sprite": "derekidle.gif", "alt": "derek.png", "desc": "Ігровий герой. Сила захисту залежить від побудованої оборони та рішень під час матчу."}, {"group": "hiki", "name": "Kornel Vus", "sprite": "kornelidle.gif", "alt": "kornel.png", "desc": "Один із доступних хікі. Може розвивати ПК, двері та захисні пристрої."}, {"group": "hiki", "name": "Jinni Matsumatsu", "sprite": "jinniidle.gif", "alt": "jinni.png", "desc": "Ігровий персонаж Hikka House. Перемагає, якщо зуміє захистити кімнату до кінця ночі."}, {"group": "boss", "name": "Колядун", "sprite": "kolyadunwalk.gif", "alt": "kolyadun.png", "desc": "Непроханий гість, у якому дитина співає колядки, а батько наполегливо домовляється про гроші. Викликає колпосів, які можуть нападати на різні кімнати, ухилятися й відступати для лікування."}, {"group": "boss", "name": "Гелла", "sprite": "hellawalk.gif", "alt": "hella.png", "desc": "Нав’язлива мати з дитячим візком. Перед нападом трансформується, швидко б’є по дверях і відновлює здоров’я під час атаки."}, {"group": "boss", "name": "Гектор", "sprite": "hectorwalk.gif", "alt": "hector.png", "desc": "Надокучливий дідусь із пиріжками. Заводить нескінченні розмови, краде накопичену енергію мешканців і завдяки цьому лікується."}, {"group": "boss", "name": "Євген", "sprite": "evgenwalk.gif", "alt": "evgen.png", "desc": "Сусід, який постійно щось ремонтує та вимагає допомоги. Може тимчасово блокувати зброю й захисні пристрої кімнати."}, {"group": "boss", "name": "Марічка", "sprite": "marichkawalk.gif", "alt": "marichka.png", "desc": "Допитлива сусідка, яка втручається в чужі справи й знаходить мешканців за активністю. Обходить капкани, змінює кімнати та відганяє тарганів хлопалкою."}, {"group": "boss", "name": "Морій", "sprite": "moriywalk.gif", "alt": "moriy.png", "desc": "Нав’язливий проповідник і лідер групи адептів. Наполегливо прагне навернути мешканців до своєї віри, закликаючи: «Ви увіруєте!». Разом із ним приходять Антон і Деара."}, {"group": "helper", "name": "Психіатр", "sprite": "psywalk.gif", "alt": null, "desc": "Допоміжний персонаж, який може врятувати відвідувача кімнати від критичного нападу: з’являється та проганяє боса."}, {"group": "helper", "name": "Микола", "sprite": "mykolawalk.gif", "alt": null, "desc": "Непроханий, але корисний у потрібний момент знайомий. Пропонує гостям випити, і ті можуть утекти."}, {"group": "helper", "name": "Олексій", "sprite": "oleksiywalk.gif", "alt": null, "desc": "Майстер торгу на барахолці. Своїми пропозиціями й торгом здатен налякати навіть наполегливих відвідувачів."}, {"group": "helper", "name": "Шістка", "sprite": "sixwalk.gif", "alt": "six.png", "desc": "Дівчина, яка прагне дружби та вміє дивно пересуватися над землею. Відлякує гостей, а Геллі також завдає невеликої шкоди."}, {"group": "helper", "name": "Колпос", "sprite": "kolposy.gif", "alt": null, "desc": "Посіпака Колядуна. Обирає кімнати, обходить загрозливі місця, ухиляється від турелей та може відступити для відновлення сил."}, {"group": "helper", "name": "Антон", "sprite": "antonwalk.gif", "alt": "anton.png", "desc": "Вірний адепт Морія, завдяки його чарівній посмішці чимало людей стали вірянами."}, {"group": "helper", "name": "Деара", "sprite": "dearawalk.gif", "alt": "deara.png", "desc": "Вірна адептка Морія. Зачаровує словами майбутніх вірян."}];
const groups={hiki:{title:'ІГРОВІ ПЕРСОНАЖІ',eyebrow:'Мешканець Hikka House'},boss:{title:'НЕПРОХАНІ ГОСТІ',eyebrow:'Бос'},helper:{title:'ПОМІЧНИКИ ТА ПОСІПАКИ',eyebrow:'Персонаж світу Hikka House'}};
const scenes=[['morning','backgroundmorning.png','windowmorning.png'],['day','backgroundday.png','windowday.png'],['noon','backgroundnoon.png','windownoon.png'],['evening','backgroundevening.png','windowevening.png'],['night','backgroundnight.png','windownight.png'],['dawn','backgrounddawn.png','windowdawn.png']];
const assets=['../assets/','../Assets/'];let assetRoot=assets[0];
function imagePath(file){return assetRoot+file}
function spriteSource(file,alternate){const im=new Image();im.onload=()=>{if(document.getElementById('sprite').dataset.file===file)document.getElementById('sprite').src=im.src};im.onerror=()=>{if(im.dataset.fallback!=='1'){im.dataset.fallback='1';im.src=assets.find(r=>r!==assetRoot)+file}else if(alternate&&file!==alternate)spriteSource(alternate,null)};im.src=imagePath(file)}
let group='hiki',index=0;
function render(){const list=characters.filter(c=>c.group===group),p=list[index];if(!p)return;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.group===group)));document.getElementById('typeLabel').textContent=groups[group].title;document.getElementById('kind').textContent=groups[group].eyebrow;document.getElementById('name').textContent=p.name;document.getElementById('desc').textContent=p.desc;document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0');const image=document.getElementById('sprite');image.dataset.file=p.sprite;image.alt=p.name;image.classList.add('changing');spriteSource(p.sprite,p.alt);requestAnimationFrame(()=>image.classList.remove('changing'));const dots=document.getElementById('dots');dots.replaceChildren();list.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===index?' current':'');b.title=String(i+1);b.setAttribute('aria-label','Персонаж '+(i+1));b.onclick=()=>{index=i;render()};dots.append(b)})}
function move(n){const count=characters.filter(c=>c.group===group).length;index=(index+n+count)%count;render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{group=b.dataset.group;index=0;render()});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
// The asset root is probed once before scenes start.
const probe=new Image();probe.onload=()=>{assetRoot=assets[0];start()};probe.onerror=()=>{assetRoot=assets[1];start()};probe.src=assets[0]+'backgroundmorning.png';
let sceneIndex=-1,layer=0,sceneTimer=null,moveX=0,moveY=0,smoothX=0,smoothY=0,frame=0;const loaded=new Map();
function load(file){if(!file)return Promise.resolve(null);if(loaded.has(file))return loaded.get(file);const promise=new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i.src);i.onerror=()=>resolve(null);i.src=imagePath(file)});loaded.set(file,promise);return promise}
let bestiaryWindowSwitchTimeout=null;
async function showScene(n,immediate=false){
 const scene=scenes[n];const [bg,win]=await Promise.all([load(scene[1]),load(scene[2])]);
 if(!bg&&!win)return;
 if(bestiaryWindowSwitchTimeout){clearTimeout(bestiaryWindowSwitchTimeout);bestiaryWindowSwitchTimeout=null;}
 const target=sceneIndex<0?0:1-layer;
 const b=document.getElementById('b'+target),w=document.getElementById('w'+target);
 const oldB=document.getElementById('b'+layer),oldW=document.getElementById('w'+layer);
 b.style.backgroundImage=bg?`url("${bg}")`:'none';w.style.backgroundImage=win?`url("${win}")`:'none';
 if(immediate){b.style.transition='none';w.style.transition='none';}
 b.classList.add('active');if(sceneIndex>=0)oldB.classList.remove('active');
 if(immediate){w.classList.add('active');if(sceneIndex>=0)oldW.classList.remove('active');requestAnimationFrame(()=>{b.style.transition='';w.style.transition=''});}
 else{bestiaryWindowSwitchTimeout=setTimeout(()=>{w.classList.add('active');oldW.classList.remove('active');bestiaryWindowSwitchTimeout=null},950)}
 layer=target;sceneIndex=n;document.getElementById('art').dataset.scene=scene[0];
}
async function nextScene(){for(let k=1;k<=scenes.length;k++){const n=(sceneIndex+k)%scenes.length;const [bg,win]=await Promise.all([load(scenes[n][1]),load(scenes[n][2])]);if(bg||win){showScene(n);return}}}
function parallax(){frame=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const isNight=document.getElementById('art').dataset.scene==='night';const x=moveX*(isNight?3:14),y=moveY*(isNight?2:7);smoothX+=(x-smoothX)*.12;smoothY+=(y-smoothY)*.12;document.getElementById('art').style.setProperty('--px',smoothX.toFixed(2)+'px');document.getElementById('art').style.setProperty('--py',smoothY.toFixed(2)+'px');if(Math.abs(x-smoothX)>.05||Math.abs(y-smoothY)>.05)frame=requestAnimationFrame(parallax)}
const art=document.getElementById('art');art.addEventListener('pointermove',e=>{const r=art.getBoundingClientRect();moveX=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));moveY=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));if(!frame)frame=requestAnimationFrame(parallax)},{passive:true});art.addEventListener('pointerleave',()=>{moveX=moveY=0;if(!frame)frame=requestAnimationFrame(parallax)});

// Mobile tilt parallax. Activates only after a direct user gesture (iOS permission).
(function initMobileTilt(){
 if(!('DeviceOrientationEvent' in window)||!matchMedia('(pointer:coarse)').matches)return;
 const sceneArt=document.querySelector('#art');if(!sceneArt)return;
 const btn=document.createElement('button');btn.type='button';btn.className='hikka-tilt-button';btn.textContent='📱 Паралакс від нахилу';btn.setAttribute('aria-label','Увімкнути рух фону від нахилу телефона');
 sceneArt.appendChild(btn);
 let enabled=false,started=false,baseline=null;
 const clampTilt=n=>Math.max(-1,Math.min(1,n));
 const onTilt=e=>{
   if(!enabled||!Number.isFinite(e.gamma)||!Number.isFinite(e.beta))return;
   if(!baseline)baseline={gamma:e.gamma,beta:e.beta};
   moveX=clampTilt((e.gamma-baseline.gamma)/20);
   moveY=clampTilt((e.beta-baseline.beta)/25);
   if(!frame)frame=requestAnimationFrame(parallax);
 };
 btn.addEventListener('click',async()=>{
  if(enabled){enabled=false;moveX=0;moveY=0;baseline=null;btn.textContent='📱 Паралакс від нахилу';if(!frame)frame=requestAnimationFrame(parallax);;return}
  try{
   if(typeof DeviceOrientationEvent.requestPermission==='function'){const response=await DeviceOrientationEvent.requestPermission();if(response!=='granted'){btn.textContent='Датчики не дозволені';return}}
   enabled=true;baseline=null;btn.textContent='📱 Нахил увімкнено ✓';
   if(!started){window.addEventListener('deviceorientation',onTilt,{passive:true});started=true}
  }catch(err){btn.textContent='Не вдалося ввімкнути нахил'}
 });
 window.addEventListener('orientationchange',()=>{baseline=null},{passive:true});
})();

function start(){render();showScene(0,true);sceneTimer=setInterval(nextScene,180000)}
</script></body></html>
