<p class="info-lead">Hikka House — сатирична гра про захист особистого простору. Оберіть мешканця, займіть кімнату, розвивайте комп’ютер, споруджуйте оборону та переживіть візити надто наполегливих гостей.</p>
<h3>Перед грою</h3>
<p>Це вигаданий комедійно-моторошний світ. Персонажі, події та їхні надмірні реакції є частиною сатири, а не порадою щодо реальної поведінки.</p>
<h3>Застереження щодо вмісту</h3>
<p>Гра може викликати дискомфорт у людей, чутливих до певних зображень, звуків або тем:</p>
<ul>
<li><strong>Таргани та комахи:</strong> зображення таргана і його руху. Може бути неприємно людям з ентомофобією або страхом тарганів.</li>
<li><strong>Нав’язливе переслідування та порушення кордонів:</strong> гості переслідують мешканців, вимагають відчинити двері й погрожують їх зламати.</li>
<li><strong>Моторошні перетворення:</strong> зокрема, трансформація Гелли й напружені сцени нападу.</li>
<li><strong>Темрява та тривожна атмосфера:</strong> нічні сцени, небезпека й відчуття замкненого простору можуть бути неприємними при чутливості до темряви чи клаустрофобічних сюжетів.</li>
<li><strong>Звуки та рух:</strong> удари, звукові ефекти, рухомі GIF і паралакс можуть дратувати людей, чутливих до різких звуків, анімації або руху зображення.</li>
<li><strong>Соціально чутливі теми:</strong> висміювання нав’язливості, сімейного тиску, настирливого проповідництва та порушення особистих меж.</li>
</ul>
<p>Звукові ефекти та музику можна вимкнути окремими кнопками. Якщо рух зображення викликає дискомфорт, не вмикайте нахил телефона; також можна ввімкнути системне налаштування зменшення анімації.</p>
<h3>Як зберігається прогрес</h3>
<p><strong>Прогрес зберігається локально в браузері, а не в ігровому обліковому записі на сервері.</strong> Для нього використовується <code>localStorage</code> цього сайту. Зокрема, там зберігаються токени, відкриті персонажі, налаштування та ігрові результати.</p>
<p>Це <strong>не звичайний кеш картинок</strong> і не окремий файл, який можна просто знайти в «Завантаженнях». Видалення даних сайту, використання приватного режиму, зміна браузера, пристрою або адреси сайту можуть зробити збереження недоступним. Саме кешування сторінки не гарантує збереження прогресу.</p>
<p><strong>Рекомендація:</strong> регулярно створюйте резервну копію через кнопку нижче. Збережіть отриманий файл <code>.json</code> у безпечному місці. Для перенесення прогресу на інший пристрій відкрийте той самий сайт та імпортуйте файл.</p>
<div class="save-tools"><button type="button" class="control" id="exportSave">⬇ Зберегти копію прогресу</button><label class="control import-label" for="importSave">⬆ Відновити з файлу<input id="importSave" type="file" accept=".json,application/json" hidden></label></div>
<p class="small-note" id="saveStatus" role="status">Резервна копія містить локальні дані гри. Не публікуйте її без потреби. Імпорт замінить поточний прогрес у цьому браузері.</p>
<h3>Від авторки</h3>
<p class="author-placeholder">[Місце для Вашого тексту: як виникла ідея Hikka House, кому присвячено гру, що надихнуло на персонажів, побажання гравцям.]</p>
`;
const STORY_CONTENT=`
<p class="info-lead">У будинку Hikka House мешкають люди, які цінують тишу, власну кімнату та право побути наодинці.</p>
<p>Але спокій тут довго не триває. У коридорах з’являються непрохані гості: Колядун зі своїми посіпаками, Гелла, Гектор, Євген, Марічка, Морій з адептами та інші надто наполегливі відвідувачі.</p>
<p>Кожен із них має власні причини стукати у двері. У мешканців натомість є комп’ютер, захисні пристрої, помічники та просте бажання, щоб їх нарешті залишили у спокої.</p>
<h3>Продовження сюжету</h3>
<p class="author-placeholder">[Тут авторка допише основний сюжет: історію будинку, зв’язки персонажів, причину появи гостей і можливу розв’язку.]</p>
<p class="small-note">Текст цієї вкладки є чернеткою: Ви можете переписати його без змін механік гри.</p>
`;
const groups={hiki:{title:'ІГРОВІ ПЕРСОНАЖІ',eyebrow:'Мешканець Hikka House'},boss:{title:'НЕПРОХАНІ ГОСТІ',eyebrow:'Бос'},helper:{title:'ПОМІЧНИКИ ТА ПОСІПАКИ',eyebrow:'Персонаж світу Hikka House'}};
const scenes=[['morning','backgroundmorning.png','windowmorning.png'],['day','backgroundday.png','windowday.png'],['noon','backgroundnoon.png','windownoon.png'],['evening','backgroundevening.png','windowevening.png'],['night','backgroundnight.png','windownight.png'],['dawn','backgrounddawn.png','windowdawn.png']];
const assets=['../assets/','../Assets/'];let assetRoot=assets[0];
function imagePath(file){return assetRoot+file}
function spriteSource(file,alternate){const im=new Image();im.onload=()=>{if(document.getElementById('sprite').dataset.file===file)document.getElementById('sprite').src=im.src};im.onerror=()=>{if(im.dataset.fallback!=='1'){im.dataset.fallback='1';im.src=assets.find(r=>r!==assetRoot)+file}else if(alternate&&file!==alternate)spriteSource(alternate,null)};im.src=imagePath(file)}
let group='hiki',index=0;
function render(){
 const info=group==='about'||group==='story';
 document.querySelector('.folio').classList.toggle('info-mode',info);
 document.querySelector('.folio > article.content:not(.info-content)').hidden=info;
 document.getElementById('infoContent').hidden=!info;
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.group===group)));
 const sprite=document.getElementById('sprite');
 if(info){
  sprite.hidden=true;
  document.getElementById('typeLabel').textContent=group==='about'?'ПРО ГРУ':'ІСТОРІЯ БУДИНКУ';
  document.getElementById('infoKind').textContent=group==='about'?'Hikka House · інформація та безпека':'Hikka House · сюжет';
  document.getElementById('infoTitle').textContent=group==='about'?'Про гру':'Сюжет';
  document.getElementById('infoCopy').innerHTML=group==='about'?ABOUT_CONTENT:STORY_CONTENT;
  return;
 }
 sprite.hidden=false;
 const list=characters.filter(c=>c.group===group),p=list[index];if(!p)return;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.group===group)));document.getElementById('typeLabel').textContent=groups[group].title;document.getElementById('kind').textContent=groups[group].eyebrow;document.getElementById('name').textContent=p.name;document.getElementById('desc').textContent=p.desc;document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0');const image=document.getElementById('sprite');image.dataset.file=p.sprite;image.alt=p.name;image.classList.add('changing');spriteSource(p.sprite,p.alt);requestAnimationFrame(()=>image.classList.remove('changing'));const dots=document.getElementById('dots');dots.replaceChildren();list.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===index?' current':'');b.title=String(i+1);b.setAttribute('aria-label','Персонаж '+(i+1));b.onclick=()=>{index=i;render()};dots.append(b)})}
function move(n){if(group==='about'||group==='story')return;const count=characters.filter(c=>c.group===group).length;index=(index+n+count)%count;render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{group=b.dataset.group;index=0;render()});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
// The asset root is probed once before scenes start.
const probe=new Image();probe.onload=()=>{assetRoot=assets[0];start()};probe.onerror=()=>{assetRoot=assets[1];start()};probe.src=assets[0]+'backgroundmorning.png';
let sceneIndex=-1,layer=0,sceneTimer=null,moveX=0,moveY=0,smoothX=0,smoothY=0,frame=0;const loaded=new Map();
function load(file){if(!file)return Promise.resolve(null);if(loaded.has(file))return loaded.get(file);const promise=new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i.src);i.onerror=()=>resolve(null);i.src=imagePath(file)});loaded.set(file,promise);return promise}
let bestiaryWindowSwitchTimeout=null;
async function showScene(n,immediate=false){
 const scene=scenes[n];const [bg,win]=await Promise.all([load(scene[1]),load(scene[2])]);
 if(!bg&&!win)return;
 if(bestiaryWindowSwitchTimeout){clearTimeout(bestiaryWindowSwitchTimeout);bestiaryWindowSwitchTimeout=null;}
 const target=sceneIndex<0?0:1-layer;
 const b=document.getElementById('b'+target),w=document.getElementById('w'+target);
 const oldB=document.getElementById('b'+layer),oldW=document.getElementById('w'+layer);
 b.style.backgroundImage=bg?`url("${bg}")`:'none';w.style.backgroundImage=win?`url("${win}")`:'none';
 if(immediate){b.style.transition='none';w.style.transition='none';}
 b.classList.add('active');if(sceneIndex>=0)oldB.classList.remove('active');
 if(immediate){w.classList.add('active');if(sceneIndex>=0)oldW.classList.remove('active');requestAnimationFrame(()=>{b.style.transition='';w.style.transition=''});}
 else{bestiaryWindowSwitchTimeout=setTimeout(()=>{w.classList.add('active');oldW.classList.remove('active');bestiaryWindowSwitchTimeout=null},950)}
 layer=target;sceneIndex=n;document.getElementById('art').dataset.scene=scene[0];
}
async function nextScene(){for(let k=1;k<=scenes.length;k++){const n=(sceneIndex+k)%scenes.length;const [bg,win]=await Promise.all([load(scenes[n][1]),load(scenes[n][2])]);if(bg||win){showScene(n);return}}}
function parallax(){frame=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const isNight=document.getElementById('art').dataset.scene==='night';const x=moveX*(isNight?3:14),y=moveY*(isNight?2:7);smoothX+=(x-smoothX)*.12;smoothY+=(y-smoothY)*.12;document.getElementById('art').style.setProperty('--px',smoothX.toFixed(2)+'px');document.getElementById('art').style.setProperty('--py',smoothY.toFixed(2)+'px');if(Math.abs(x-smoothX)>.05||Math.abs(y-smoothY)>.05)frame=requestAnimationFrame(parallax)}
const art=document.getElementById('art');art.addEventListener('pointermove',e=>{const r=art.getBoundingClientRect();moveX=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));moveY=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2));if(!frame)frame=requestAnimationFrame(parallax)},{passive:true});art.addEventListener('pointerleave',()=>{moveX=moveY=0;if(!frame)frame=requestAnimationFrame(parallax)});

// Mobile tilt parallax. Activates only after a direct user gesture (iOS permission).
(function initMobileTilt(){
 if(!('DeviceOrientationEvent' in window)||!matchMedia('(pointer:coarse)').matches)return;
 const sceneArt=document.querySelector('#art');if(!sceneArt)return;
 const btn=document.createElement('button');btn.type='button';btn.className='hikka-tilt-button';btn.textContent='📱 Паралакс від нахилу';btn.setAttribute('aria-label','Увімкнути рух фону від нахилу телефона');
 sceneArt.appendChild(btn);
 let enabled=false,started=false,baseline=null;
 const clampTilt=n=>Math.max(-1,Math.min(1,n));
 const onTilt=e=>{
   if(!enabled||!Number.isFinite(e.gamma)||!Number.isFinite(e.beta))return;
   if(!baseline)baseline={gamma:e.gamma,beta:e.beta};
   moveX=clampTilt((e.gamma-baseline.gamma)/20);
   moveY=clampTilt((e.beta-baseline.beta)/25);
   if(!frame)frame=requestAnimationFrame(parallax);
 };
 btn.addEventListener('click',async()=>{
  if(enabled){enabled=false;moveX=0;moveY=0;baseline=null;btn.textContent='📱 Паралакс від нахилу';if(!frame)frame=requestAnimationFrame(parallax);;return}
  try{
   if(typeof DeviceOrientationEvent.requestPermission==='function'){const response=await DeviceOrientationEvent.requestPermission();if(response!=='granted'){btn.textContent='Датчики не дозволені';return}}
   enabled=true;baseline=null;btn.textContent='📱 Нахил увімкнено ✓';
   if(!started){window.addEventListener('deviceorientation',onTilt,{passive:true});started=true}
  }catch(err){btn.textContent='Не вдалося ввімкнути нахил'}
 });
 window.addEventListener('orientationchange',()=>{baseline=null},{passive:true});
})();


// Експорт/імпорт локального збереження. Не торкається даних інших сайтів.
(function setupBackup(){
 const SAVE_KEY='hikka-house-save-v1';
 function status(message){const el=document.getElementById('saveStatus');if(el)el.textContent=message}
 document.addEventListener('click',e=>{
  if(e.target?.id!=='exportSave')return;
  try{
   const raw=localStorage.getItem(SAVE_KEY);
   if(!raw){status('У цьому браузері ще немає збереженого прогресу. Спочатку запустіть гру.');return}
   const save=JSON.parse(raw);
   if(!save||typeof save!=='object'||Array.isArray(save))throw Error('Некоректне збереження');
   const json=JSON.stringify({format:'hikka-house-save-backup',version:1,exportedAt:new Date().toISOString(),save},null,2);
   const url=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'}));
   const a=document.createElement('a');a.href=url;a.download='hikka-house-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
   status('Копію створено. Збережіть JSON-файл у надійному місці.');
  }catch(err){status('Не вдалося експортувати прогрес. Перевірте налаштування браузера.')}
 });
 document.addEventListener('change',async e=>{
  if(e.target?.id!=='importSave')return;
  const input=e.target, file=input.files?.[0];if(!file)return;
  try{
   if(file.size>2_000_000)throw Error('Завеликий файл');
   const backup=JSON.parse(await file.text());
   if(backup?.format!=='hikka-house-save-backup'||backup.version!==1||!backup.save||typeof backup.save!=='object'||Array.isArray(backup.save))throw Error('Невідомий формат файлу');
   if(!Array.isArray(backup.save.skins)||typeof backup.save.tokens!=='number'||!Number.isFinite(backup.save.tokens))throw Error('Неправильні дані прогресу');
   if(!confirm('Замінити поточний прогрес у цьому браузері даними з резервної копії? Це неможливо скасувати без старого файлу.'))return;
   localStorage.setItem(SAVE_KEY,JSON.stringify(backup.save));
   status('Прогрес відновлено. Поверніться до гри та оновіть сторінку.');
  }catch(err){status('Імпорт не виконано: файл не є дійсною резервною копією Hikka House.')}
  finally{input.value=''}
 });
})();

function start(){render();showScene(0,true);sceneTimer=setInterval(nextScene,180000)}
</script>
<script id="hh-background-music-script">
(()=>{
 'use strict';
 const VIDEO_ID='KYnK6bn9yIc';
 const STORAGE_KEY='hikka-house-background-music-v1';
 const POSITION_KEY='hikka-house-background-music-position-v1';
 const btn=document.getElementById('hhMusicButton');
 if(!btn)return;
 const host=document.createElement('div');host.id='hhMusicHost';host.className='hh-music-host';host.setAttribute('aria-hidden','true');
 const frameTarget=document.createElement('div');frameTarget.id='hhMusicPlayer';host.append(frameTarget);document.body.append(host);
 let player=null,apiLoading=false,ready=false,enabled=false,requested=false;
 let resume=0;
 try{enabled=localStorage.getItem(STORAGE_KEY)==='on';const raw=sessionStorage.getItem(POSITION_KEY);if(raw){const p=JSON.parse(raw);if(p&&Date.now()-p.at<120000&&Number.isFinite(p.sec))resume=Math.max(0,p.sec)}}catch(e){}
 function label(){btn.textContent=enabled?'♫ Музика: увімк.':'♪ Музика: вимк.';btn.setAttribute('aria-pressed',String(enabled));btn.title='Фонова мелодія з YouTube. Натисніть для перемикання.';}
 function remember(){try{localStorage.setItem(STORAGE_KEY,enabled?'on':'off')}catch(e){}}
 function savePosition(){if(!ready||!player||!enabled)return;try{const sec=player.getCurrentTime();sessionStorage.setItem(POSITION_KEY,JSON.stringify({sec,at:Date.now()}))}catch(e){}}
 function startPlayer(){
   if(!enabled)return;
   if(ready&&player){try{player.unMute();player.playVideo()}catch(e){}return;}
   if(apiLoading)return;apiLoading=true;
   window.hhMusicApiReady=()=>{if(!window.YT?.Player)return;
     player=new YT.Player('hhMusicPlayer',{height:'200',width:'200',videoId:VIDEO_ID,playerVars:{autoplay:0,controls:0,loop:1,playlist:VIDEO_ID,playsinline:1,rel:0,iv_load_policy:3,disablekb:1,origin:location.origin.startsWith('http')?location.origin:undefined},events:{
       onReady:e=>{ready=true;if(resume>0){try{e.target.seekTo(resume,true)}catch(err){}}if(enabled){try{e.target.unMute();e.target.playVideo()}catch(err){}}},
       onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&enabled){try{e.target.seekTo(0,true);e.target.playVideo()}catch(err){}}},
       onError:()=>{btn.title='Не вдалося відтворити відео через YouTube. Перевірте доступність відео і блокувальники.'}
     }});
   };
   if(window.YT?.Player){window.hhMusicApiReady();return;}
   const prior=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(typeof prior==='function')prior();window.hhMusicApiReady()};
   const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.async=true;script.onerror=()=>{apiLoading=false;btn.title='YouTube API заблоковано або немає інтернету.'};document.head.append(script);
 }
 btn.addEventListener('click',()=>{
   enabled=!enabled;requested=true;remember();label();
   if(enabled)startPlayer();else if(ready&&player){savePosition();try{player.pauseVideo()}catch(e){}}
 });
 label();
 // Спроба продовжити дозволене раніше відтворення. Браузер може вимагати нового натискання.
 if(enabled){startPlayer();}
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')savePosition()});
 window.addEventListener('pagehide',savePosition);
 // Не граємо під час матчу: фонова мелодія належить саме головному меню.
 if(document.getElementById('home')){
   const home=document.getElementById('home');
   const observer=new MutationObserver(()=>{
     if(!ready||!player)return;
     try{if(home.hidden){savePosition();player.pauseVideo()}else if(enabled)player.playVideo()}catch(e){}
   });observer.observe(home,{attributes:true,attributeFilter:['hidden']});
 }
})();
</script>
