function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function formatTime(secondsAgo) {
  if (secondsAgo < 25) return "надіслано щойно";
  if (secondsAgo < 60) return "надіслано кілька сек. назад";
  const mins = Math.floor(secondsAgo / 60);
  if (mins === 1) return "надіслано 1 хв назад";
  return `надіслано ${mins} хв назад`;
}

function updateTimes() {
  const now = Date.now();
  document.querySelectorAll('.msg').forEach((el, i) => {
    const timeEl = el.querySelector('.time');
    if (timeEl && messageTimes[i]) {
      const sec = Math.floor((now - messageTimes[i]) / 1000);
      timeEl.textContent = formatTime(sec);
    }
  });
}
setInterval(updateTimes, 12000);

function showTyping(show) {
  typingEl.classList.toggle('visible', show);
  if (show) scrollToBottom();
}

function addMessage(text, from, hasPhoto = false) {
  const div = document.createElement('div');
  div.className = `msg ${from}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  if (hasPhoto) {
    const img = document.createElement('img');
    img.src = PHOTO_URL;
    img.className = 'photo-thumb';
    img.onclick = () => {
      popupImg.src = PHOTO_URL;
      popup.classList.add('show');
    };
    bubble.appendChild(document.createElement('br'));
    bubble.appendChild(img);
  }

  div.appendChild(bubble);
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = 'надіслано щойно';
  div.appendChild(time);

  messagesEl.appendChild(div);
  messageTimes.push(Date.now());
  scrollToBottom();
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function flashSend() {
  sendBtn.classList.add('active');
  await sleep(550);
  sendBtn.classList.remove('active');
}

async function typeInInput(text, speed = 45) {
  inputBox.value = '';
  for (let i = 0; i < text.length; i++) {
    if (blocked || isPaused) return false;
    inputBox.value += text[i];
    await sleep(speed + Math.random() * 25);
  }
  return true;
}

async function sendMyMessage(text) {
  const ok = await typeInInput(text);
  if (!ok) return;
  await sleep(300);
  await flashSend();
  addMessage(text, 'me');
  inputBox.value = '';
}

async function specialT9(type) {
  if (type === 't9_1') {
    // Набирає "Я шлюбна"
    await typeInInput('Я шлюбна', 50);
    await sleep(600);
    // Т9 замінює на "зайнята" — зтирає і пише нове
    for (let i = 0; i < 8; i++) {
      inputBox.value = inputBox.value.slice(0, -1);
      await sleep(70);
    }
    await typeInInput('зайнята', 40);
    await sleep(400);
    // Не встигає відправити — приходить повідомлення від нього
    // просто очищаємо поле (вона не встигла)
    inputBox.value = '';
  } else {
    // Другий раз: Т9 дає "адмінка", вона виправляє всередині
    await typeInInput('Я адмінка', 45);
    await sleep(700);
    // Виправляє літери всередині слова
    const target = 'Я шлюбна';
    for (let i = 2; i < target.length; i++) {
      inputBox.value = target.slice(0, i + 1);
      await sleep(85);
    }
    await sleep(400);
    await flashSend();
    addMessage('Я шлюбна', 'me');
    inputBox.value = '';
  }
}

async function runScript() {
  while (currentIndex < script.length) {
    if (blocked || isPaused) {
      await sleep(400);
      continue;
    }

    const item = script[currentIndex];

    if (item.from === 'them') {
      const pause = 900 + Math.random() * 1600;
      await sleep(pause);

      showTyping(true);

      // Іноді робить паузу в друкуванні (ніби виправляє)
      if (item.text.length > 55 && Math.random() > 0.45) {
        await sleep(1100 + Math.random() * 1400);
        showTyping(false);
        await sleep(800 + Math.random() * 1100);
        showTyping(true);
      }

      const typingDuration = Math.min(item.text.length * 38, 3200) + Math.random() * 900;
      await sleep(typingDuration);
      showTyping(false);

      addMessage(item.text, 'them', item.photo);
    } else {
      // ginger_wolf набирає в полі вводу
      await sleep(700 + Math.random() * 1000);

      if (item.special) {
        await specialT9(item.special);
      } else {
        await sendMyMessage(item.text);
      }
    }

    currentIndex++;
    await sleep(350 + Math.random() * 500);
  }
}

// Блокування
blockBtn.onclick = () => {
  if (!blocked) {
    blocked = true;
    blockedBanner.style.display = 'block';
    showTyping(false);
    statusEl.textContent = 'заблоковано';
    inputBox.value = '';
  } else {
    blocked = false;
    blockedBanner.style.display = 'none';
    statusEl.textContent = 'в мережі';
    if (blockReacted === false) {
      blockReacted = true;
      isPaused = true;
      setTimeout(async () => {
        showTyping(true);
        await sleep(1600);
        showTyping(false);
        addMessage('Навіщо ти мене блокувала?( я продовжу', 'them');
        isPaused = false;
      }, 700);
    }
  }
};

  if (!isFriend) {
    isFriend = true;
    friendBtn.textContent = '✓';
    if (!friendReacted) {
      friendReacted = true;
      isPaused = true;
      setTimeout(async () => {
        showTyping(true);
        await sleep(1300);
        showTyping(false);
        addMessage('о, чудово що ми знову друмени!', 'them');
        isPaused = false;
      }, 500);
    }
  } else {
    isFriend = false;
    friendBtn.textContent = '➕';
    if (friendReacted) {
      isPaused = true;
      setTimeout(async () => {
        showTyping(true);
        await sleep(1000);
        showTyping(false);
        addMessage('ок, як скажеш', 'them');
        isPaused = false;
        friendReacted = false;
      }, 400);
    }
  }
};

popupClose.onclick = () => popup.classList.remove('show');
popup.onclick = e => { if (e.target === popup) popup.classList.remove('show'); };

// Старт
setTimeout(runScript, 1400);
</script>
