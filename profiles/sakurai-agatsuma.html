<style>
html,body{
    margin:0;
    padding:0;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    line-height:14px;
    color:#222
}

*{
    box-sizing:border-box
}

#hoomenchat-site{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:12px;
    background:#fff;
    border:1px solid #777
}

a{
    color:#444
}

.hoomenchat-header{
    margin:0 0 10px;
    padding:5px 8px;
    background:linear-gradient(#626262,#3b3b3b);
    border:1px solid #222;
    color:#fff;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase
}

/* ===== КАРКАС ШАБЛОНУ ===== */

.site-layout{
    display:table;
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:10px 0
}

.site-left{
    display:table-cell;
    width:165px;
    min-width:165px;
    max-width:165px;
    vertical-align:top
}

.site-right{
    display:table-cell;
    width:auto;
    min-width:0;
    vertical-align:top
}

.left-box{
    display:block;
    width:165px;
    max-width:165px;
    min-width:165px;
    padding:3px 7px;
    background:#f0f0f0;
    border:1px solid #999;
    overflow:hidden
}

.site-name{
    width:100%;
    margin:1px 0 6px;
    padding:0 0 4px;
    border-bottom:1px solid #bcbcbc;
    color:#111;
    font-size:15px;
    line-height:17px;
    font-weight:bold;
    text-align:center;
    word-break:break-word
}

.main-avatar{
    display:block;
    width:149px;
    max-width:149px;
    height:228px;
    margin:0 0 6px;
    object-fit:cover;
    background:#ddd;
    border:1px solid #888
}

.archat-button{
    display:block;
    width:149px;
    max-width:149px;
    margin:0 0 5px;
    padding:4px 0;
    background:linear-gradient(#fff176,#fbc02d);
    border:1px solid #a78119;
    color:#000;
    font-size:10px;
    line-height:13px;
    font-weight:bold;
    text-align:center;
    text-decoration:none;
    text-transform:uppercase
}

.nav-menu{
    width:149px;
    max-width:149px;
    border-top:1px solid #999
}

.nav-item{
    display:block;
    width:149px;
    max-width:149px;
    padding:3px 2px;
    border-bottom:1px solid #c7c7c7;
    color:#444;
    font-size:11px;
    line-height:13px;
    text-decoration:underline
}

.nav-item:hover{
    background:#e2e2e2;
    color:#000;
    text-decoration:none
}

.account-box{
    width:149px;
    max-width:149px;
    margin:8px 0 0;
    padding:5px 4px;
    border-top:1px solid #999;
    text-align:center
}

.account-text{
    margin:0 0 5px;
    color:#555;
    font-size:9px;
    line-height:12px
}

.account-link{
    display:block;
    margin:2px 0;
    color:#444;
    font-size:10px;
    line-height:12px;
    font-weight:bold;
    text-decoration:underline
}

/* ===== ПРАВА ЧАСТИНА ===== */

.profile-box{
    margin:0 0 8px;
    padding:7px;
    background:#fff;
    border:1px solid #aaa
}

.profile-header{
    margin:0 0 7px;
    padding:5px 7px;
    background:#f0f0f0;
    border:1px solid #999;
    font-weight:bold
}

.profile-info{
    padding:6px 7px;
    background:#f9f9f9;
    border:1px solid #aaa;
    font-size:11px;
    line-height:15px
}

.profile-status{
    margin-top:4px;
    color:#2e7d32;
    font-size:10px;
    font-style:italic
}

.posts-header{
    margin:8px 0 5px;
    padding:4px 7px;
    background:#f0f0f0;
    border:1px solid #999;
    color:#333;
    font-size:11px;
    font-weight:bold
}

.profile-post{
    margin:0 0 7px;
    background:#fff;
    border:1px solid #aaa
}

.profile-post-title{
    padding:4px 7px;
    background:#f5f5f5;
    border-bottom:1px solid #aaa;
    font-size:11px;
    font-weight:bold
}

.profile-post-body{
    padding:6px 7px;
    color:#333;
    font-size:11px;
    line-height:15px;
    white-space:pre-wrap
}

.profile-post-date{
    padding:3px 7px;
    border-top:1px solid #ddd;
    color:#888;
    font-size:9px
}

.post-actions{
    padding:4px 7px;
    border-top:1px solid #ddd;
    background:#fafafa
}

.like-button,
.comment-button{
    margin-right:8px;
    padding:1px 3px;
    border:0;
    background:transparent;
    color:#555;
    font:10px Arial;
    cursor:pointer
}

.like-button.liked{
    color:#c62828;
    font-weight:bold
}

.comments-area{
    display:none;
    padding:6px 7px;
    background:#f8f8f8;
    border-top:1px solid #ddd
}

.comments-area.open{
    display:block
}

.fake-comment,
.user-comment{
    margin-bottom:5px;
    padding:4px 5px;
    background:#fff;
    border:1px solid #ccc;
    font-size:10px;
    line-height:13px
}

.fake-comment-name{
    margin-bottom:2px;
    font-weight:bold
}

.comment-input{
    display:block;
    width:100%;
    min-height:45px;
    padding:4px 5px;
    resize:vertical;
    background:#fff;
    border:1px solid #aaa;
    font:10px/13px Arial
}

.comment-send{
    margin-top:4px;
    padding:3px 8px;
    background:#eee;
    border:1px solid #999;
    color:#444;
    font-size:10px;
    cursor:pointer
}

.show-more{
    display:block;
    width:100%;
    margin:2px 0;
    padding:5px 7px;
    background:#f0f0f0;
    border:1px solid #999;
    color:#444;
    font-size:10px;
    font-weight:bold;
    text-align:center;
    text-decoration:underline;
    cursor:pointer
}

.show-more.hidden{
    display:none
}

.rules-box,
.statistics-box{
    margin-top:8px;
    padding:5px 8px;
    background:#fff;
    border:1px solid #aaa;
    color:#444;
    font-size:11px;
    line-height:14px
}

.statistics-box{
    font:10px/13px 'Courier New',monospace;
    color:#555
}

.statistics-title{
    margin-bottom:3px;
    color:#333;
    font:bold 10px/12px Arial
}

.statistics-online{
    color:#2e7d32;
    font-weight:bold
}

.footer-line{
    margin-top:7px;
    padding-top:4px;
    border-top:1px solid #ccc;
    color:#888;
    font-size:9px;
    text-align:center
}

/* ===== МОБІЛЬНИЙ ===== */

@media(max-width:700px){

    #hoomenchat-site{
        padding:7px
    }

    .site-layout{
        display:block;
        width:100%
    }

    .site-left,
    .site-right{
        display:block;
        width:100%;
        min-width:0;
        max-width:none
    }

    .site-left{
        margin-bottom:8px
    }

    .left-box{
        width:100%;
        max-width:none;
        min-width:0
    }

    .main-avatar,
    .archat-button,
    .nav-menu,
    .nav-item,
    .account-box{
        width:100%;
        max-width:none
    }
}
</style>
