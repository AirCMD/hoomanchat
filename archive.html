<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Архів чатів</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #fff; }
        .sidebar { width: 300px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .chat-list { overflow-y: auto; flex: 1; }
        .chat-item { padding: 15px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        .chat-item:hover, .chat-item.active { background: #2a2a2a; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 60%; padding: 10px 15px; border-radius: 8px; word-break: break-word; }
        .message.me { background: #005c4b; align-self: flex-end; }
        .message.them { background: #202c33; align-self: flex-start; }
        .compose-area { padding: 15px; background: #202c33; display: flex; gap: 10px; align-items: center; }
        .compose-area input { flex: 1; padding: 10px; border-radius: 4px; border: none; background: #2a2a2a; color: #fff; }
        .compose-area button { padding: 10px 20px; border: none; border-radius: 4px; background: #00a884; color: #fff; cursor: pointer; }
        #compose-status { font-size: 12px; color: #888; padding: 0 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid #333;">Чати</div>
        <div class="chat-list" id="chatList">
            <!-- Список чатів формується динамічно -->
        </div>
    </div>

    <div class="chat-area">
        <div class="messages-container" id="messagesContainer">
            <div style="color: #77; text-align: center; margin: auto;">Оберіть чат ліворуч</div>
        </div>
        <div id="compose-status"></div>
        <div class="compose-area" id="composeArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="Введіть повідомлення..." autofocus>
            <button onclick="sendMessage()">Надіслати</button>
        </div>
    </div>

<script>
  // Константи користувачів та старт чатів
  var users = {
    night_fox: {
      name: "Night Fox",
      firstMessage: "Привіт! Тут є одне питання, треба твоя порада.",
      keywordReplies: {
        "питання": "Ну, якщо коротко, то я застряг на одному етапі з налаштуванням заліза.",
        "допомога": "Завжди радий допомогти, якщо це в моїх силах!",
        "залізо": "О, з залізом завжди так — поки не перебереш, не запрацює."
      },
      autoReply: ["Привіт.", "Я слухаю тебе уважно.", "Цікаво звучить."]
    },
    alice: {
      name: "Alice",
      firstMessage: "Привіт! Як справи?",
      keywordReplies: {
        "як справи": "Усе чудово, працюю над архівом!",
        "погода": "Сьогодні чудова погода для кодингу."
      },
      autoReply: ["Зрозуміла.", "Цікаво!", "Розкажи детальніше."]
    }
  };

  var chats = {
    night_fox: { user: "night_fox", messages: [], loaded: false },
    alice: { user: "alice", messages: [], loaded: false }
  };

  var currentChat = null;

  function getCurrentTime() {
    var now = new Date();
    var h = String(now.getHours()).padStart(2, '0');
    var m = String(now.getMinutes()).padStart(2, '0');
    return h + ":" + m;
  }

  function renderChatList() {
    var container = document.getElementById("chatList");
    container.innerHTML = "";
    
    for (var chatId in chats) {
      var chat = chats[chatId];
      var user = users[chat.user];
      var div = document.createElement("div");
      div.className = "chat-item" + (currentChat === chatId ? " active" : "");
      div.innerHTML = "<strong>" + (user ? user.name : chatId) + "</strong>";
      div.onclick = (function(id) {
        return function() { selectChat(id); };
      })(chatId);
      container.appendChild(div);
    }
  }

  function selectChat(chatId) {
    currentChat = chatId;
    renderChatList();
    document.getElementById("composeArea").style.display = "flex";
    
    if (!chats[chatId].loaded) {
      loadChat(chatId);
    } else {
      renderConversation();
    }
  }

  function loadChat(chatId) {
    var status = document.getElementById("compose-status");
    if (status) status.textContent = "Завантаження історії...";

    fetch("hoomanchat/chats/" + chatId + ".json")
      .then(function (response) {
        if (!response.ok) throw new Error("Файл не знайдено");
        return response.json();
      })
      .then(function (data) {
        var messages = [];
        var chatUser = users[chats[chatId].user];

        if (!Array.isArray(data) && data !== null) {
          if (data.firstMessage !== undefined && chatUser) chatUser.firstMessage = data.firstMessage;
          if (data.keywordReplies && chatUser) chatUser.keywordReplies = data.keywordReplies;
          if (data.autoReply && chatUser) chatUser.autoReply = data.autoReply;

          var rawMessages = Array.isArray(data.messages) ? data.messages : [];
          messages = rawMessages.map(function (item, index) {
            return {
              from: item.from || (index % 2 === 0 ? "them" : "me"),
              type: item.type || "text",
              text: item.text || "",
              time: item.time || "00:00"
            };
          });
        }

        chats[chatId].messages = messages;
        chats[chatId].loaded = true;

        if (currentChat === chatId) renderConversation();
        renderChatList();
        if (status) status.textContent = "";
      })
      .catch(function (error) {
        // Якщо файл не знайдено або сталася помилка CORS, створюємо пустий масив
        chats[chatId].messages = [];
        chats[chatId].loaded = true;
        if (currentChat === chatId) renderConversation();
        renderChatList();
        if (status) status.textContent = "Не вдалося завантажити JSON (перевірте шлях або локальний сервер)";
      });
  }

  function renderConversation() {
    var container = document.getElementById("messagesContainer");
    container.innerHTML = "";
    
    if (!currentChat) return;
    var chat = chats[currentChat];

    for (var i = 0; i < chat.messages.length; i++) {
      var msg = chat.messages[i];
      var div = document.createElement("div");
      div.className = "message " + msg.from;
      div.textContent = msg.text;
      container.appendChild(div);
    }
    container.scrollTop = container.scrollHeight;
  }

  function sendMessage() {
    var input = document.getElementById("messageInput");
    var text = input.value.trim();
    if (!text || !currentChat) return;

    // Додаємо ваше повідомлення
    chats[currentChat].messages.push({
      from: "me",
      type: "text",
      text: text,
      time: getCurrentTime()
    });

    input.value = "";
    renderConversation();
    renderChatList();

    // Запускаємо реакцію бота з передачею тексту для пошуку тригерів
    triggerAutoReply(currentChat, text);
  }

  function triggerAutoReply(chatId, userMessageText) {
    var chat = chats[chatId];
    if (!chat) return;
    var user = users[chat.user];
    if (!user) return;

    var delay = 800 + Math.floor(Math.random() * 1000);
    
    setTimeout(function () {
      var replyText = "";
      var lowerText = String(userMessageText || "").toLowerCase();

      // 1. Шукаємо ключові слова у вашому повідомленні
      if (user.keywordReplies) {
        var keys = Object.keys(user.keywordReplies);
        for (var i = 0; i < keys.length; i++) {
          var keyword = keys[i];
          if (lowerText.indexOf(keyword) !== -1) {
            replyText = user.keywordReplies[keyword];
            break;
          }
        }
      }

      // 2. Якщо тригерних слів не знайдено — беремо випадкову фразу
      if (!replyText && user.autoReply && user.autoReply.length > 0) {
        replyText = user.autoReply[Math.floor(Math.random() * user.autoReply.length)];
      }

      if (replyText) {
        chats[chatId].messages.push({
          from: "them",
          type: "text",
          text: replyText,
          time: getCurrentTime()
        });
        renderChatList();
        if (currentChat === chatId) renderConversation();
      }
    }, delay);
  }

  // Початковий рендер списку чатів
  renderChatList();

  // Обробка натискання Enter у полі введення
  document.getElementById("messageInput").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
