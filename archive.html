  /* =========================================================

  function isBot(chatId) {
    return !!BOT_IDS[chatId];

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }


  function getCurrentTime() {
    var date = new Date();

    return String(date.getHours()).padStart(2, "0") +
      ":" +
      String(date.getMinutes()).padStart(2, "0");
  }


  /* =========================================================
     GITHUB PATH
     
     Важливо:
     якщо сторінка знаходиться, наприклад:
     
     /repo/hoomanchat/archat.html
     
     нам потрібен:
     
     /repo/hoomanchat/chats/user.json
     
     а НЕ:
     
     /repo/hoomanchat/hoomanchat/chats/user.json
     ========================================================= */

  function getChatFilePath(chatId) {

    var pathname = window.location.pathname || "";

    var marker = "/hoomanchat/";

    var markerIndex = pathname.indexOf(marker);

    if (markerIndex !== -1) {

      var siteRoot = pathname.substring(0, markerIndex);

      return (
        window.location.origin +
        siteRoot +
        "/hoomanchat/chats/" +
        encodeURIComponent(chatId) +
        ".json"
      );
    }

    /*
     * Якщо поточна сторінка вже знаходиться
     * в корені репозиторію.
     */

    return new URL(
      "hoomanchat/chats/" +
      encodeURIComponent(chatId) +
      ".json",
      document.baseURI
    ).href;
  }


  /* =========================================================
     STATUS
     ========================================================= */

  function resolveUserStatus(user) {

    if (!user) {
      return {
        text: "офлайн",
        className: "offline"
      };
    }

    var key = user.status || "offline";

    var was = user.gender !== "male" ? "була" : "був";

    var map = {

      online: {
        text: "● онлайн",
        className: "online"
      },

      "5min": {
        text: was + " 5 хв назад",
        className: "recent"
      },

      "25min": {
        text: was + " 25 хв назад",
        className: "away"
      },

      "50min": {
        text: was + " 50 хв назад",
        className: "away"
      },

      offline: {
        text: "офлайн",
        className: "offline"
      },

      "long-ago": {
        text: was + " давно",
        className: "long-ago"
      }
    };

    return map[key] || {
      text: String(key),
      className: "offline"
    };
  }


  /* =========================================================

  function renderEmojiPanel() {

    var container = get("emoji-grid");

    if (!container) return;

    container.innerHTML = "";

    emojis.forEach(function (emoji) {

      var button = document.createElement("button");

      button.type = "button";
      button.className = "emoji-button";
      button.textContent = emoji;

      button.addEventListener("click", function () {
        insertEmoji(emoji);
      });

      container.appendChild(button);
    });
  }


  function insertEmoji(emoji) {

    var input = get("message-input");

    if (!input) return;

    var start = input.selectionStart;
    var end = input.selectionEnd;

    input.value =
      input.value.substring(0, start) +
      emoji +
      input.value.substring(end);

    input.focus();

    input.setSelectionRange(
      start + emoji.length,
      start + emoji.length
    );
  }


  /* =========================================================
     CHAT LIST
     ========================================================= */

  function updateListTitle() {

    var el = get("list-title");

    if (el) {
      el.textContent =
        "Мої чати — " +
        Object.keys(chats).length;
    }
  }


  function renderChatList() {

    var container = get("chat-list");

    if (!container) return;

    container.innerHTML = "";

    Object.keys(chats).forEach(function (chatId) {

      var chat = chats[chatId];

      var user = users[chat.user];

      if (!user) return;

      var item = document.createElement("div");

      item.className =
        "chat-list-item" +
        (chatId === currentChat ? " active" : "");


      var avatar = document.createElement("img");

      avatar.className = "chat-list-avatar";
      avatar.src = user.avatar;
      avatar.alt = user.name;


      var info = document.createElement("div");

      info.className = "chat-list-info";


      var name = document.createElement("div");

      name.className = "chat-list-name";


      var profileLink = document.createElement("a");

      profileLink.href = user.profile;
      profileLink.textContent = user.name;

      profileLink.addEventListener("click", function (e) {
        e.stopPropagation();
      });


      name.appendChild(profileLink);


      var st = resolveUserStatus(user);


      var statusEl = document.createElement("div");

      statusEl.className =
        "chat-list-status " +
        st.className;

      statusEl.textContent = st.text;


      var preview = document.createElement("div");

      preview.className = "chat-list-preview";


      if (chat.messages.length > 0) {

        var last =
          chat.messages[chat.messages.length - 1];

        if (last.type === "image") {

          preview.textContent = "🖼 Зображення";

        } else if (last.type === "file") {

          preview.textContent =
            "📎 " +
            (last.fileName || "Файл");

        } else {

          preview.textContent =
            last.text || "";
        }

      } else if (chat.loadError) {

        preview.textContent =
          "Не вдалося завантажити історію";

      } else if (chat.loaded) {

        preview.textContent =
          "Немає повідомлень";

      } else {

        preview.textContent = "—";
      }


      info.appendChild(name);
      info.appendChild(statusEl);
      info.appendChild(preview);

      item.appendChild(avatar);
      item.appendChild(info);


      item.addEventListener("click", function () {
        openChat(chatId);
      });


      container.appendChild(item);
    });
  }


  /* =========================================================

     ========================================================= */

  function setMobileChatOpen(open) {

    var page = get("hoomenchat-messages-page");

    if (!page) return;

    if (open) {
      page.classList.add("mobile-chat-open");
    } else {
      page.classList.remove("mobile-chat-open");
    }
  }


  function showEmptyState() {

    var empty = get("conversation-empty");
    var active = get("conversation-active");

    if (empty) empty.style.display = "block";

    if (active) active.style.display = "none";

    setMobileChatOpen(false);
  }


  function showActiveConversation() {

    var empty = get("conversation-empty");
    var active = get("conversation-active");

    if (empty) empty.style.display = "none";

    if (active) active.style.display = "block";

    setMobileChatOpen(true);
  }


  /* =========================================================
     OPEN CHAT
     ========================================================= */

  function openChat(chatId) {

    if (!chats[chatId]) return;

    currentChat = chatId;

    pendingAttachments = [];

    renderSelectedFiles();

    renderChatList();

    showActiveConversation();


    if (!chats[chatId].loaded) {

      loadChat(chatId);

    } else {

      renderConversation();
    }
  }


  function closeChatToList() {

    currentChat = null;

    renderChatList();

    showEmptyState();
  }


  /* =========================================================
     LOAD CHAT FROM GITHUB
     ========================================================= */

  function loadChat(chatId) {

    var status = get("compose-status");

    var chat = chats[chatId];

    if (!chat) return;


    if (status) {
      status.textContent =
        "Завантаження історії...";
    }


    var filePath = getChatFilePath(chatId);


    console.log(
      "[АРЧАТ] Завантаження:",
      filePath
    );


    /*
     * cache-buster:
     * GitHub Pages іноді віддає старий JSON
     */

    var requestUrl =
      filePath +
      (filePath.indexOf("?") === -1 ? "?" : "&") +
      "v=" +
      Date.now();


    fetch(requestUrl, {
      method: "GET",
      cache: "no-store"
    })

      .then(function (response) {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            " для " +
            filePath
          );
        }

        return response.text();
      })


      .then(function (text) {

        var data;

        try {

          data = JSON.parse(text);

        } catch (jsonError) {

          console.error(
            "[АРЧАТ] GitHub повернув не JSON:",
            text.substring(0, 300)
          );

          throw new Error(
            "Файл існує, але GitHub повернув не JSON"
          );
        }


        /*
         * ІСТОРІЯ.
         *
         * Для ВСІХ користувачів.
         */

        if (Array.isArray(data.messages)) {

          chat.messages =
            data.messages.slice();

        } else {

          chat.messages = [];
        }


        /*
         * =====================================================
         * НАЛАШТУВАННЯ БОТА
         *
         * ТІЛЬКИ:
         * blue_comet
         * rusty_robot
         * night_fox
         * =====================================================
         */

        if (isBot(chatId)) {

          users[chatId].autoReply =
            Array.isArray(data.autoReply)
              ? data.autoReply.slice()
              : [];

          users[chatId].triggers =
            data.keywordReplies &&
            typeof data.keywordReplies === "object"
              ? data.keywordReplies
              : {};

          /*
           * firstMessage додаємо тільки боту
           * і тільки якщо історія порожня.
           */

          if (
            data.firstMessage &&
            chat.messages.length === 0
          ) {

            chat.messages.push({
              from: "them",
              type: "text",
              text: String(data.firstMessage),
              time: getCurrentTime()
            });
          }

        } else {

          /*
           * ЗВИЧАЙНИЙ КОРИСТУВАЧ:
           *
           * Історію залишаємо.
           *
           * Якщо в JSON є autoReply —
           * можна використовувати випадкові відповіді.
           *
           * keywordReplies НЕ перетворюємо
           * на ботські тригери.
           */

          users[chatId].autoReply =
            Array.isArray(data.autoReply)
              ? data.autoReply.slice()
              : [];

          users[chatId].triggers = {};
        }


        chat.loaded = true;
        chat.loadError = false;


        console.log(
          "[АРЧАТ] Завантажено:",
          chatId,
          "повідомлень:",
          chat.messages.length,
          "бот:",
          isBot(chatId)
        );


        if (currentChat === chatId) {
          renderConversation();
        }

        renderChatList();


        if (status) {
          status.textContent = "";
        }
      })


      .catch(function (error) {

        console.error(
          "[АРЧАТ] Помилка завантаження чату:",
          chatId,
          error
        );


        /*
         * Не ламаємо чат повністю.
         * Але позначаємо, що історію не отримали.
         */

        chat.messages = [];
        chat.loaded = true;
        chat.loadError = true;


        /*
         * Якщо це бот і JSON не завантажився,
         * залишаємо можливість побачити помилку
         * в консолі, але НЕ вигадуємо історію.
         */

        if (currentChat === chatId) {
          renderConversation();
        }

        renderChatList();


        if (status) {

          status.textContent =
            "Історію не завантажено";
        }
      });
  }

     ========================================================= */

  function renderConversationHeader() {

    var header =
      get("conversation-header");

    if (!header || !currentChat) return;


    var chat = chats[currentChat];

    var user = users[chat.user];

    if (!user) return;


    header.innerHTML = "";


    var avatar =
      document.createElement("img");

    avatar.className =
      "conversation-avatar";

    avatar.src = user.avatar;
    avatar.alt = user.name;


    var userBlock =
      document.createElement("div");

    userBlock.className =
      "conversation-user";


    var name =
      document.createElement("div");

    name.className =
      "conversation-name";


    var profileLink =
      document.createElement("a");

    profileLink.href =
      user.profile;

    profileLink.textContent =
      user.name;


    name.appendChild(profileLink);


    var st =
      resolveUserStatus(user);


    var status =
      document.createElement("div");

    status.className =
      "conversation-status " +
      st.className;

    status.textContent =
      st.text;


    userBlock.appendChild(name);
    userBlock.appendChild(status);

    header.appendChild(avatar);
    header.appendChild(userBlock);
  }


  /* =========================================================
     RENDER MESSAGES
     ========================================================= */

  function renderMessages() {

    var windowElement =
      get("messages-window");

    if (!windowElement || !currentChat) return;


    var chat =
      chats[currentChat];


    windowElement.innerHTML = "";


    chat.messages.forEach(function (message) {

      var row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          message.from === "me"
            ? "mine"
            : "theirs"
        );


      var bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";


      if (message.type === "image") {

        var img =
          document.createElement("img");

        img.className =
          "chat-image";

        img.src =
          message.url;

        img.addEventListener(
          "click",
          function () {
            openImageViewer(message.url);
          }
        );

        bubble.appendChild(img);


      } else if (message.type === "file") {

        var link =
          document.createElement("a");

        link.className =
          "chat-file";

        link.href =
          message.url;

        link.download =
          message.fileName || "file";

        link.innerHTML =
          '<span class="chat-file-icon">📎</span>' +
          escapeHtml(
            message.fileName || "Файл"
          );

        bubble.appendChild(link);


      } else {

        bubble.textContent =
          message.text || "";
      }


      var time =
        document.createElement("div");

      time.className =
        "message-time";

      time.textContent =
        message.time || "";


      row.appendChild(bubble);
      row.appendChild(time);

      windowElement.appendChild(row);
    });


    windowElement.scrollTop =
      windowElement.scrollHeight;
  }


  function renderConversation() {

    renderConversationHeader();
    renderMessages();
  }


  /* =========================================================
     ATTACHMENTS
     ========================================================= */

  function renderSelectedFiles() {

    var container =
      get("selected-files");

    if (!container) return;


    container.innerHTML = "";


    pendingAttachments.forEach(
      function (file, index) {

        var item =
          document.createElement("span");

        item.className =
          "selected-file";

        item.textContent =
          (
            file.kind === "image"
              ? "🖼 "
              : "📎 "
          ) +
          file.name;


        var remove =
          document.createElement("span");

        remove.className =
          "selected-file-remove";

        remove.textContent =
          "✕";


        remove.addEventListener(
          "click",
          function () {

            pendingAttachments.splice(
              index,
              1
            );

            renderSelectedFiles();
          }
        );


        item.appendChild(remove);

        container.appendChild(item);
      }
    );
  }


  /* =========================================================
     SEND MESSAGE
     ========================================================= */

  function sendMessage() {

    if (!currentChat) return;


    var input =
      get("message-input");

    if (!input) return;


    var text =
      input.value.trim();


    if (
      !text &&
      !pendingAttachments.length
    ) {
      return;
    }


    var now =
      getCurrentTime();


    if (text) {

      chats[currentChat].messages.push({
        from: "me",
        type: "text",
        text: text,
        time: now
      });
    }


    input.value = "";

    pendingAttachments = [];

    renderSelectedFiles();

    renderMessages();

    renderChatList();


    /*
     * Відповідь запускаємо після повідомлення.
     */

    triggerAutoReply(
      currentChat,
      text
    );
  }


  /* =========================================================
     AUTO REPLY
     
     ВАЖЛИВО:
     
     БОТИ:
       1. keywordReplies
       2. якщо тригеру нема — random autoReply
     
     НЕБОТИ:
       тільки random autoReply
       якщо він є.
     ========================================================= */

  function triggerAutoReply(
    chatId,
    userText
  ) {

    var chat =
      chats[chatId];

    if (!chat) return;


    var user =
      users[chat.user];

    if (!user) return;


    /*
     * Важливий захист:
     *
     * якщо у звичайного користувача немає
     * autoReply — він просто не відповідає.
     *
     * Але це НЕ робить його ботом.
     */

    var hasAutoReply =
      Array.isArray(user.autoReply) &&
      user.autoReply.length > 0;


    var hasTriggers =
      isBot(chatId) &&
      user.triggers &&
      typeof user.triggers === "object";


    if (!hasAutoReply && !hasTriggers) {
      return;
    }


    var delay =
      800 +
      Math.floor(
        Math.random() * 1000
      );


    setTimeout(function () {

      /*
       * Якщо чат вже закрили —
       * відповідь все одно додаємо
       * в історію, як реальна переписка.
       */


      var replyText = "";


      /*
       * =====================================================
       * ТРИГЕРИ — ТІЛЬКИ БОТИ
       * =====================================================
       */

      if (
        isBot(chatId) &&
        hasTriggers &&
        userText
      ) {

        var lowerText =
          userText.toLowerCase();


        for (
          var trigger in user.triggers
        ) {

          if (
            !Object.prototype.hasOwnProperty.call(
              user.triggers,
              trigger
            )
          ) {
            continue;
          }


          if (
            lowerText.indexOf(
              String(trigger).toLowerCase()
            ) !== -1
          ) {

            replyText =
              user.triggers[trigger];

            break;
          }
        }
      }


      /*
       * =====================================================
       * RANDOM AUTOREPLY
       *
       * Для бота — якщо тригер не спрацював.
       *
       * Для звичайного користувача —
       * це єдиний тип автоматичної відповіді.
       * =====================================================
       */

      if (
        !replyText &&
        hasAutoReply
      ) {

        replyText =
          user.autoReply[
            Math.floor(
              Math.random() *
              user.autoReply.length
            )
          ];
      }


      /*
       * Додаємо відповідь.
       */

      if (replyText) {

        chat.messages.push({
          from: "them",
          type: "text",
          text: String(replyText),
          time: getCurrentTime()
        });


        renderChatList();


        if (currentChat === chatId) {
          renderMessages();
        }
      }

    }, delay);
  }


  /* =========================================================
     INPUT
     ========================================================= */

  function setupInput() {

    var input =
      get("message-input");

    var button =
      get("send-button");

    var emojiButton =
      get("emoji-button");

    var emojiPanel =
      get("emoji-panel");

    var backBtn =
      get("conversation-back");


    if (button) {

      button.addEventListener(
        "click",
        sendMessage
      );
    }


    if (backBtn) {

      backBtn.addEventListener(
        "click",
        closeChatToList
      );
    }


    if (input) {

      input.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();
          }
        }
      );
    }


    if (
      emojiButton &&
      emojiPanel
    ) {

      emojiButton.addEventListener(
        "click",
        function () {

          emojiPanel.classList.toggle(
            "open"
          );
        }
      );
    }
  }


  /* =========================================================
     IMAGE VIEWER
     ========================================================= */

  function openImageViewer(url) {

    var viewer =
      get("image-viewer");

    var image =
      get("image-viewer-image");


    if (!viewer || !image) return;


    image.src = url;

    viewer.classList.add("open");
  }


  function closeImageViewer() {

    var viewer =
      get("image-viewer");

    if (viewer) {
      viewer.classList.remove("open");
    }
  }


  function setupImageViewer() {

    var viewer =
      get("image-viewer");

    var close =
      get("image-viewer-close");


    if (
      viewer &&
      close
    ) {

      close.addEventListener(
        "click",
        closeImageViewer
      );


      viewer.addEventListener(
        "click",
        function (e) {

          if (
            e.target === viewer
          ) {
            closeImageViewer();
          }
        }
      );
    }
  }


  /* =========================================================
     START
     ========================================================= */

  updateListTitle();

  renderEmojiPanel();

  renderChatList();

  showEmptyState();

  setupInput();

  setupImageViewer();


  /*
   * Для діагностики одразу видно,
   * який шлях буде використовуватись.
   */

  console.log(
    "[АРЧАТ] Боти:",
    Object.keys(BOT_IDS)
  );

  console.log(
    "[АРЧАТ] Приклад шляху JSON:",
    getChatFilePath("pixel_heart")
  );

})();
</script>
