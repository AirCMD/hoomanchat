  function get(id) {

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getExtension(fileName) {
    var cleanName = String(fileName || "").toLowerCase().split("?")[0].split("#")[0];
    var dot = cleanName.lastIndexOf(".");
    return dot === -1 ? "" : cleanName.substring(dot);
  }

  function isAllowedImage(file) {
    if (!file) return { allowed: false, reason: "Файл не визначено." };
    if (!allowedImageTypes[file.type]) {
      return { allowed: false, reason: "Дозволені лише JPG, PNG, GIF, WebP, HEIC." };
    }
    if (file.size > MAX_IMAGE_SIZE) {
      return { allowed: false, reason: "Зображення завелике. Максимум 10 MB." };
    }
    return { allowed: true };
  }

  function isAllowedFile(file) {
    if (!file) return { allowed: false, reason: "Файл не визначено." };
    if (file.size > MAX_FILE_SIZE) {
      return { allowed: false, reason: "Файл завеликий. Максимум 20 MB." };
    }
    var extension = getExtension(file.name);
    if (blockedExtensions[extension]) {
      return { allowed: false, reason: "Цей тип файлу заборонений." };
    }
    return { allowed: true };
  }

  function insertEmoji(emoji) {
    var input = get("message-input");
    if (!input) return;
    var start = input.selectionStart;
    var end = input.selectionEnd;
    input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
    input.focus();
    input.setSelectionRange(start + emoji.length, start + emoji.length);
  }

  function renderChatList() {
    var container = get("chat-list");
    if (!container) return;
    container.innerHTML = "";

    Object.keys(chats).forEach(function(chatId) {
      var chat = chats[chatId];
      var user = users[chat.user];
      if (!user) return;

      var item = document.createElement("div");
      item.className = "chat-list-item" + (chatId === currentChat ? " active" : "");

      var avatar = document.createElement("img");
      avatar.className = "chat-list-avatar";
      avatar.src = user.avatar;
      avatar.alt = user.name;

      var info = document.createElement("div");
      info.className = "chat-list-info";

      var name = document.createElement("div");
      name.className = "chat-list-name";
      var profileLink = document.createElement("a");
      profileLink.href = user.profile;
      profileLink.textContent = user.name;
      profileLink.addEventListener("click", function(e) { e.stopPropagation(); });
      name.appendChild(profileLink);

      var preview = document.createElement("div");
      preview.className = "chat-list-preview";

      if (chat.messages.length > 0) {
        var last = chat.messages[chat.messages.length - 1];
        if (last.type === "image") {
          preview.textContent = "🖼 Зображення";
        } else if (last.type === "file") {
          preview.textContent = "📎 " + last.fileName;
        } else {
          preview.textContent = last.text || "";
        }
      } else {
        preview.textContent = chat.loaded ? "Немає повідомлень" : "Завантаження...";
      }

      info.appendChild(name);
      info.appendChild(preview);
      item.appendChild(avatar);
      item.appendChild(info);

      item.addEventListener("click", function() {
        openChat(chatId);
      });

      container.appendChild(item);
    });
  }

  function openChat(chatId) {
    if (!chats[chatId]) return;

    currentChat = chatId;
    pendingAttachments = [];
    renderSelectedFiles();
    renderChatList();

    if (!chats[chatId].loaded) {
      loadChat(chatId);
    } else {
      renderConversation();
    }
  }

  function loadChat(chatId) {
    var status = get("compose-status");
    if (status) status.textContent = "Завантаження...";

    fetch("/hoomanchat/chats/" + chatId + ".json")
      .then(function(response) {
        if (!response.ok) throw new Error("Файл не знайдено");
        return response.json();
      })
      .then(function(data) {
        chats[chatId].messages = data.messages || [];
        chats[chatId].loaded = true;

        if (currentChat === chatId) {
          renderConversation();
        }
        renderChatList();

        if (status) status.textContent = "";
      })
      .catch(function(error) {
        console.error("Помилка завантаження чату:", error);
        chats[chatId].messages = [];
        chats[chatId].loaded = true;

        if (currentChat === chatId) {
          renderConversation();
        }
        renderChatList();

        if (status) {
          status.textContent = "Чат порожній або файл відсутній";
          setTimeout(function() {
            if (status.textContent === "Чат порожній або файл відсутній") {
              status.textContent = "";
            }
          }, 3000);
        }
      });
  }

      row.className = "message-row " + (message.from === "me" ? "mine" : "theirs");

      } else {
        bubble.textContent = message.text || "";

      time.className = "message-time";
      time.textContent = message.time || "";

      row.appendChild(bubble);
      row.appendChild(time);
      windowElement.appendChild(row);
    });

    windowElement.scrollTop = windowElement.scrollHeight;
  }

  function getCurrentTime() {
    var date = new Date();
    var hours = String(date.getHours()).padStart(2, "0");
    var minutes = String(date.getMinutes()).padStart(2, "0");
    return hours + ":" + minutes;
  }

  function renderSelectedFiles() {
    var container = get("selected-files");
    if (!container) return;
    container.innerHTML = "";

    pendingAttachments.forEach(function(file, index) {
      var item = document.createElement("span");
      item.className = "selected-file";
      item.appendChild(document.createTextNode((file.kind === "image" ? "🖼 " : "📎 ") + file.name));

      var remove = document.createElement("span");
      remove.className = "selected-file-remove";
      remove.textContent = "✕";
      remove.addEventListener("click", function() {
        removePendingFile(index);
      });
      item.appendChild(remove);
      container.appendChild(item);
    });
  }

  function removePendingFile(index) {
    if (!pendingAttachments[index]) return;
    var attachment = pendingAttachments[index];
    if (attachment.url && attachment.url.indexOf("blob:") === 0) {
      try { URL.revokeObjectURL(attachment.url); } catch (e) {}
    }
    pendingAttachments.splice(index, 1);
    renderSelectedFiles();
  }

  function handleFiles(fileList, kind) {
    if (!fileList) return;

    Array.prototype.forEach.call(fileList, function(file) {
      if (!file) return;

      if (kind === "image") {
        var imageCheck = isAllowedImage(file);
        if (!imageCheck.allowed) {
          showStatus(imageCheck.reason);
          return;
        }

        var reader = new FileReader();
        reader.onload = function(event) {
          pendingAttachments.push({
            kind: "image",
            name: file.name,
            url: event.target.result,
            size: file.size,
            type: file.type || "image/jpeg"
          });
          renderSelectedFiles();
        };
        reader.onerror = function() {
          showStatus("Не вдалося прочитати зображення.");
        };
        reader.readAsDataURL(file);
        return;
      }

      var fileCheck = isAllowedFile(file);
      if (!fileCheck.allowed) {
        showStatus(fileCheck.reason);
        return;
      }

      var fileUrl = URL.createObjectURL(file);
      pendingAttachments.push({
        kind: "file",
        name: file.name,
        url: fileUrl,
        size: file.size,
        type: file.type
      });
    });

    renderSelectedFiles();
  }

  function showStatus(text) {
    var status = get("compose-status");
    if (!status) return;
    status.textContent = text;
    setTimeout(function() {
      if (status.textContent === text) status.textContent = "";
    }, 3500);
  }

  function sendMessage() {
    var input = get("message-input");
    if (!input) return;

    var text = input.value.trim();
    var hasText = text.length > 0;
    var hasAttachments = pendingAttachments.length > 0;

    if (!hasText && !hasAttachments) {
      showStatus("Введіть повідомлення або прикріпіть файл.");
      return;
    }

    var now = getCurrentTime();

    if (hasText) {
      chats[currentChat].messages.push({
        from: "me",
        type: "text",
        text: text,
        time: now
      });
    }

    pendingAttachments.forEach(function(attachment) {
      chats[currentChat].messages.push({
        from: "me",
        type: attachment.kind,
        text: "",
        url: attachment.url,
        fileName: attachment.name,
        mime: attachment.type,
        time: now
      });
    });

    input.value = "";
    pendingAttachments = [];
    renderSelectedFiles();
    renderMessages();
    renderChatList();
    showStatus("Надіслано.");
    triggerAutoReply(currentChat);
  }

  function triggerAutoReply(chatId) {
    var chat = chats[chatId];
    if (!chat) return;
    var user = users[chat.user];
    if (!user || !Array.isArray(user.autoReply) || user.autoReply.length === 0) return;

    var delay = 700 + Math.floor(Math.random() * 1400);
    setTimeout(function() {
      var reply = user.autoReply[Math.floor(Math.random() * user.autoReply.length)];
      chats[chatId].messages.push({
        from: "them",
        type: "text",
        text: reply,
        time: getCurrentTime()
      });
      renderChatList();
      if (currentChat === chatId) renderMessages();
    }, delay);
  }

  function setupInput() {
    var input = get("message-input");
    var button = get("send-button");
    var emojiButton = get("emoji-button");
    var emojiPanel = get("emoji-panel");
    var imageButton = get("image-button");
    var fileButton = get("file-button");
    var imageInput = get("image-input");
    var fileInput = get("file-input");

    if (button) button.addEventListener("click", sendMessage);

    if (input) {
      input.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    }

    if (emojiButton && emojiPanel) {
      emojiButton.addEventListener("click", function() {
        emojiPanel.classList.toggle("open");
      });
    }

    if (imageButton && imageInput) {
      imageButton.addEventListener("click", function() { imageInput.click(); });
      imageInput.addEventListener("change", function() {
        handleFiles(imageInput.files, "image");
        imageInput.value = "";
      });
    }

    if (fileButton && fileInput) {
      fileButton.addEventListener("click", function() { fileInput.click(); });
      fileInput.addEventListener("change", function() {
        handleFiles(fileInput.files, "file");
        fileInput.value = "";
      });
    }
  }

  function openImageViewer(url, alt) {
    var viewer = get("image-viewer");
    var image = get("image-viewer-image");
    if (!viewer || !image || !url) return;

    if (viewer.parentNode !== document.body) {
      document.body.appendChild(viewer);
    }

    viewer.style.position = "fixed";
    viewer.style.left = "0";
    viewer.style.top = "0";
    viewer.style.right = "0";
    viewer.style.bottom = "0";
    viewer.style.width = "100vw";
    viewer.style.height = "100vh";
    viewer.style.zIndex = "2147483647";

    image.src = url;
    image.alt = alt || "";
    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeImageViewer() {
    var viewer = get("image-viewer");
    var image = get("image-viewer-image");
    if (!viewer) return;
    viewer.classList.remove("open");
    if (image) {
      image.src = "";
      image.alt = "";
    }
    document.body.style.overflow = "";
  }

  function setupImageViewer() {
    var viewer = get("image-viewer");
    var close = get("image-viewer-close");
    if (!viewer) return;

    if (viewer.parentNode !== document.body) {
      document.body.appendChild(viewer);
    }

    if (close) {
      close.addEventListener("click", function(event) {
        event.stopPropagation();
        closeImageViewer();
      });
    }

    viewer.addEventListener("click", function(event) {
      if (event.target === viewer) closeImageViewer();
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeImageViewer();
    });
  }

  // Запуск
  renderEmojiPanel();
  renderChatList();
  openChat(currentChat); // одразу відкриваємо перший чат
  renderSelectedFiles();
  setupInput();
  setupImageViewer();

})();
</script>

</body>
</html>
