<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГУМЕНЧАТ — АРЧАТ</title>
<link rel="icon" type="image/svg+xml" href="planet-favicon.svg">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  line-height: 14px;
  color: #222;
}
* { box-sizing: border-box; }

#hoomenchat-messages-page {
  display: block;
  width: 100%;
  max-width: 780px;
  margin: 10px auto;
  padding: 12px;
  background: #fff;
  border: 1px solid #777;
  min-height: 100vh;
  min-height: 100dvh;
}

#hoomenchat-messages-page .chat-header {
  display: block;
  margin: 0 0 10px 0;
  padding: 5px 8px;
  background: linear-gradient(to bottom, #626262, #3b3b3b);
  border: 1px solid #222;
  color: #fff;
  font-size: 12px;
  line-height: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#hoomenchat-messages-page .messages-layout {
  display: table;
  width: 100%;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 10px 0;
}

#hoomenchat-messages-page .chat-list-column {
  display: table-cell;
  width: 220px;
  vertical-align: top;
}

#hoomenchat-messages-page .conversation-column {
  display: table-cell;
  width: auto;
  vertical-align: top;
}

#hoomenchat-messages-page .list-title {
  margin: 0;
  padding: 5px 7px;
  background: #f0f0f0;
  border: 1px solid #999;
  color: #333;
  font-size: 11px;
  line-height: 13px;
  font-weight: bold;
}

#hoomenchat-messages-page .chat-list {
  margin: 0;
  padding: 0;
  background: #fff;
  border: 1px solid #aaa;
  border-top: 0;
  max-height: 430px;
  overflow-y: auto;
  overflow-x: hidden;
}

#hoomenchat-messages-page .chat-list::-webkit-scrollbar { width: 8px; }
#hoomenchat-messages-page .chat-list::-webkit-scrollbar-track { background: #f0f0f0; }
#hoomenchat-messages-page .chat-list::-webkit-scrollbar-thumb {
  background: #aaa;
  border: 1px solid #888;
}

#hoomenchat-messages-page .chat-list-item {
  display: block;
  width: 100%;
  margin: 0;
  padding: 6px;
  background: #f7f7f7;
  border-bottom: 1px solid #ccc;
  color: #222;
  text-decoration: none;
  cursor: pointer;
}
#hoomenchat-messages-page .chat-list-item:last-child { border-bottom: 0; }
#hoomenchat-messages-page .chat-list-item:hover { background: #e8e8e8; }
#hoomenchat-messages-page .chat-list-item.active {
  background: #dedede;
  border-left: 3px solid #555;
}

#hoomenchat-messages-page .chat-list-avatar {
  display: inline-block;
  width: 45px;
  height: 45px;
  margin-right: 6px;
  vertical-align: middle;
  object-fit: cover;
  background: #ddd;
  border: 1px solid #888;
}

#hoomenchat-messages-page .chat-list-info {
  display: inline-block;
  width: calc(100% - 58px);
  vertical-align: middle;
}

#hoomenchat-messages-page .chat-list-name {
  margin: 0;
  color: #111;
  font-size: 11px;
  line-height: 13px;
  font-weight: bold;
  word-wrap: break-word;
}
#hoomenchat-messages-page .chat-list-name a {
  color: #111;
  text-decoration: underline;
}

#hoomenchat-messages-page .chat-list-status {
  margin-top: 1px;
  font-size: 9px;
  line-height: 11px;
  font-style: italic;
}
#hoomenchat-messages-page .chat-list-status.online { color: #2e7d32; }
#hoomenchat-messages-page .chat-list-status.recent { color: #558b2f; }
#hoomenchat-messages-page .chat-list-status.away { color: #f9a825; }
#hoomenchat-messages-page .chat-list-status.offline,
#hoomenchat-messages-page .chat-list-status.long-ago { color: #9e9e9e; }

#hoomenchat-messages-page .chat-list-preview {
  margin-top: 3px;
  color: #777;
  font-size: 9px;
  line-height: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#hoomenchat-messages-page .conversation-box {
  position: relative;
  background: #fff;
  border: 1px solid #999;
}

#hoomenchat-messages-page .conversation-header {
  min-height: 58px;
  padding: 6px 8px;
  background: #f0f0f0;
  border-bottom: 1px solid #999;
}

#hoomenchat-messages-page .conversation-back {
  display: none;
  margin: 0 0 6px 0;
  padding: 6px 8px;
  background: #eee;
  border: 1px solid #999;
  color: #333;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
#hoomenchat-messages-page .conversation-back:hover { background: #ddd; }

#hoomenchat-messages-page .conversation-avatar {
  display: inline-block;
  width: 45px;
  height: 45px;
  margin-right: 7px;
  vertical-align: middle;
  object-fit: cover;
  background: #ddd;
  border: 1px solid #888;
}

#hoomenchat-messages-page .conversation-user {
  display: inline-block;
  vertical-align: middle;
  max-width: calc(100% - 60px);
}

#hoomenchat-messages-page .conversation-name {
  display: block;
  color: #111;
  font-size: 13px;
  line-height: 15px;
  font-weight: bold;
}
#hoomenchat-messages-page .conversation-name a {
  color: #111;
  text-decoration: underline;
}

#hoomenchat-messages-page .conversation-status {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  line-height: 11px;
  font-style: italic;
}
#hoomenchat-messages-page .conversation-status.online { color: #2e7d32; }
#hoomenchat-messages-page .conversation-status.recent { color: #558b2f; }
#hoomenchat-messages-page .conversation-status.away { color: #f9a825; }
#hoomenchat-messages-page .conversation-status.offline,
#hoomenchat-messages-page .conversation-status.long-ago { color: #9e9e9e; }

#hoomenchat-messages-page .messages-window {
  height: 350px;
  padding: 8px;
  background: #fafafa;
  overflow-y: auto;
  overflow-x: hidden;
}

#hoomenchat-messages-page .conversation-empty {
  padding: 40px 16px;
  text-align: center;
  color: #888;
  font-size: 12px;
  line-height: 16px;
  background: #fafafa;
  border: 1px solid #999;
  min-height: 200px;
}

#hoomenchat-messages-page .message-row {
  display: block;
  margin: 0 0 9px 0;
  clear: both;
}
#hoomenchat-messages-page .message-row.mine { text-align: right; }
#hoomenchat-messages-page .message-row.theirs { text-align: left; }

#hoomenchat-messages-page .message-bubble {
  display: inline-block;
  max-width: 78%;
  padding: 6px 8px;
  background: #fff;
  border: 1px solid #aaa;
  color: #222;
  font-size: 11px;
  line-height: 14px;
  text-align: left;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
#hoomenchat-messages-page .mine .message-bubble {
  background: #f0f0f0;
  border-color: #888;
}

#hoomenchat-messages-page .message-time {
  margin-top: 2px;
  color: #999;
  font-size: 8px;
  line-height: 10px;
}

#hoomenchat-messages-page .chat-image {
  display: block;
  max-width: 100%;
  max-height: 220px;
  margin: 0;
  background: #ddd;
  border: 1px solid #888;
  cursor: pointer;
  object-fit: contain;
}

#hoomenchat-messages-page .chat-file {
  display: block;
  min-width: 150px;
  max-width: 100%;
  padding: 6px 7px;
  background: #f4f4f4;
  border: 1px solid #aaa;
  color: #333;
  text-decoration: none;
  font-size: 10px;
  line-height: 13px;
  overflow-wrap: anywhere;
}
#hoomenchat-messages-page .chat-file:hover { background: #e6e6e6; color: #000; }
#hoomenchat-messages-page .chat-file-icon { margin-right: 5px; }

#hoomenchat-messages-page .message-compose {
  padding: 7px;
  background: #f0f0f0;
  border-top: 1px solid #999;
}

#hoomenchat-messages-page .compose-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 5px;
}

#hoomenchat-messages-page .tool-button {
  display: inline-block;
  padding: 6px 10px;
  background: #eeeeee;
  border: 1px solid #999;
  color: #444;
  font-size: 12px;
  line-height: 14px;
  cursor: pointer;
  min-height: 32px;
}
#hoomenchat-messages-page .tool-button:hover { background: #ddd; color: #000; }

#hoomenchat-messages-page .hidden-file-input { display: none; }

#hoomenchat-messages-page .emoji-panel {
  display: none;
  margin: 0 0 5px 0;
  padding: 5px;
  background: #fff;
  border: 1px solid #999;
}
#hoomenchat-messages-page .emoji-panel.open { display: block; }

#hoomenchat-messages-page .emoji-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

#hoomenchat-messages-page .emoji-button {
  width: 32px;
  height: 32px;
  padding: 0;
  background: #fff;
  border: 1px solid #ccc;
  font-size: 16px;
  line-height: 30px;
  cursor: pointer;
}

#hoomenchat-messages-page .message-input {
  display: block;
  width: 100%;
  min-height: 55px;
  margin: 0 0 5px 0;
  padding: 8px;
  background: #fff;
  border: 1px solid #999;
  color: #222;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px;
  line-height: 15px;
  resize: vertical;
}

#hoomenchat-messages-page .selected-files { margin: 0 0 5px 0; }

#hoomenchat-messages-page .selected-file {
  display: inline-block;
  margin: 2px 4px 2px 0;
  padding: 3px 5px;
  background: #fff;
  border: 1px solid #bbb;
  color: #555;
  font-size: 9px;
  max-width: 100%;
  overflow-wrap: anywhere;
}

#hoomenchat-messages-page .selected-file-remove {
  margin-left: 4px;
  color: #888;
  cursor: pointer;
  font-weight: bold;
}

#hoomenchat-messages-page .send-button {
  display: inline-block;
  padding: 8px 14px;
  background: linear-gradient(to bottom, #fff176, #fbc02d);
  border: 1px solid #a78119;
  color: #000;
  font-size: 11px;
  line-height: 14px;
  font-weight: bold;
  cursor: pointer;
  min-height: 36px;
}

#hoomenchat-messages-page .compose-status {
  display: inline-block;
  margin-left: 7px;
  color: #777;
  font-size: 9px;
}

#hoomenchat-messages-page .back-link {
  display: block;
  margin: 8px 0 0 0;
  padding: 8px 10px;
  background: #f0f0f0;
  border: 1px solid #aaa;
  color: #444;
  font-size: 12px;
  text-decoration: underline;
}

body > .image-viewer {
  display: none;
  position: fixed;
  left: 0; top: 0; right: 0; bottom: 0;
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 20px;
  background: rgba(0,0,0,0.80);
  z-index: 2147483647;
  align-items: center;
  justify-content: center;
}
body > .image-viewer.open { display: flex; }
body > .image-viewer img {
  max-width: 92vw;
  max-height: 88vh;
  object-fit: contain;
  background: #fff;
  border: 1px solid #fff;
}
body > .image-viewer .image-viewer-close {
  position: fixed;
  top: 12px;
  right: 15px;
  width: 36px;
  height: 36px;
  color: #fff;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.8);
  font-size: 22px;
  line-height: 34px;
  text-align: center;
  cursor: pointer;
}

@media screen and (max-width: 650px) {
  #hoomenchat-messages-page {
    margin: 0;
    padding: 8px;
    border: none;
    max-width: none;
  }
  #hoomenchat-messages-page .chat-header { padding: 10px; font-size: 13px; }
  #hoomenchat-messages-page .messages-layout { display: block; border-spacing: 0; }
  #hoomenchat-messages-page .chat-list-column,
  #hoomenchat-messages-page .conversation-column { display: block; width: 100%; }
  #hoomenchat-messages-page.mobile-chat-open .chat-list-column { display: none; }
  #hoomenchat-messages-page:not(.mobile-chat-open) .conversation-column { display: none; }
  #hoomenchat-messages-page .conversation-back { display: block; }
  #hoomenchat-messages-page .list-title { font-size: 13px; padding: 10px; }
  #hoomenchat-messages-page .chat-list { max-height: none; border: 1px solid #aaa; }
  #hoomenchat-messages-page .chat-list-item { padding: 10px; min-height: 64px; }
  #hoomenchat-messages-page .chat-list-avatar { width: 48px; height: 48px; }
  #hoomenchat-messages-page .chat-list-name { font-size: 13px; line-height: 16px; }
  #hoomenchat-messages-page .chat-list-status { font-size: 11px; }
  #hoomenchat-messages-page .chat-list-preview {
    font-size: 11px;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  #hoomenchat-messages-page .conversation-header { min-height: 64px; padding: 10px; }
  #hoomenchat-messages-page .conversation-name { font-size: 15px; }
  #hoomenchat-messages-page .conversation-status { font-size: 11px; }
  #hoomenchat-messages-page .messages-window {
    height: calc(100dvh - 280px);
    min-height: 240px;
    max-height: 55dvh;
  }
  #hoomenchat-messages-page .message-bubble {
    max-width: 88%;
    font-size: 13px;
    line-height: 17px;
    padding: 8px 10px;
  }
  #hoomenchat-messages-page .message-compose { padding: 10px; }
  #hoomenchat-messages-page .message-input { font-size: 14px; min-height: 64px; }
  #hoomenchat-messages-page .back-link { font-size: 13px; padding: 12px; min-height: 44px; }
  #hoomenchat-messages-page .conversation-empty { min-height: 40dvh; font-size: 14px; padding: 48px 20px; }
}
</style>

<div id="hoomenchat-messages-page">
  <div class="chat-header">АРЧАТ — ПРИВАТНІ ЧАТИ</div>
  <div class="messages-layout">
    <div class="chat-list-column">
      <div class="list-title" id="list-title">Мої чати</div>
      <div class="chat-list" id="chat-list"></div>
    </div>
    <div class="conversation-column">
      <button class="conversation-back" id="conversation-back" type="button">← До списку чатів</button>
      <div class="conversation-box" id="conversation-box">
        <div class="conversation-empty" id="conversation-empty">
          Оберіть чат зі списку зліва,<br>щоб відкрити переписку.
        </div>
        <div id="conversation-active" style="display:none">
          <div class="conversation-header" id="conversation-header"></div>
          <div class="messages-window" id="messages-window"></div>
          <div class="message-compose">
            <div class="compose-tools">
              <button class="tool-button" id="emoji-button" type="button">😊</button>
              <button class="tool-button" id="image-button" type="button">🖼</button>
              <button class="tool-button" id="file-button" type="button">📎</button>
              <input class="hidden-file-input" id="image-input" type="file" accept="image/*" multiple>
              <input class="hidden-file-input" id="file-input" type="file" multiple>
            </div>
            <div class="emoji-panel" id="emoji-panel">
              <div class="emoji-grid" id="emoji-grid"></div>
            </div>
            <div class="selected-files" id="selected-files"></div>
            <textarea class="message-input" id="message-input" placeholder="Написати повідомлення..."></textarea>
            <button class="send-button" id="send-button" type="button">НАДІСЛАТИ</button>
            <span class="compose-status" id="compose-status"></span>
          </div>
        </div>
      </div>
      <a class="back-link" href="index.html">← Повернутися до Гуменчату</a>
    </div>
  </div>
</div>

<div class="image-viewer" id="image-viewer">
  <div class="image-viewer-close" id="image-viewer-close">✕</div>
  <img id="image-viewer-image" src="" alt="">
</div>

  var chats = {};
  Object.keys(users).forEach(function(uKey) {
    chats[uKey] = { user: uKey, messages: [], loaded: false };
  });

  var currentChat = null;
  var pendingAttachments = [];

  function get(id) { return document.getElementById(id); }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function resolveUserStatus(user) {
    if (!user) return { text: "офлайн", className: "offline" };
    var key = user.status || "offline";
    var was = user.gender !== "male" ? "була" : "був";
    var map = {
      online: { text: "● онлайн", className: "online" },
      "5min": { text: was + " 5 хв назад", className: "recent" },
      "25min": { text: was + " 25 хв назад", className: "away" },
      "50min": { text: was + " 50 хв назад", className: "away" },
      offline: { text: "офлайн", className: "offline" },
      "long-ago": { text: was + " давно", className: "long-ago" }
    };
    return map[key] || { text: String(key), className: "offline" };
  }

  function renderEmojiPanel() {
    var container = get("emoji-grid");
    if (!container) return;
    container.innerHTML = "";
    emojis.forEach(function (emoji) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "emoji-button";
      button.textContent = emoji;
      button.addEventListener("click", function () { insertEmoji(emoji); });
      container.appendChild(button);
    });
  }

  function insertEmoji(emoji) {
    var input = get("message-input");
    if (!input) return;
    var start = input.selectionStart;
    var end = input.selectionEnd;
    input.value = input.value.substring(0, start) + emoji + input.value.substring(end);
    input.focus();
    input.setSelectionRange(start + emoji.length, start + emoji.length);
  }

  function updateListTitle() {
    var el = get("list-title");
    if (el) el.textContent = "Мої чати — " + Object.keys(chats).length;
  }

  function renderChatList() {
    var container = get("chat-list");
    if (!container) return;
    container.innerHTML = "";

    Object.keys(chats).forEach(function (chatId) {
      var chat = chats[chatId];
      var user = users[chat.user];
      if (!user) return;

      var item = document.createElement("div");
      item.className = "chat-list-item" + (chatId === currentChat ? " active" : "");

      var avatar = document.createElement("img");
      avatar.className = "chat-list-avatar";
      avatar.src = user.avatar;
      avatar.alt = user.name;

      var info = document.createElement("div");
      info.className = "chat-list-info";

      var name = document.createElement("div");
      name.className = "chat-list-name";
      var profileLink = document.createElement("a");
      profileLink.href = user.profile;
      profileLink.textContent = user.name;
      profileLink.addEventListener("click", function (e) { e.stopPropagation(); });
      name.appendChild(profileLink);

      var st = resolveUserStatus(user);
      var statusEl = document.createElement("div");
      statusEl.className = "chat-list-status " + st.className;
      statusEl.textContent = st.text;

      var preview = document.createElement("div");
      preview.className = "chat-list-preview";
      if (chat.messages.length > 0) {
        var last = chat.messages[chat.messages.length - 1];
        if (last.type === "image") preview.textContent = "🖼 Зображення";
        else if (last.type === "file") preview.textContent = "📎 " + last.fileName;
        else preview.textContent = last.text || "";
      } else {
        preview.textContent = chat.loaded ? "Немає повідомлень" : "—";
      }

      info.appendChild(name);
      info.appendChild(statusEl);
      info.appendChild(preview);
      item.appendChild(avatar);
      item.appendChild(info);

      item.addEventListener("click", function () { openChat(chatId); });
      container.appendChild(item);
    });
  }

  function setMobileChatOpen(open) {
    var page = get("hoomenchat-messages-page");
    if (!page) return;
    if (open) page.classList.add("mobile-chat-open");
    else page.classList.remove("mobile-chat-open");
  }

  function showEmptyState() {
    var empty = get("conversation-empty");
    var active = get("conversation-active");
    if (empty) empty.style.display = "block";
    if (active) active.style.display = "none";
    setMobileChatOpen(false);
  }

  function showActiveConversation() {
    var empty = get("conversation-empty");
    var active = get("conversation-active");
    if (empty) empty.style.display = "none";
    if (active) active.style.display = "block";
    setMobileChatOpen(true);
  }

  function openChat(chatId) {
    if (!chats[chatId]) return;
    currentChat = chatId;
    pendingAttachments = [];
    renderSelectedFiles();
    renderChatList();
    showActiveConversation();

    if (!chats[chatId].loaded) loadChat(chatId);
    else renderConversation();
  }

  function closeChatToList() {
    currentChat = null;
    renderChatList();
    showEmptyState();
  }

  function loadChat(chatId) {
    var status = get("compose-status");
    if (status) status.textContent = "Завантаження...";

    // Повністю робочий шлях до файлів у репозиторії GitHub
    var url = "hoomanchat/chats/" + chatId + ".json";

    fetch(url)
      .then(function (response) {
        if (!response.ok) throw new Error("Файл не знайдено");
        return response.json();
      })
      .then(function (data) {
        chats[chatId].messages = data.messages || [];

        if (users[chatId]) {
          if (data.autoReply) {
            users[chatId].autoReply = data.autoReply;
          }
          if (data.keywordReplies) {
            users[chatId].triggers = data.keywordReplies;
          }
          if (data.firstMessage && chats[chatId].messages.length === 0) {
            chats[chatId].messages.push({
              from: "them",
              type: "text",
              text: data.firstMessage,
              time: getCurrentTime()
            });
          }
        }

        chats[chatId].loaded = true;
        if (currentChat === chatId) renderConversation();
        renderChatList();
        if (status) status.textContent = "";
      })
      .catch(function () {
        chats[chatId].messages = [];
        chats[chatId].loaded = true;
        if (currentChat === chatId) renderConversation();
        renderChatList();
        if (status) status.textContent = "";
      });
  }

  function renderConversationHeader() {
    var header = get("conversation-header");
    if (!header || !currentChat) return;
    var chat = chats[currentChat];
    var user = users[chat.user];
    if (!user) return;

    header.innerHTML = "";
    var avatar = document.createElement("img");
    avatar.className = "conversation-avatar";
    avatar.src = user.avatar;
    avatar.alt = user.name;

    var userBlock = document.createElement("div");
    userBlock.className = "conversation-user";

    var name = document.createElement("div");
    name.className = "conversation-name";
    var profileLink = document.createElement("a");
    profileLink.href = user.profile;
    profileLink.textContent = user.name;
    name.appendChild(profileLink);

    var st = resolveUserStatus(user);
    var status = document.createElement("div");
    status.className = "conversation-status " + st.className;
    status.textContent = st.text;

    userBlock.appendChild(name);
    userBlock.appendChild(status);
    header.appendChild(avatar);
    header.appendChild(userBlock);
  }

  function renderMessages() {
    var windowElement = get("messages-window");
    if (!windowElement || !currentChat) return;
    var chat = chats[currentChat];
    windowElement.innerHTML = "";

    chat.messages.forEach(function (message) {
      var row = document.createElement("div");
      row.className = "message-row " + (message.from === "me" ? "mine" : "theirs");
      var bubble = document.createElement("div");
      bubble.className = "message-bubble";

      if (message.type === "image") {
        var img = document.createElement("img");
        img.className = "chat-image";
        img.src = message.url;
        img.addEventListener("click", function () { openImageViewer(message.url); });
        bubble.appendChild(img);
      } else if (message.type === "file") {
        var link = document.createElement("a");
        link.className = "chat-file";
        link.href = message.url;
        link.download = message.fileName || "file";
        link.innerHTML = '<span class="chat-file-icon">📎</span>' + escapeHtml(message.fileName || "Файл");
        bubble.appendChild(link);
      } else {
        bubble.textContent = message.text || "";
      }

      var time = document.createElement("div");
      time.className = "message-time";
      time.textContent = message.time || "";

      row.appendChild(bubble);
      row.appendChild(time);
      windowElement.appendChild(row);
    });
    windowElement.scrollTop = windowElement.scrollHeight;
  }

  function renderConversation() {
    renderConversationHeader();
    renderMessages();
  }

  function getCurrentTime() {
    var date = new Date();
    return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
  }

  function renderSelectedFiles() {
    var container = get("selected-files");
    if (!container) return;
    container.innerHTML = "";
    pendingAttachments.forEach(function (file, index) {
      var item = document.createElement("span");
      item.className = "selected-file";
      item.textContent = (file.kind === "image" ? "🖼 " : "📎 ") + file.name;
      var remove = document.createElement("span");
      remove.className = "selected-file-remove";
      remove.textContent = "✕";
      remove.addEventListener("click", function () {
        pendingAttachments.splice(index, 1);
        renderSelectedFiles();
      });
      item.appendChild(remove);
      container.appendChild(item);
    });
  }

  function sendMessage() {
    if (!currentChat) return;
    var input = get("message-input");
    if (!input) return;
    var text = input.value.trim();
    if (!text && !pendingAttachments.length) return;

    var now = getCurrentTime();
    if (text) {
      chats[currentChat].messages.push({ from: "me", type: "text", text: text, time: now });
    }
    input.value = "";
    pendingAttachments = [];
    renderSelectedFiles();
    renderMessages();
    renderChatList();
    triggerAutoReply(currentChat, text);
  }

  function triggerAutoReply(chatId, userText) {
    var chat = chats[chatId];
    if (!chat) return;
    var user = users[chat.user];
    if (!user) return;

    var delay = 800 + Math.floor(Math.random() * 1000);
    setTimeout(function () {
      var replyText = "";
      var triggers = user.triggers || user.keywordReplies;

      if (triggers && userText) {
        var lowerText = userText.toLowerCase();
        for (var trig in triggers) {
          if (lowerText.indexOf(trig.toLowerCase()) !== -1) {
            replyText = triggers[trig];
            break;
          }
        }
      }
      if (!replyText && user.autoReply && user.autoReply.length) {
        replyText = user.autoReply[Math.floor(Math.random() * user.autoReply.length)];
      }
      if (replyText) {
        chat.messages.push({ from: "them", type: "text", text: replyText, time: getCurrentTime() });
        renderChatList();
        if (currentChat === chatId) renderMessages();
      }
    }, delay);
  }

  function setupInput() {
    var input = get("message-input");
    var button = get("send-button");
    var emojiButton = get("emoji-button");
    var emojiPanel = get("emoji-panel");
    var backBtn = get("conversation-back");

    if (button) button.addEventListener("click", sendMessage);
    if (backBtn) backBtn.addEventListener("click", closeChatToList);

    if (input) {
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
    }

    if (emojiButton && emojiPanel) {
      emojiButton.addEventListener("click", function () {
        emojiPanel.classList.toggle("open");
      });
    }
  }

  function openImageViewer(url) {
    var viewer = get("image-viewer");
    var image = get("image-viewer-image");
    if (!viewer || !image) return;
    image.src = url;
    viewer.classList.add("open");
  }

  function closeImageViewer() {
    var viewer = get("image-viewer");
    if (viewer) viewer.classList.remove("open");
  }

  function setupImageViewer() {
    var viewer = get("image-viewer");
    var close = get("image-viewer-close");
    if (viewer && close) {
      close.addEventListener("click", closeImageViewer);
      viewer.addEventListener("click", function(e) { if (e.target === viewer) closeImageViewer(); });
    }
  }

  updateListTitle();
  renderEmojiPanel();
  renderChatList();
  showEmptyState();
  setupInput();
  setupImageViewer();
})();
</script>
