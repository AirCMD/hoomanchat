<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГУМЕНЧАТ — Генератор дописів в гумгайлі гумена</title>
<style>
html, body {
  margin: 0; padding: 0;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 12px; line-height: 15px; color: #222;
}
* { box-sizing: border-box; }
#wrap {
  max-width: 780px; margin: 0 auto; padding: 12px;
  border: 1px solid #777; min-height: 100vh;
}
h1 {
  margin: 0 0 8px 0; padding: 6px 8px;
  background: linear-gradient(to bottom, #626262, #3b3b3b);
  border: 1px solid #222; color: #fff;
  font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
}
.hint { color: #777; font-size: 10px; margin: 0 0 10px; }
.box {
  margin: 0 0 10px 0; padding: 8px;
  border: 1px solid #888; background: #fff;
}
.comment-box {
  margin: 6px 0; padding: 6px;
  background: #f4f4f4; border: 1px solid #ccc;
}
label { display: block; margin: 0 0 2px; font-weight: bold; color: #444; font-size: 11px; }
input, textarea {
  width: 100%; padding: 7px 8px;
  border: 1px solid #999; font: inherit; color: #222; background: #fff;
}
textarea { min-height: 72px; resize: vertical; }
.field { margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
.btn {
  display: inline-block; margin: 2px 4px 2px 0; padding: 7px 12px;
  border: 1px solid #999; background: #eee; font: inherit; font-weight: bold; cursor: pointer;
}
.btn:hover { background: #ddd; }
.btn-main {
  background: linear-gradient(to bottom, #fff176, #fbc02d);
  border-color: #a78119; color: #000;
}
.btn-danger { background: #f5e0e0; border-color: #a66; color: #600; }
#output {
  width: 100%; min-height: 240px;
  font-family: "Courier New", monospace; font-size: 11px; line-height: 14px;
}
.ok { color: #2e7d32; font-weight: bold; margin-left: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Генератор дописів</h1>
  <p class="hint">Збирає шматки <code>profile-post</code> для вставки в <code>#profile-posts</code>. Вподобайки не можуть бути &lt; 0.</p>

  <div id="posts"></div>
  <button type="button" class="btn" id="add-post">+ Допис</button>

  <div style="margin-top:12px">
    <button type="button" class="btn btn-main" id="generate">Згенерувати код</button>
    <button type="button" class="btn" id="copy">Копіювати</button>
    <span class="ok" id="copy-ok" hidden>Скопійовано</span>
  </div>
  <p class="hint">Встав усередину <code>&lt;div id="profile-posts"&gt; … &lt;/div&gt;</code></p>
  <textarea id="output" readonly placeholder="Тут зʼявиться HTML дописів..."></textarea>
</div>

<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function nickToHref(nick) {
    return String(nick || "").trim().toLowerCase()
      .replace(/_/g, "-")
      .replace(/\s+/g, "-") + ".html";
  }

  function clampLikes(input) {
    var v = parseInt(input.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    input.value = String(v);
    return v;
  }

  var postsEl = document.getElementById("posts");
  var output = document.getElementById("output");
  var seq = 0;

  function addComment(wrap, nick, text) {
    var c = document.createElement("div");
    c.className = "comment-box";
    c.innerHTML =
      '<div class="grid">' +
      '<div class="field"><label>Нік автора</label>' +
      '<input type="text" class="c-nick" placeholder="bondar_call" value="' + esc(nick || "") + '"></div>' +
      '<div class="field"><label>Текст</label>' +
      '<input type="text" class="c-text" placeholder="Текст коментаря..." value="' + esc(text || "") + '"></div>' +
      '</div>' +
      '<button type="button" class="btn btn-danger c-del">Видалити коментар</button>';
    c.querySelector(".c-del").onclick = function () { c.remove(); };
    wrap.appendChild(c);
  }

  function addPost() {
    seq++;
    var box = document.createElement("div");
    box.className = "box";
    box.innerHTML =
      "<strong>Допис #" + seq + "</strong>" +
      '<div class="field"><label>Тема</label>' +
      '<input type="text" class="p-title" placeholder="Заголовок допису"></div>' +
      '<div class="field"><label>Текст</label>' +
      '<textarea class="p-body" placeholder="Текст допису..."></textarea></div>' +
      '<div class="grid">' +
      '<div class="field"><label>Дата</label>' +
      '<input type="text" class="p-date" placeholder="9 квітня"></div>' +
      '<div class="field"><label>Вподобайки (≥ 0)</label>' +
      '<input type="number" class="p-likes" min="0" step="1" value="0"></div>' +
      "</div>" +
      '<div class="comments-wrap"><div class="hint">Коментарі (необовʼязково)</div></div>' +
      '<button type="button" class="btn p-add-c">+ Коментар</button> ' +
      '<button type="button" class="btn btn-danger p-del">Видалити допис</button>';

    var wrap = box.querySelector(".comments-wrap");
    var likesEl = box.querySelector(".p-likes");
    likesEl.addEventListener("change", function () { clampLikes(likesEl); });
    likesEl.addEventListener("blur", function () { clampLikes(likesEl); });
    likesEl.addEventListener("input", function () {
      if (likesEl.value === "") return;
      if (/^-/.test(likesEl.value)) likesEl.value = "0";
    });

    box.querySelector(".p-add-c").onclick = function () { addComment(wrap, "", ""); };
    box.querySelector(".p-del").onclick = function () { box.remove(); };
    postsEl.appendChild(box);
  }

  document.getElementById("add-post").onclick = addPost;
  addPost();

  function build() {
    var chunks = [];
    var index = 0;
    postsEl.querySelectorAll(".box").forEach(function (box) {
      var title = (box.querySelector(".p-title").value || "").trim();
      var body = (box.querySelector(".p-body").value || "").trim();
      var date = (box.querySelector(".p-date").value || "").trim() || "—";
      var likes = clampLikes(box.querySelector(".p-likes"));
      if (!title && !body) return;

      var comments = [];
      box.querySelectorAll(".comment-box").forEach(function (c) {
        var cn = (c.querySelector(".c-nick").value || "").trim();
        var ct = (c.querySelector(".c-text").value || "").trim();
        if (!cn && !ct) return;
        comments.push({ nick: cn, text: ct });
      });

      index++;
      var commentsHtml = comments.map(function (c) {
        return (
          '<div class="fake-comment">\n' +
          '<div class="fake-comment-name"><a href="' + esc(nickToHref(c.nick)) + '">' + esc(c.nick) + "</a></div>\n" +
          esc(c.text) + "\n" +
          "</div>"
        );
      }).join("\n");

      chunks.push(
        "<!-- ДОПИС " + index + " -->\n" +
        '<div class="profile-post">\n' +
        '<div class="profile-post-title">' + esc(title) + "</div>\n" +
        '<div class="profile-post-body">' + esc(body) + "</div>\n" +
        '<div class="post-actions">\n' +
        '<button class="like-button" type="button" data-base-likes="' + likes + '">♡ Подобається <span class="like-count">' + likes + "</span></button>\n" +
        '<button class="comment-button" type="button">💬 Коментарі <span class="comment-count">' + comments.length + "</span></button>\n" +
        "</div>\n" +
        '<div class="comments-area">\n' +
        (commentsHtml ? commentsHtml + "\n" : "") +
        '<div class="comment-form">\n' +
        '<textarea class="comment-input" placeholder="Написати коментар..."></textarea>\n' +
        '<button class="comment-send" type="button">Відправити</button>\n' +
        "</div>\n" +
        "</div>\n" +
        '<div class="profile-post-date">' + esc(date) + "</div>\n" +
        "</div>"
      );
    });

    if (!chunks.length) {
      alert("Додай хоча б один допис (тема або текст)");
      return "";
    }
    return chunks.join("\n\n");
  }

  document.getElementById("generate").onclick = function () {
    var code = build();
    if (code) output.value = code;
  };

  document.getElementById("copy").onclick = function () {
    if (!output.value) document.getElementById("generate").click();
    if (!output.value) return;
    output.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(output.value).then(function () {
        var ok = document.getElementById("copy-ok");
        ok.hidden = false;
        setTimeout(function () { ok.hidden = true; }, 2000);
      });
    } else {
      document.execCommand("copy");
    }
  };
})();
</script>
</body>
</html>
