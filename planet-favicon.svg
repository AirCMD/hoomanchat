  <!-- Азія -->
  <path d="M 20 10 Q 23 11 24 14 Q 22 16 20 15 Z" fill="#2d8f2d"/>
  
  <!-- Америка -->
  <ellipse cx="8" cy="14" rx="3" ry="4" fill="#2d8f2d"/>
  
